<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回带 · REWINDER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f}
body{display:flex;align-items:center;justify-content:center;font-family:'Courier New','Noto Serif SC',monospace;color:#e8ecff}
#wrap{position:relative;line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 90px rgba(255,77,109,.07),0 0 26px rgba(0,0,0,.85)}
#ui{position:absolute;inset:0;line-height:1.5;pointer-events:none;color:#e8ecff}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,7,15,.86);text-align:center;transition:opacity .6s;backdrop-filter:blur(2px);padding:0 8%}
.screen.hidden{opacity:0;visibility:hidden}
#title h1{font-size:54px;letter-spacing:20px;text-indent:20px;font-weight:700;color:#e8ecff;text-shadow:0 0 26px rgba(255,77,109,.35),3px 3px 0 #1a2138}
#title .sub{font-size:12px;letter-spacing:11px;text-indent:11px;color:#c0a080;margin-top:10px}
#title .tip{font-size:13px;color:#8b93b8;margin-top:30px;letter-spacing:3px}
#title .keys{font-size:11px;color:#6a7396;margin-top:12px;letter-spacing:1px;line-height:2}
#title .keys b{color:#ffd873}
#title .press{font-size:13px;color:#ffd873;margin-top:46px;animation:blink 1.5s infinite;letter-spacing:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
#lvname{position:absolute;top:24%;width:100%;text-align:center;font-size:28px;letter-spacing:9px;text-indent:9px;color:#e8ecff;text-shadow:0 0 18px rgba(192,160,128,.4),2px 2px 0 #1a2138;opacity:0;transition:opacity .6s}
#lvname span{display:block;font-size:13px;letter-spacing:6px;color:#c0a080;margin-top:8px}
#lvname.show{opacity:1}
#lvname.fadeout{opacity:0}
#hint{position:absolute;bottom:7%;width:100%;text-align:center;font-size:12px;color:#a8b0d0;background:rgba(10,13,29,.7);padding:8px 12px;letter-spacing:2px;opacity:0;transition:opacity .6s;border-top:1px solid rgba(192,160,128,.15);border-bottom:1px solid rgba(192,160,128,.15)}
#hint.show{opacity:1}
#hint.fadeout{opacity:0}
#mute{position:absolute;top:5%;width:100%;text-align:center;font-size:12px;color:#ffd873;opacity:0;transition:opacity .3s;letter-spacing:2px}
#mute:not(:empty){opacity:1}
#end h1{font-size:20px;letter-spacing:6px;color:#e8ecff;font-weight:700}
#endstats{font-size:12px;color:#c0a080;margin-top:12px;letter-spacing:1px}
#endstats b{color:#ff4d6d}
#endtext{margin-top:22px;max-height:56%;overflow:auto;text-align:left;max-width:620px;font-size:12px;line-height:2;color:#c9d2f5;letter-spacing:.5px;scrollbar-width:thin;scrollbar-color:#2a3352 transparent}
#endtext::-webkit-scrollbar{width:4px}
#endtext::-webkit-scrollbar-thumb{background:#2a3352;border-radius:2px}
#endtext p{margin:9px 0}
#endtext p.dim{color:#6a7396;font-style:italic}
#endtext .big{font-size:16px;color:#e8ecff;letter-spacing:3px;margin-bottom:8px}
#endtext .big2{margin-top:18px;font-size:14px;color:#ff4d6d;letter-spacing:3px;text-align:center}
#endtext b{color:#ffd873}
#end .press{font-size:12px;color:#ffd873;margin-top:22px;letter-spacing:3px;animation:blink 1.7s infinite}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="ui">
  <div id="title" class="screen">
    <h1>回带</h1>
    <p class="sub">R E W I N D E R</p>
    <p class="tip">让世界退回一秒，只要一秒就好。</p>
    <p class="keys">
      <b>← →</b> / AD 移动　　<b>空格</b> 跳<br>
      <b>按住 R</b> 让世界倒退　　<b>死掉的瞬间</b>也能按 R 把自己拉回来<br>
      <b>M</b> 静音
    </p>
    <p class="press">— 按任意键，开始 —</p>
  </div>
  <div id="lvname" class="hidden"></div>
  <div id="hint" class="hidden"></div>
  <div id="mute"></div>
  <div id="rec" class="hidden"></div>
  <div id="end" class="screen hidden">
    <h1>—</h1>
    <p id="endstats"></p>
    <div id="endtext"></div>
    <p class="press">— 按 R 再走一遍 —</p>
  </div>
</div>
</div>
