<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地平线旷野 · Horizon Wild 开放世界驾驶</title>
<style>
:root{--accent:#ffb84d;--panel:rgba(14,20,32,.82);--line:rgba(255,255,255,.14);--ok:#3fe0a0;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0e1626;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#eaf0f7;user-select:none}
canvas{display:block}
#game{position:fixed;inset:0}
.hidden{display:none!important}
#boot{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#0e1626;color:#9fb0c4;font-size:14px;letter-spacing:3px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;backdrop-filter:blur(4px)}
#speedPanel{bottom:16px;left:16px;text-align:center;min-width:150px}
#speedVal{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;line-height:1.05;text-shadow:0 2px 14px rgba(0,0,0,.4)}
#speedVal.nitro{color:var(--accent)}
#speedUnit{font-size:11px;color:#9aa8b8;letter-spacing:3px;margin-top:2px}
#gearVal{position:absolute;right:14px;top:12px;font-size:15px;font-weight:700;color:#9fd8ff;font-variant-numeric:tabular-nums;letter-spacing:1px}
#nitroWrap{margin-top:8px}
#nitroLabel{display:flex;justify-content:space-between;font-size:10px;color:#8fa0b3;letter-spacing:2px;margin-bottom:3px}
#nitroBar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
#nitroFill{height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#4d8dff,#3fe0e0);transition:width .06s linear}
#nitroFill.on{background:linear-gradient(90deg,#ff8a3d,#ffd23f);box-shadow:0 0 12px rgba(255,150,60,.8)}
#starCount{top:14px;left:16px;font-size:15px;color:#ffd23f;letter-spacing:1px}
#starCount b{font-variant-numeric:tabular-nums}
#banner{position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:12;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#banner.show{opacity:1}
#banner .bt{font-size:34px;font-weight:800;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.55);letter-spacing:2px}
#banner .bs{font-size:16px;color:#ffd9a0;margin-top:6px;letter-spacing:3px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#banner .bt.gold{color:var(--accent)}
#driftScore{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:11;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#driftScore.show{opacity:1}
#driftScore .ds{font-size:28px;font-weight:700;color:#9fd8ff;text-shadow:0 0 18px rgba(80,160,255,.6);font-variant-numeric:tabular-nums}
#driftScore .dt{font-size:12px;color:#bcd8f2;letter-spacing:4px;margin-top:2px}
#minimapWrap{bottom:16px;right:16px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:rgba(14,20,32,.72)}
#minimap{display:block}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:11;font-size:13px;color:#cfe0f2;background:rgba(14,20,32,.72);border:1px solid var(--line);padding:7px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:1px}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(8,12,20,.4)}
.menuBox{width:min(460px,92vw);background:rgba(12,18,30,.92);border:1px solid var(--line);border-radius:16px;padding:30px 34px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}
h1{font-size:34px;letter-spacing:5px;color:#fff;font-weight:800}
h1 em{color:var(--accent);font-style:normal}
.sub{color:#93a3b5;font-size:13px;margin:8px 0 20px;line-height:1.6}
.colorGroup{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.colorBtn{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .12s,border-color .12s}
.colorBtn:hover{transform:scale(1.15)}
.colorBtn.on{border-color:#fff;transform:scale(1.2)}
.btnStart{display:block;width:100%;padding:14px 0;border:none;border-radius:10px;background:var(--accent);color:#241a05;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:6px;font-family:inherit}
.btnStart:hover{filter:brightness(1.12)}
.keys{display:flex;gap:7px;justify-content:center;margin:20px 0 2px;flex-wrap:wrap}
kbd{background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 7px;font-size:11px;color:#b7c6d8;font-family:inherit}
.keys span{font-size:12px;color:#93a3b5;line-height:25px}
#bannerTrap,#bannerZone,#bannerJump{display:none}
</style>
</head>
<body>

<div id="boot">正在驰骋旷野…</div>
<div id="game"></div>

<div id="hud" class="hidden">
  <div id="speedPanel" class="panel">
    <div id="gearVal">G1</div>
    <div id="speedVal">0</div>
    <div id="speedUnit">KM/H</div>
    <div id="nitroWrap">
      <div id="nitroLabel"><span>氮气 NITRO</span><span id="nitroPct">100%</span></div>
      <div id="nitroBar"><div id="nitroFill"></div></div>
    </div>
  </div>
  <div id="starCount" class="panel">★ <b id="starN">0</b> / <span id="starT">30</span></div>
  <div id="minimapWrap" class="panel"><canvas id="minimap" width="170" height="170"></canvas></div>
</div>

<div id="banner"><div class="bt"></div><div class="bs"></div></div>
<div id="driftScore"><div class="ds">0</div><div class="dt">D R I F T</div></div>
<div id="toast"></div>

<div id="menu" class="overlay">
  <div class="menuBox">
    <h1>地平线旷野<em>.</em></h1>
    <div class="sub">开放世界自由驾驶 · 测速 / 漂移 / 飞跃 / 收集<br>没有赛道，整片旷野都是你的公路</div>
    <div class="colorGroup" id="colorGroup"></div>
    <button id="btnStart" class="btnStart">出 发</button>
    <div class="keys">
      <span><kbd>W</kbd><kbd>↑</kbd> 油门</span>
      <span><kbd>S</kbd><kbd>↓</kbd> 刹车</span>
      <span><kbd>A</kbd><kbd>D</kbd> 转向</span>
      <span><kbd>空格</kbd> 手刹漂移</span>
      <span><kbd>Shift</kbd> 氮气</span>
      <span><kbd>C</kbd> 视角</span>
      <span><kbd>R</kbd> 重置</span>
    </div>
  </div>
</div>

<script src="libs/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

// ================= 工具 =================
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
function mulberry32(seed){
  let a=seed>>>0;
  return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};
}
// 2D value noise + fbm
function makeNoise(seed){
  const rng=mulberry32(seed),perm=new Uint8Array(512);
  const p=[];for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=Math.floor(rng()*(i+1));const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)perm[i]=p[i&255];
  const fade=t=>t*t*(3-2*t);
  const grad=(h,x,y)=>{switch(h&7){
    case 0:return x+y;case 1:return -x+y;case 2:return x-y;case 3:return -x-y;
    case 4:return x;case 5:return -x;case 6:return y;case 7:return -y;return 0;}};
  function noise2(x,y){
    const X=Math.floor(x)&255,Y=Math.floor(y)&255;
    x-=Math.floor(x);y-=Math.floor(y);
    const u=fade(x),v=fade(y);
    const a=perm[X]+Y,b=perm[X+1]+Y;
    return lerp(
      lerp(grad(perm[a],x,y),grad(perm[b],x-1,y),u),
      lerp(grad(perm[a+1],x,y-1),grad(perm[b+1],x-1,y-1),u),v);
  }
  function fbm(x,y,oct,lac,gain){
    let amp=1,freq=1,sum=0,norm=0;
    for(let i=0;i<oct;i++){sum+=amp*noise2(x*freq,y*freq);norm+=amp;amp*=gain;freq*=lac;}
    return sum/norm;
  }
  return {noise2,fbm};
}

// ============================================================
// 手感层独立模块：音效合成 / 屏幕震动 / 粒子反馈 / 速度感
// 与游戏逻辑零耦合，可整体迁移到任何驾驶/动作项目
// ============================================================
const Feel = {
  ac:null, master:null, noiseBuf:null, engineNodes:null, screechNodes:null,
  shakeAmt:0, particles:[], texSoft:null, texGlow:null, texStar:null,
  preloadTextures(){
    const mkTex=(inner,outer)=>{const c=document.createElement('canvas');c.width=c.height=64;
      const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,2,32,32,30);
      gr.addColorStop(0,inner);gr.addColorStop(1,outer);
      g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);};
    this.texSoft=mkTex('rgba(255,255,255,0.9)','rgba(255,255,255,0)');
    this.texGlow=mkTex('rgba(255,200,120,1)','rgba(255,120,40,0)');
    const cs=document.createElement('canvas');cs.width=cs.height=64;
    const g=cs.getContext('2d');g.translate(32,32);
    g.fillStyle='rgba(255,210,60,1)';
    for(let i=0;i<5;i++){g.save();g.rotate(i*Math.PI*2/5 - Math.PI/2);
      g.beginPath();g.moveTo(0,-24);g.lineTo(5,-7);g.lineTo(22,-7);g.lineTo(8,3);g.lineTo(13,20);g.lineTo(0,9);g.lineTo(-13,20);g.lineTo(-8,3);g.lineTo(-22,-7);g.lineTo(-5,-7);g.closePath();g.fill();g.restore();}
    this.texStar=new THREE.CanvasTexture(cs);
  },
  init(){
    this.particles=[];
    const mat=new THREE.SpriteMaterial({map:this.texSoft,transparent:true,depthWrite:false,opacity:1});
    for(let i=0;i<64;i++){const sp=new THREE.Sprite(mat.clone());
      sp.visible=false;sp.scale.set(1,1,1);
      this.particles.push({sp,life:0,max:1,vx:0,vy:0,vz:0,g:0,shrink:1});
      window.GAME_SCENE.add(sp);}
  },
  // ---- 音频初始化（首次交互时）----
  ensureAudio(){
    if(this.ac)return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    this.ac=new AC();
    this.master=this.ac.createGain();this.master.gain.value=0.5;this.master.connect(this.ac.destination);
    const len=this.ac.sampleRate*1.5,nb=this.ac.createBuffer(1,len,this.ac.sampleRate);
    const d=nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    this.noiseBuf=nb;
    // 引擎：双锯齿 + 低通
    const eg=this.ac.createGain();eg.gain.value=0;
    const lp=this.ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;lp.Q.value=0.8;
    const o1=this.ac.createOscillator();o1.type='sawtooth';o1.frequency.value=60;
    const o2=this.ac.createOscillator();o2.type='square';o2.frequency.value=30;
    const g2=this.ac.createGain();g2.gain.value=0.4;
    o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(eg);eg.connect(this.master);
    o1.start();o2.start();
    this.engineNodes={eg,lp,o1,o2};
    // 漂移胎响：循环噪声 + 带通
    const sg=this.ac.createGain();sg.gain.value=0;
    const bp=this.ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=1.2;
    const src=this.ac.createBufferSource();src.buffer=nb;src.loop=true;
    src.connect(bp);bp.connect(sg);sg.connect(this.master);src.start();
    this.screechNodes={sg,bp};
  },
  // 引擎持续音：ratio=速度比例 0..1, throttle=油门 0..1
  updateEngine(ratio,throttle){
    if(!this.engineNodes)return;
    const {eg,lp,o1,o2}=this.engineNodes,t=this.ac.currentTime;
    const rpm=55+ratio*165 + (throttle>0.1?6:0);
    o1.frequency.setTargetAtTime(rpm,t,0.05);
    o2.frequency.setTargetAtTime(rpm*0.5,t,0.05);
    lp.frequency.setTargetAtTime(350+ratio*1200,t,0.08);
    eg.gain.setTargetAtTime(0.05+throttle*0.16+ratio*0.02,t,0.06);
  },
  setScreech(level){
    if(!this.screechNodes)return;
    const {sg,bp}=this.screechNodes,t=this.ac.currentTime;
    sg.gain.setTargetAtTime(level*0.5,t,0.04);
    bp.frequency.setTargetAtTime(900+level*800,t,0.05);
  },
  // 一次性音效：三层合成 + 专属音色
  tone(type,f0,f1,dur,vol,delay){
    if(!this.ac)return;
    const t=this.ac.currentTime+(delay||0);
    const o=this.ac.createOscillator();o.type=type;
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
    const g=this.ac.createGain();
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.master);
    o.start(t);o.stop(t+dur+0.03);
  },
  noiseBurst(dur,vol,lp0,lp1,rate){
    if(!this.ac)return;
    const t=this.ac.currentTime;
    const s=this.ac.createBufferSource();s.buffer=this.noiseBuf;
    s.playbackRate.value=rate||0.9;
    const g=this.ac.createGain();g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    const f=this.ac.createBiquadFilter();f.type='lowpass';
    f.frequency.setValueAtTime(lp0,t);
    f.frequency.exponentialRampToValueAtTime(lp1,t+dur);
    s.connect(f);f.connect(g);g.connect(this.master);
    s.start(t);s.stop(t+dur+0.03);
  },
  sndCollision(inten){
    this.tone('sine',130*inten,38,0.28,0.6*inten);
    this.noiseBurst(0.16,0.4*inten,900,180);
    this.shake(inten);
  },
  sndCollect(){
    this.tone('sine',920,1400,0.12,0.35);
    this.tone('sine',1400,2100,0.1,0.2,0.06);
  },
  sndNitro(){
    this.noiseBurst(0.7,0.3,300,2400,0.7);
    this.tone('sawtooth',180,520,0.5,0.12);
  },
  sndTrapRecord(speed){
    const k=clamp((speed-80)/220,0,1)*0.5;
    this.tone('sine',660,990,0.12,0.4+k);
    this.tone('sine',880,1320,0.12,0.4+k,0.1);
    this.tone('sine',1320,1980,0.2,0.45+k,0.2);
    this.noiseBurst(0.35,0.16,2000,600,1.4);
  },
  sndGrade(grade){
    const base={S:6,A:4,B:3,C:2}[grade]||2;
    for(let i=0;i<base;i++)this.tone('triangle',500+i*180,700+i*220,0.12,0.35,0.09*i);
  },
  sndJump(){this.tone('sine',300,900,0.3,0.35);this.noiseBurst(0.3,0.2,500,2500,0.6);},
  // ---- 屏幕震动 ----
  shake(i){this.shakeAmt=Math.max(this.shakeAmt,i);},
  updateShake(dt){this.shakeAmt=Math.max(0,this.shakeAmt-2.2*dt);},
  // ---- 粒子池 ----
  spawn(x,y,z,vx,vy,vz,life,scale,tex,tint,opacity,gravity){
    let p=null;
    for(const q of this.particles){if(q.life<=0){p=q;break;}}
    if(!p)return;
    p.sp.visible=true;p.life=p.max=life;
    p.sp.position.set(x,y,z);
    p.vx=vx;p.vy=vy;p.vz=vz;p.g=gravity||0;p.shrink=1;
    p.sp.scale.set(scale,scale,1);
    p.sp.material.map=tex;
    if(tint){p.sp.material.color.set(tint);}else{p.sp.material.color.set(0xffffff);}
    p.opacity=opacity===undefined?0.8:opacity;
    p.sp.material.opacity=opacity===undefined?0.8:opacity;
  },
  updateParticles(dt){
    for(const p of this.particles){
      if(p.life<=0)continue;
      p.life-=dt;
      if(p.life<=0){p.sp.visible=false;continue;}
      p.sp.position.x+=p.vx*dt;p.sp.position.y+=p.vy*dt;p.sp.position.z+=p.vz*dt;
      p.vy-=p.g*dt;
      const k=p.life/p.max;
      const s=p.sp.scale.x*(0.4+0.6*k);
      p.sp.scale.set(s,s,1);
      p.sp.material.opacity=p.opacity*k;
    }
  },
  // 漂移尘土：后轮位置向后上方喷
  driftDust(x,y,z,fx,fz,amount){
    for(let i=0;i<amount;i++){
      const a=Math.random()*Math.PI*2,r=Math.random()*1.2;
      this.spawn(x+Math.cos(a)*r, y+Math.random()*0.3, z+Math.sin(a)*r,
        -fx*(3+Math.random()*4)+(Math.random()-0.5)*2,
        1.2+Math.random()*1.4,
        -fz*(3+Math.random()*4)+(Math.random()-0.5)*2,
        0.55+Math.random()*0.3, 1.4+Math.random()*1.1,
        this.texSoft,0xcfc4b0,0.55,0.5);
    }
  },
  // 氮气尾焰
  nitroFlame(x,y,z,fx,fz,boost){
    const n=boost?3:1;
    for(let i=0;i<n;i++){
      this.spawn(x-fx*2.4+(Math.random()-0.5)*0.4, y+(Math.random()-0.5)*0.3, z-fz*2.4+(Math.random()-0.5)*0.4,
        -fx*(8+Math.random()*6), 0.5+Math.random()*1, -fz*(8+Math.random()*6),
        0.22+Math.random()*0.15, 0.8+Math.random()*0.6,
        this.texGlow,0xff8a3d,0.95,0);
    }
  },
  // 落地尘土
  landDust(x,y,z){
    for(let i=0;i<10;i++){
      const a=Math.random()*Math.PI*2,r=Math.random()*2.4;
      this.spawn(x+Math.cos(a)*r, y+0.2, z+Math.sin(a)*r,
        Math.cos(a)*(2+Math.random()*3), 1+Math.random()*2, Math.sin(a)*(2+Math.random()*3),
        0.7+Math.random()*0.3, 1.6+Math.random()*1.2, this.texSoft,0xc9bda6,0.5,1.2);
    }
  },
  shakeFor(dt){return this.shakeAmt;}
};

// ============================================================
// 世界生成：地形 / 湖 / 道路 / 植被 / 天空 / 活动点
// ============================================================
function buildWorld(){
  const scene=new THREE.Scene();
  window.GAME_SCENE=scene;
  const noise=makeNoise(20260802);
  const SIZE=WORLD_SIZE,HALF=SIZE/2,SEG=200;
  const hScale=52;
  // 湖：中心区域压到 0 以下
  function heightAt(x,z){
    const nx=x/700,nz=z/700;
    let h=noise.fbm(nx,nz,4,2.1,0.5)*hScale;
    // 火山（西南侧）
    h += 60*Math.exp(-((x+520)*(x+520)+(z+180)*(z+180))/90000);
    // 湖区盆地（缓坡过渡）
    const d=Math.hypot(x,z);
    h -= 11*Math.exp(-d*d/90000);
    if(d<300)h=Math.min(h,-1.6);
    return h;
  }
  // 坡度计算
  function slopeAt(x,z){const e=1.5;const h=heightAt(x,z);
    const dx=(heightAt(x+e,z)-heightAt(x-e,z))/(2*e);
    const dz=(heightAt(x,z+e)-heightAt(x,z-e))/(2*e);
    return Math.hypot(dx,dz);}

  // ---- 地形网格（顶点色）----
  const geo=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position,cols=new Float32Array(pos.count*3);
  const colSand=new THREE.Color(0xc2a06a),colGrass=new THREE.Color(0x6f8f4f),
        colRock=new THREE.Color(0x8a5f4a),colSnow=new THREE.Color(0xcdd2d8),colMud=new THREE.Color(0x8a7a58);
  const c=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    const h=heightAt(x,z),sl=slopeAt(x,z);
    pos.setY(i,h);
    if(h<-1.4){c.copy(colSand).lerp(colMud,clamp((-h-1.4)/8,0,1));}
    else if(h<6){const t=clamp((h+1.4)/9,0,1);
      c.copy(colSand).lerp(colGrass,t);
      c.lerp(colMud,clamp(sl*1.6,0,0.4));}
    else if(h<34){const t=clamp((h-6)/28,0,1);

    const jitter=(noise.noise2(x*0.05,z*0.05))*0.03;

  // ---- 湖面 ----
  const lakeMat=new THREE.MeshLambertMaterial({color:0x2e7fa8,transparent:true,opacity:0.9,shininess:90,specular:0x9fd8ff});

  // ---- 道路（沿样条铺沥青带，含高架桥与交叉支路）----
  const roadPts=[
    new THREE.Vector3(-520,0,40), new THREE.Vector3(-380,0,-260), new THREE.Vector3(-140,0,-380),
    new THREE.Vector3(140,0,-360), new THREE.Vector3(330,0,-220), new THREE.Vector3(360,0,40),
    new THREE.Vector3(240,0,280), new THREE.Vector3(-20,0,400), new THREE.Vector3(-280,0,340),
    new THREE.Vector3(-480,0,200)
  ];
  const roadCurve=new THREE.CatmullRomCurve3(roadPts,false,'catmullrom',0.5);
  const RN=260,roadW=13;
  const rp=roadCurve.getSpacedPoints(RN);
  rp.forEach(p=>p.y=heightAt(p.x,p.z)+0.12);

  // ---- 高架桥：主路 t 在 [0.30,0.50] 段抬高 16m，两端引桥缓坡 ----
  const BRIDGE_T0=0.30,BRIDGE_T1=0.50,BRIDGE_H=16,BRIDGE_RAMP=0.045;
  function bridgeYAt(t){
    // t 在主路环上的比例 0..1；返回高架桥面高度（含引桥渐变），非桥段返回 -1e9
    if(t<BRIDGE_T0-BRIDGE_RAMP||t>BRIDGE_T1+BRIDGE_RAMP)return -1e9;
    let k=1;
    if(t<BRIDGE_T0)k=Math.max(0,(t-(BRIDGE_T0-BRIDGE_RAMP))/BRIDGE_RAMP);
    else if(t>BRIDGE_T1)k=Math.max(0,1-(t-BRIDGE_T1)/BRIDGE_RAMP);
    k=k*k*(3-2*k); // smoothstep
    const base=rp[Math.floor(t*RN)%RN];

  }
  // 桥墩（每 4 个采样点一对）
  const pierGeo=new THREE.CylinderGeometry(0.7,0.9,1,8);

  for(let i=Math.floor(BRIDGE_T0*RN)+4;i<Math.floor(BRIDGE_T1*RN);i+=4){
    const p=rp[i],pn=rp[(i+1)%RN];
    const dir=new THREE.Vector3().subVectors(pn,p).normalize();
    const right=new THREE.Vector3(-dir.z,0,dir.x);
    const bY=bridgeYAt(i/RN);

      const px=p.x+right.x*(roadW/2-1.2)*s,pz=p.z+right.z*(roadW/2-1.2)*s;

  // 桥面护栏横梁

  for(let i=Math.floor(BRIDGE_T0*RN);i<=Math.floor(BRIDGE_T1*RN);i+=2){

    scene.add(glow);
    const coneGeo=new THREE.ConeGeometry(0.4,1,6);

      const cone=new THREE.Mesh(coneGeo,coneMat);
      cone.position.set(tp.x+tright.x*(roadW/2+1.2)*s,heightAt(tp.x,tp.z)+r.h+0.5,tp.z+tright.z*(roadW/2+1.2)*s);

  // ---- 交叉支路：一条从高架桥下方穿过的低路（桥梁交叉）----

  const bMid=Math.floor((BRIDGE_T0+BRIDGE_T1)/2*RN)%RN;

  const bmDir=new THREE.Vector3().subVectors(bmN,bm).normalize();
  const crossDir=new THREE.Vector3(-bmDir.z,0,bmDir.x);
  const CROSS_LEN=340,CROSS_PTS=46;
  const crossPts=[];
  for(let i=0;i<CROSS_PTS;i++){
    const k=(i/(CROSS_PTS-1)-0.5)*2; // -1..1
    crossPts.push(new THREE.Vector3(bm.x+crossDir.x*CROSS_LEN*k,0,bm.z+crossDir.z*CROSS_LEN*k));
  }
  crossPts.forEach(p=>p.y=heightAt(p.x,p.z)+0.12);
  // 支路条带
  const cxPos=[],cxIdx=[];
  for(let i=0;i<CROSS_PTS;i++){

  }
  for(let i=0;i<CROSS_PTS-1;i++){

  const cxRoad=new THREE.Mesh(cxGeo,new THREE.MeshLambertMaterial({color:0x45484e}));

  // ---- 道路条带（主路）：桥段/跳台段抬高，其余贴地 ----
  const rPos=[],rIdx=[],rCol=[];
  const cAsphalt=new THREE.Color(0x3a3d42),cLine=new THREE.Color(0xe8d9a0);
  for(let i=0;i<=RN;i++){

  const rGeo=new THREE.BufferGeometry();
  rGeo.setAttribute('position',new THREE.Float32BufferAttribute(rPos,3));

  rGeo.setAttribute('color',new THREE.Float32BufferAttribute(rCol,3));

  const road=new THREE.Mesh(rGeo,new THREE.MeshLambertMaterial({vertexColors:true}));
  road.receiveShadow=true;
  scene.add(road);

  // 主路中心虚线（分段）
  const lineMat=new THREE.LineBasicMaterial({color:0xe8d9a0,linewidth:1});
  const dashPos=[];
  const dashGap=5,dashLen=3;
  for(let i=0;i<RN;i+=dashGap){

      const idx=(i+j)%RN;
      const p=rp[idx];
      const t=idx/RN;
      const bY=bridgeYAt(t);
      const yBase=(bY>0?bY:heightAt(p.x,p.z))+rampYAt(t);

  }
  const dGeo=new THREE.BufferGeometry();
  dGeo.setAttribute('position',new THREE.Float32BufferAttribute(dashPos,3));
  scene.add(new THREE.LineSegments(dGeo,lineMat));

  // ---- 植被 / 岩石（InstancedMesh + 碰撞数据）----
  const obstacles=[]; // {x,z,r,solid:true=岩石 不可撞坏}
  const rng=mulberry32(777);
  function tryPlace(minR,maxR,count,minSlope){
    const pts=[];
    let guard=0;
    while(pts.length<count && guard<6000){
      guard++;
      const a=rng()*Math.PI*2,r=minR+rng()*(maxR-minR);
      const x=Math.cos(a)*r,z=Math.sin(a)*r;
      if(Math.hypot(x,z)<340)continue; // 湖心区域
      if(slopeAt(x,z)>minSlope)continue;
      let nearRoad=false;
      for(const p of rp){if(Math.hypot(p.x-x,p.z-z)<14){nearRoad=true;break;}}
      if(nearRoad)continue;
      pts.push({x,z});
    }
    return pts;
  }
  // 仙人掌
  const cactPts=tryPlace(350,950,90,0.5);

  // 灌木

  // 远山剪影环

  scene.add(ringM);

  // ---- 天空（渐变球）----
  const skyGeo=new THREE.SphereGeometry(1800,24,14);
  const skyCv=document.createElement('canvas');skyCv.width=64;skyCv.height=256;
  const sg2=skyCv.getContext('2d');

  scene.add(sky);
  scene.fog=new THREE.Fog(0xe8b57e,420,1500);

  // ---- 太阳 ----
  const sunCv=document.createElement('canvas');sunCv.width=sunCv.height=128;
  const sg3=sunCv.getContext('2d');
  const gr2=sg3.createRadialGradient(64,64,4,64,64,62);

  gr2.addColorStop(0.5,'rgba(255,170,80,0.35)');gr2.addColorStop(1,'rgba(255,150,60,0)');
  sg3.fillStyle=gr2;sg3.fillRect(0,0,128,128);

  sun.scale.set(220,220,1);sun.position.set(-620,190,-540);

  }

  // ---- 活动点 ----
  // 测速门 ×2：放道路长直段
  const traps=[];
  function placeTrap(t){
    const idx=Math.floor(t/100*RN)%RN;
    const p=rp[idx],pn=rp[(idx+1)%RN];
    const dir=new THREE.Vector3().subVectors(pn,p).normalize();
    const right=new THREE.Vector3(-dir.z,0,dir.x);

  }
  placeTrap(0.16);placeTrap(0.72);
  // 漂移区 ×2：环形发光地标
  const zones=[];
  function placeZone(t,r){
    const idx=Math.floor(t*RN)%RN;
    const p=rp[idx];
    const disk=new THREE.Mesh(new THREE.CircleGeometry(r,28),
      new THREE.MeshBasicMaterial({color:0x4d8dff,transparent:true,opacity:0.16,depthWrite:false}));
    disk.rotation.x=-Math.PI/2;disk.position.set(p.x,heightAt(p.x,p.z)+0.3,p.z);
    scene.add(disk);

  placeZone(0.12,26);placeZone(0.88,24);
  // 跳跃点 ×2：实体跳台坡道（RAMPS 已定义在道路生成段）
  const jumps=RAMPS.map(r=>({
    r0:r.r0,r1:r.r1,
    x:rp[Math.floor((r.r0+r.r1)/2*RN)%RN].x,

  }));
  // 收集星 ×30
  const stars=[];
  for(let i=0;i<30;i++){
    const t=(i/30+0.5/30)%1;
    const idx=Math.floor(t*RN)%RN;
    const p=rp[idx];
    const off=(i%2===0?1:-1)*(5+rng()*22);
    const dir=new THREE.Vector3().subVectors(rp[(idx+1)%RN],p).normalize();
    const right=new THREE.Vector3(-dir.z,0,dir.x);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:Feel.texStar,transparent:true,depthWrite:false}));
    const sx=p.x+right.x*off,sz=p.z+right.z*off;

  }

  // 起点（朝向对齐道路方向）
  const startPos={x:rp[0].x,z:rp[0].z};
  const sp0=rp[0],sp1=rp[1];
  const startHeading=Math.atan2(sp1.x-sp0.x,sp1.z-sp0.z);
  // 车辆地面高度：优先主路/桥/跳台，否则地形；支路也算路面
  function groundYAt(x,z,curY){
    // 最近主路点
    let bi=0,bd=1e18;
    for(let i=0;i<RN;i++){const p=rp[i];const d=(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z);if(d<bd){bd=d;bi=i;}}
    const t=bi/RN;
    const bY=bridgeYAt(t);
    const rY=rampYAt(t);
    const onMain=bd<(roadW/2+3.5)*(roadW/2+3.5);
    if(bY>0&&onMain){
      // 引坡段无条件跟桥面；水平桥段需车已在桥面上方（区分桥下穿越）
      const inRamp=t<BRIDGE_T0||t>BRIDGE_T1;
      if(inRamp||curY>bY-3){return bY+0.05;}
      // 桥下（车在桥面下方且不在引坡）→ 用地形
      return heightAt(x,z)+0.05;
    }
    if(rY>0&&onMain){return heightAt(x,z)+rY+0.05;} // 跳台坡面
    if(onMain)return heightAt(x,z)+0.05; // 平路
    // 支路
    for(let i=0;i<CROSS_PTS;i++){
      const p=crossPts[i];
      if((p.x-x)*(p.x-x)+(p.z-z)*(p.z-z)<(roadW/2+3.5)*(roadW/2+3.5))return heightAt(x,z)+0.05;
    }
    return heightAt(x,z)+0.05;
  }
  // 是否在路面（主路或支路）
  function onRoadAt(x,z){
    let bi=0,bd=1e18;
    for(let i=0;i<RN;i++){const p=rp[i];const d=(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z);if(d<bd){bd=d;bi=i;}}
    if(bd<(roadW/2+3)*(roadW/2+3))return true;
    for(let i=0;i<CROSS_PTS;i++){
      const p=crossPts[i];
      if((p.x-x)*(p.x-x)+(p.z-z)*(p.z-z)<(roadW/2+3)*(roadW/2+3))return true;
    }
    return false;
  }
  return {scene,heightAt,slopeAt,roadPts:rp,traps,zones,jumps,stars,obstacles,startPos,startHeading,noise,roadW,
    bridgeYAt,rampYAt,groundYAt,onRoadAt,crossPts};
}

// ============================================================
// 车辆：模型 + 街机漂移物理
// ============================================================
function makeCar(color){
  const g=new THREE.Group();
  const bodyMat=new THREE.MeshLambertMaterial({color});
  const darkMat=new THREE.MeshLambertMaterial({color:0x23262b});
  const glassMat=new THREE.MeshLambertMaterial({color:0x101820,shininess:80,specular:0xffffff});
  // 低趴车身（整体压低贴地：车底离地约 0.15m）
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.95,0.52,4.3),bodyMat);
  body.position.y=0.42;g.add(body);
  const hood=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.24,1.3),bodyMat);
  hood.position.set(0,0.3,1.62);g.add(hood);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.42,2.0),glassMat);
  cabin.position.set(0,0.9,-0.25);g.add(cabin);
  const spoiler=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.1,0.48),darkMat);
  spoiler.position.set(0,1.12,-1.95);g.add(spoiler);
  const splitter=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.15,0.55),darkMat);
  splitter.position.set(0,0.24,2.15);g.add(splitter);
  // 前灯 / 尾灯
  const headMat=new THREE.MeshBasicMaterial({color:0xfff6d8});
  const tailMat=new THREE.MeshBasicMaterial({color:0xff2a2a});
  const headL=new THREE.Mesh(new THREE.BoxGeometry(0.38,0.15,0.1),headMat);
  headL.position.set(-0.62,0.48,2.18);g.add(headL);
  const headR=headL.clone();headR.position.x=0.62;g.add(headR);
  const tailL=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.14,0.1),tailMat);
  tailL.position.set(-0.68,0.55,-2.18);g.add(tailL);
  const tailR=tailL.clone();tailR.position.x=0.68;g.add(tailR);
  // 轮子（后两个为前轮，可转向）
  const wheels=[],frontWheels=[];
  const wheelGeo=new THREE.CylinderGeometry(0.42,0.42,0.32,12);
  const wheelMat=new THREE.MeshLambertMaterial({color:0x141518});
  const wPos=[[-0.92,-1.35],[0.92,-1.35],[-0.92,1.42],[0.92,1.42]];
  for(let i=0;i<4;i++){
    const w=new THREE.Mesh(wheelGeo,wheelMat);
    w.rotation.z=Math.PI/2;
    w.position.set(wPos[i][0],0.42,wPos[i][1]);
    g.add(w);wheels.push(w);
    if(i>=2)frontWheels.push(w);
  }
  return {group:g,wheels,frontWheels,bodyMat,
    x:0,z:0,y:0,heading:0,speed:0,slip:0,vy:0,airborne:false,
    steer:0,steerVis:0,gear:0,prevGy:null,throttle:0,nitro:0,landCd:0};
}

// ============================================================
// 主游戏
// ============================================================
const COLORS=[0xff5a4d,0x4d8dff,0x4dbf6a,0xffc44d,0xb06bff,0xe8e8ec];
const GRAV=22,MAXSPD=72,NITRO_MULT=1.32;
const WORLD_SIZE=2000;

function main(){
  Feel.preloadTextures();
  const world=buildWorld();
  const {scene,heightAt}=world;
  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  renderer.outputEncoding=THREE.sRGBEncoding;
  $('game').appendChild(renderer.domElement);

  const sunLight=new THREE.DirectionalLight(0xffd9a0,1.5);
  sunLight.position.set(-500,300,-400);
  sunLight.castShadow=true;
  sunLight.shadow.mapSize.set(1024,1024);
  sunLight.shadow.camera.left=-140;sunLight.shadow.camera.right=140;
  sunLight.shadow.camera.top=140;sunLight.shadow.camera.bottom=-140;
  sunLight.shadow.camera.near=10;sunLight.shadow.camera.far=1400;
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x8fa0c0,0.55));
  const hemi=new THREE.HemisphereLight(0xffe0b0,0x5a6a8a,0.5);
  scene.add(hemi);

  // 车辆
  let car=null;
  const camera=new THREE.PerspectiveCamera(66,window.innerWidth/window.innerHeight,0.5,2600);
  camera.position.set(0,10,20);

  // 输入
  const input={throttle:false,brake:false,steer:0,handbrake:false,nitro:false,camSwitch:false,reset:false};
  const keys={};
  window.addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='Space')e.preventDefault();
    if(e.code==='KeyC'&&!keys._c){keys._c=true;camMode=(camMode+1)%3;}
    if(e.code==='KeyR')resetCar();
    Feel.ensureAudio();
  });
  window.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyC')keys._c=false;});
  let camMode=0;

  function resetCar(){
    if(!car)return;
    for(const j of world.jumps)j.cd=0;
    car.x=world.startPos.x;car.z=world.startPos.z;
    car.y=heightAt(car.x,car.z)+0.05;car.heading=world.startHeading;
    car.speed=0;car.slip=0;car.vy=0;car.airborne=false;
  }

  // 手感初始化（场景已建）
  Feel.init();

  // HUD 元素
  const elSpeed=$('speedVal'),elNitroFill=$('nitroFill'),elNitroPct=$('nitroPct'),elGear=$('gearVal'),
        elBanner=$('banner'),elBannerT=$('banner').querySelector('.bt'),elBannerS=$('banner').querySelector('.bs'),
        elDrift=$('driftScore'),elDriftV=$('driftScore').querySelector('.ds'),
        elStarN=$('starN'),elStarT=$('starT'),elToast=$('toast');
  let starTotal=world.stars.length;
  elStarT.textContent=starTotal;
  let bannerT=0,toastT=0;
  const nitroCap=1;
  let nitro=nitroCap,driftDisplay=0,topSpeed=0,starGot=0;
  let shakeCam=0;
  const prevState={};
  let menuOrbit=0;

  function showBanner(big,small,cls){
    elBannerT.textContent=big;
    elBannerS.textContent=small||'';
    if(cls)elBannerT.className='bt '+cls;else elBannerT.className='bt';
    elBanner.classList.add('show');
    bannerT=2.4;
  }
  function showToast(txt){elToast.textContent=txt;elToast.classList.add('show');toastT=2.2;}

  // 物理步进
  function step(dt){
    const c=car;
    if(!c)return;
    const thr=input.throttle?1:0,brk=input.brake?1:0,st=input.steer;
    const nitroOn=input.nitro&&nitro>0.02;
    const vmax=MAXSPD*(nitroOn?NITRO_MULT:1);
    // 路面检测（主路/支路/越野）
    const onRoad=world.onRoadAt(c.x,c.z);
    const terrainK=onRoad?1:0.78;

    // ---- 加速度：功率曲线（低速猛，高速衰减）----
    const aMax=nitroOn?30:20;
    const accel=aMax*Math.max(0.12,1-Math.pow(c.speed/vmax,1.7))*terrainK;
    if(thr)c.speed+=accel*dt;
    else if(brk)c.speed-=42*dt;
    if(!thr&&!brk)c.speed-=c.speed*(0.4+0.02*c.speed/vmax)*dt;
    if(c.speed<0)c.speed=0;
    // 氮气消耗/回复（漂移回氮气）
    if(nitroOn){nitro=Math.max(0,nitro-0.16*dt);}
    else{nitro=Math.min(nitroCap,nitro+(input.handbrake?0.14:0.05)*dt);}

    // ---- 转向：受抓地极限约束（高速转弯半径真实变大）----
    const A_LAT=13.5; // 抓地侧向加速度 m/s²
    // 低速满舵角速度上限，高速由 a=v²/r 约束
    const yawLow=2.6;
    const yawGrip=A_LAT/Math.max(c.speed,2);
    let yawRate=Math.min(yawLow,Math.max(yawGrip,0.12));
    // 手刹：转向增强 + 甩尾
    const hb=input.handbrake&&c.speed>6;
    let slipSrc=0;
    if(hb){
      yawRate*=1.8;
      slipSrc=+st*(0.9+Math.min(0.9,c.speed/40))*dt; // 甩尾（车头右转=heading 减小，速度滞后→slip 正）
      c.speed*=Math.max(0,1-0.12*dt);
    }else{
      // 高速急转自然侧滑
      if(Math.abs(st)>0.35&&c.speed>38)slipSrc=+st*(c.speed-38)/40*0.55*dt;
    }
    c.heading-=st*yawRate*dt;
    c.slip+=slipSrc;
    // 抓地恢复（松手刹回正）
    c.slip*=Math.exp(-(hb?1.4:4.6)*dt);
    c.slip=clamp(c.slip,-1.15,1.15);
    // 前轮转向动画（视觉）
    c.steerVis+=(st-c.steerVis)*Math.min(1,dt*8);

    // ---- 位移 ----
    const fx=Math.sin(c.heading),fz=Math.cos(c.heading);
    const vx=Math.sin(c.heading+c.slip)*c.speed;
    const vz=Math.cos(c.heading+c.slip)*c.speed;
    c.x+=vx*dt;c.z+=vz*dt;
    c.x=clamp(c.x,-WORLD_SIZE/2+20,WORLD_SIZE/2-20);c.z=clamp(c.z,-WORLD_SIZE/2+20,WORLD_SIZE/2-20);

    // ---- 地面高度（桥/跳台/路面/越野）与飞行 ----
    const gy=world.groundYAt(c.x,c.z,c.y);
    if(c.y>gy+0.08){
      // 离开地面：记录起飞时速度（跳台断崖）
      if(!c.airborne){
        c.airborne=true;
        // 跳台起飞：向斜上方注入速度，真飞
        if(c.speed>25)c.vy=Math.max(c.vy,c.speed*0.30);
      }
      c.vy-=GRAV*dt;
      c.y+=c.vy*dt;
      if(c.y<=gy){
        if(c.vy>7){
          Feel.landDust(c.x,c.y-0.4,c.z);
          Feel.sndCollision(clamp(c.vy/24,0.2,0.6));
        }
        c.y=gy;c.vy=0;c.airborne=false;
      }
    }else{
      c.y=gy;c.vy=0;c.airborne=false;
    }
    // 跳台飞起时播报（经过坡顶段）
    for(const j of world.jumps){
      if(j.cd>0)continue;
      if(c.airborne&&c.vy>3&&c.speed>30){
        j.cd=3;Feel.sndJump();
      }
    }
    for(const j of world.jumps){if(j.cd>0)j.cd-=dt;}
    // 测速门（穿越检测：上一帧在门半径外，本帧进入）
    for(const t of world.traps){
      const d=Math.hypot(t.x-c.x,t.z-c.z);
      if(d<=7&&t.prevDist>7&&c.speed>30){
        const kmh=c.speed*3.6;
        if(kmh>t.best){
          t.best=kmh;
          showBanner('测速 '+(kmh|0)+' KM/H','破个人纪录','gold');
          Feel.sndTrapRecord(kmh);
        }
      }
      t.prevDist=d;
    }
    // 漂移区
    for(const z of world.zones){
      const inZone=Math.hypot(z.x-c.x,z.z-c.z)<z.r;
      if(inZone&&!z.active){z.active=true;z.score=0;showToast('漂移区！保持漂移');}
      if(inZone){
        z.score+=Math.abs(c.slip)*c.speed*dt*9;
        driftDisplay=z.score;
      }else if(z.active){
        z.active=false;
        if(z.score>0){
          const grade=z.score>4000?'S':z.score>2500?'A':z.score>1200?'B':'C';
          showBanner('DRIFT '+grade,'漂移分 '+Math.round(z.score),'gold');
          Feel.sndGrade(grade);
        }
        driftDisplay=0;
      }
    }
    // 区域外分数缓慢回落
    if(!world.zones.some(z=>z.active)){
      driftDisplay=Math.max(0,driftDisplay-50*dt);
    }
    // 收集星
    for(const s of world.stars){
      if(s.taken)continue;
      if(Math.hypot(s.x-c.x,s.z-c.z)<4.2){
        s.taken=true;s.sp.visible=false;
        starGot++;elStarN.textContent=starGot;
        Feel.sndCollect();
        Feel.spawn(s.x,s.sp.position.y,s.z,0,0.5,0,0.5,1.6,Feel.texStar,0xffd23f,1,0);
        if(starGot===starTotal)showBanner('全收集！','旷野之星 ×'+starTotal,'gold');
      }
    }
    // 障碍物碰撞
    for(const o of world.obstacles){
      const dx=c.x-o.x,dz=c.z-o.z;
      const rr=o.r+1.0;
      if(dx*dx+dz*dz<rr*rr){
        const d=Math.hypot(dx,dz)||0.01;
        const nx=dx/d,nz=dz/d;
        const dot=vx*nx+vz*nz;
        if(dot<0){
          c.x+=nx*(rr-d)*0.8;c.z+=nz*(rr-d)*0.8;
          if(o.solid){c.speed*=0.5;Feel.sndCollision(clamp(c.speed/60,0.25,1));}
          else{c.speed*=0.78;Feel.sndCollision(0.35);c.slip*=0.5;}
        }
      }
    }
    // 最高速
    topSpeed=Math.max(topSpeed,c.speed*3.6);

    // ---- 手感反馈（画面层）----
    // 引擎声
    Feel.updateEngine(clamp(c.speed/vmax,0,1),thr);
    // 胎响
    const scr=clamp(Math.abs(c.slip)*(input.handbrake?1.4:1)*clamp(c.speed/30,0,1.2),0,1);
    Feel.setScreech(scr);
    // 尘土粒子
    const onOff=!onRoad;
    if(scr>0.35&&!c.airborne)Feel.driftDust(c.x-fx*2.6,c.y-0.2,c.z-fz*2.6,fx,fz,onOff?3:2);
    if(c.airborne&&c.vy>2)Feel.nitroFlame(c.x,c.y,c.z,fx,fz,false);
    if(nitroOn)Feel.nitroFlame(c.x,c.y,c.z,fx,fz,true);
    // 氮气音
    if(nitroOn&&!prevState.nitro){Feel.sndNitro();}
    // 车速震动
    Feel.shake(Math.max(0,(c.speed-52)/60*0.05));
    if(nitroOn)Feel.shake(0.06);
    // 状态记录
    prevState.nitro=nitroOn;

    // 车模同步
    c.group.position.set(c.x,c.y,c.z);
    c.group.rotation.y=c.heading;
    // 车身姿态：滚转（漂移/地形）+ 俯仰（加速/坡度）
    const fh=heightAt(c.x+fx*2.4,c.z+fz*2.4), bh=heightAt(c.x-fx*2.4,c.z-fz*2.4);
    const rh=heightAt(c.x+fz*2.0,c.z-fx*2.0), lh=heightAt(c.x-fz*2.0,c.z+fx*2.0);
    const roll=-clamp(c.slip*0.5,-0.4,0.4)-st*0.04+(rh-lh)*0.22;
    const pitch=clamp((thr?0.05:0)-(brk?0.06:0),-0.1,0.1)-(fh-bh)*0.22;
    c.group.rotation.z=lerp(c.group.rotation.z,roll,Math.min(1,dt*6));
    c.group.rotation.x=lerp(c.group.rotation.x,pitch,Math.min(1,dt*6));
    const spin=c.speed*0.7;
    for(const w of c.wheels)w.rotation.x+=spin*dt;
    // 前轮转向可视化（车头朝 +Z，右转 = heading 减小 = -X，故取负）
    for(const w of c.frontWheels)w.rotation.y=-c.steerVis*0.5;
    // 挡位（视觉 HUD）
    c.gear=Math.min(6,Math.max(1,Math.floor(c.speed/12)+1));
    if(elGear)elGear.textContent='G'+c.gear;

    // 相机
    const dist=8.6+clamp(c.speed/vmax,0,1)*2.2;
    const camH=3.4+clamp(c.speed/vmax,0,1)*0.9;
    if(camMode===0){
      const k=1-Math.pow(0.002,dt);
      const tx=c.x-fx*dist,tz=c.z-fz*dist,ty=c.y+camH;
      camera.position.x+=(tx-camera.position.x)*k;
      camera.position.y+=(ty-camera.position.y)*k;
      camera.position.z+=(tz-camera.position.z)*k;
      camera.lookAt(c.x+fx*8,c.y+1.5,c.z+fz*8);
      // 漂移/转向侧倾，增加速度感
      camera.rotateZ(clamp(-c.slip*0.25-st*0.02,-0.22,0.22));
    }else if(camMode===1){
      const k=Math.min(1,dt*12);
      const tx2=c.x-fx*2.2,tz2=c.z-fz*2.2,ty2=c.y+1.8;
      camera.position.x+=(tx2-camera.position.x)*k;
      camera.position.y+=(ty2-camera.position.y)*k;
      camera.position.z+=(tz2-camera.position.z)*k;
      camera.lookAt(c.x+fx*30,c.y+1.2,c.z+fz*30);
    }else{
      menuOrbit+=dt*0.12;
      const r=16;
      camera.position.set(c.x+Math.cos(menuOrbit)*r,c.y+6,c.z+Math.sin(menuOrbit)*r);
      camera.lookAt(c.x,c.y+1,c.z);
    }
    // 速度感 FOV
    const fovTarget=66+clamp(c.speed/vmax,0,1)*13+(nitroOn?6:0);
    if(Math.abs(camera.fov-fovTarget)>0.1){
      camera.fov=lerp(camera.fov,fovTarget,Math.min(1,dt*5));
      camera.updateProjectionMatrix();
    }
    // 屏幕震动
    const shk=Feel.shakeFor(0);
    if(shk>0.001){
      camera.position.x+=(Math.random()-0.5)*shk*1.4;
      camera.position.y+=(Math.random()-0.5)*shk*1.4;
    }

    // HUD
    elSpeed.textContent=String(Math.round(c.speed*3.6));
    elSpeed.classList.toggle('nitro',nitroOn);
    elNitroFill.style.width=(nitro*100|0)+'%';
    elNitroFill.classList.toggle('on',nitroOn);
    elNitroPct.textContent=(nitro*100|0)+'%';
    elDrift.classList.toggle('show',driftDisplay>8);
    if(driftDisplay>8)elDriftV.textContent=Math.round(driftDisplay);
    // 阳光与阴影跟随（正交阴影相机范围固定，灯光 target 指向车）
    sunLight.position.set(c.x-500,c.y+300,c.z-400);
    sunLight.target.position.set(c.x,c.y,c.z);
    sunLight.target.updateMatrixWorld();
  }

  // 云漂移
  function updateClouds(dt){
    if(!window.__clouds)return;
    for(const cld of window.__clouds){
      cld.position.x+=cld.userData.speed*dt;
      if(cld.position.x>900)cld.position.x=-900;
    }
  }

  function drawMinimap(){
    if(!car)return;
    const cv=$('minimap'),ctx=cv.getContext('2d');
    const W=cv.width,H=cv.height,pad=12;
    const S=WORLD_SIZE;
    const toXY=(x,z)=>[pad+(x+S/2)/S*(W-pad*2),(H-pad)-(z+S/2)/S*(H-pad*2)];
    ctx.clearRect(0,0,W,H);
    // 道路
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;ctx.beginPath();
    world.roadPts.forEach((p,i)=>{const [px,py]=toXY(p.x,p.z);i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
    ctx.stroke();
    // 湖
    ctx.fillStyle='rgba(80,160,220,0.5)';
    const [lx,ly]=toXY(0,0);
    ctx.beginPath();ctx.arc(lx,ly,298/S*(W-pad*2),0,Math.PI*2);ctx.fill();
    // 活动点
    for(const t of world.traps){const [x,y]=toXY(t.x,t.z);ctx.fillStyle='#ffb84d';ctx.fillRect(x-3,y-3,6,6);}
    for(const z of world.zones){const [x,y]=toXY(z.x,z.z);ctx.strokeStyle='rgba(120,180,255,0.8)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,z.r/S*(W-pad*2),0,Math.PI*2);ctx.stroke();}
    for(const j of world.jumps){const [x,y]=toXY(j.x,j.z);ctx.fillStyle='#ff6a4d';ctx.beginPath();ctx.moveTo(x,y-4);ctx.lineTo(x+4,y+3);ctx.lineTo(x-4,y+3);ctx.closePath();ctx.fill();}
    for(const s of world.stars){if(s.taken)continue;const [x,y]=toXY(s.x,s.z);ctx.fillStyle='rgba(255,210,60,0.9)';ctx.fillRect(x-1.5,y-1.5,3,3);}
    // 玩家
    const [px,py]=toXY(car.x,car.z);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px,py);
    ctx.lineTo(px+Math.sin(car.heading)*9,py-Math.cos(car.heading)*9);ctx.stroke();
  }

  let last=performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    let dt=(now-last)/1000;last=now;
    if(dt>0.05)dt=0.05;
    // 输入读取
    input.throttle=keys['KeyW']||keys['ArrowUp'];
    input.brake=keys['KeyS']||keys['ArrowDown'];
    input.steer=((keys['KeyD']||keys['ArrowRight'])?1:0)-((keys['KeyA']||keys['ArrowLeft'])?1:0);
    input.handbrake=keys['Space'];
    input.nitro=keys['ShiftLeft']||keys['ShiftRight'];
    if(car){
      step(dt);
    }else{
      // 菜单背景：环绕旷野
      menuOrbit+=dt*0.04;
      const mr=980, mh=300;
      camera.position.set(Math.cos(menuOrbit)*mr, mh+Math.sin(menuOrbit*0.5)*60, Math.sin(menuOrbit)*mr);
      camera.lookAt(0,30,0);
    }
    Feel.updateParticles(dt);
    Feel.updateShake(dt);
    updateClouds(dt);
    drawMinimap();
    // 星星浮动旋转
    for(const s of world.stars){if(s.taken)continue;
      s.sp.position.y=heightAt(s.x,s.z)+3.2+Math.sin(now*0.003+s.x)*0.4;
      s.sp.material.rotation+=dt*2;}
    renderer.render(scene,camera);
    // banner / toast 计时
    if(bannerT>0){bannerT-=dt;if(bannerT<=0)elBanner.classList.remove('show');}
    if(toastT>0){toastT-=dt;if(toastT<=0)elToast.classList.remove('show');}
  }

  // 开始
  $('btnStart').addEventListener('click',()=>{
    car=makeCar(currentColor);
    car.x=world.startPos.x;car.z=world.startPos.z;
    car.y=heightAt(car.x,car.z)+0.05;car.heading=world.startHeading;
    scene.add(car.group);
    $('menu').classList.add('hidden');
    $('hud').classList.remove('hidden');
    camera.position.set(car.x-9,car.y+4,car.z-9);
    camera.lookAt(car.x,car.y+1,car.z);
    Feel.ensureAudio();
    showToast('自由驾驶！收集旷野之星 ★');
    if(location.search.indexOf('test')>=0)runSelfTest();
  });

  // 自检模式（?test 触发，结果写入 document.title）
  function runSelfTest(){
    const out=[];
    const w=world,c=car;
    const T=dt=>{for(let i=0;i<dt*60;i++)step(1/60);};
    const P=(k,v)=>out.push(k+'='+v);
    // 1. 桥/坡函数
    P('bridge40',w.bridgeYAt(0.4).toFixed(0));
    P('ramp512',w.rampYAt(0.512).toFixed(1));
    // 2. 直道加速 3s
    input.throttle=true;T(3);input.throttle=false;
    P('speed3s',Math.round(c.speed*3.6));
    // 3. 上高架桥
    const i0=Math.floor(0.30*260-10);
    const p0=w.roadPts[i0],p1=w.roadPts[i0+1];
    const dl=Math.hypot(p1.x-p0.x,p1.z-p0.z);
    c.x=p0.x;c.z=p0.z;c.y=w.groundYAt(c.x,c.z,c.y);
    c.heading=Math.atan2(p1.x-p0.x,p1.z-p0.z);c.speed=50;c.slip=0;c.vy=0;c.airborne=false;
    let deck=false,maxY=0;
    for(let i=0;i<360;i++){step(1/60);
      if(Math.abs(c.y-(w.bridgeYAt(0.4)+0.05))<2)deck=true;
      maxY=Math.max(maxY,c.y);}
    P('onDeck',deck?'Y':'N');P('maxBridgeY',maxY.toFixed(0));
    // 4. 跳台起飞
    const j0=Math.floor(0.495*260);
    const q0=w.roadPts[j0],q1=w.roadPts[j0+1];
    const d2=Math.hypot(q1.x-q0.x,q1.z-q0.z);
    c.x=q0.x- (q1.x-q0.x)/d2*5;c.z=q0.z-(q1.z-q0.z)/d2*5;
    c.y=w.groundYAt(c.x,c.z,c.y);
    c.heading=Math.atan2(q1.x-q0.x,q1.z-q0.z);c.speed=70;c.slip=0;c.vy=0;c.airborne=false;
    let apex=0,air=0;
    for(let i=0;i<200;i++){step(1/60);apex=Math.max(apex,c.y);if(c.airborne&&c.vy>3)air=1;}
    P('jumpApex',apex.toFixed(0));P('jumpAir',air?'Y':'N');
    document.title='SELFTEST '+out.join(' ');
  }
  // 颜色选择
  let currentColor=COLORS[0];
  const cg=$('colorGroup');
  COLORS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='colorBtn'+(i===0?' on':'');
    b.style.background='#'+c.toString(16).padStart(6,'0');
    b.addEventListener('click',()=>{
      currentColor=c;
      cg.querySelectorAll('.colorBtn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      if(car){car.bodyMat.color.set(c);}
    });
    cg.appendChild(b);
  });

  window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });

  // 开场镜头
  camera.position.set(-560,80,-40);
  camera.lookAt(0,10,0);
  // 调试/测试钩子（不影响游戏）
  window.__game={get car(){return car;},keys,input,step,heightAt:world.heightAt,world,animate,renderer};
  animate(performance.now());
}

// 启动
const boot=$('boot');
if(!window.THREE){boot.innerHTML='3D 引擎加载失败';}
else{
  boot.classList.add('hidden');
  main();
}
})();
</script>
</body>
</html>
