<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回声小径 · ECHO TRAIL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f}
body{display:flex;align-items:center;justify-content:center;font-family:'Georgia','Noto Serif SC',serif}
#wrap{position:relative;line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 80px rgba(94,234,212,.08),0 0 24px rgba(0,0,0,.8)}
#ui{position:absolute;inset:0;line-height:1.5;pointer-events:none;color:#e8ecff}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,7,15,.72);text-align:center;transition:opacity .5s;backdrop-filter:blur(2px)}
.screen.hidden{opacity:0;visibility:hidden}
.screen h1{font-size:52px;letter-spacing:14px;text-indent:14px;font-weight:700;color:#e8ecff;text-shadow:0 0 24px rgba(94,234,212,.45),3px 3px 0 #1a2138}
.screen .sub{font-size:13px;letter-spacing:9px;text-indent:9px;color:#5eead4;margin-top:6px;text-shadow:0 0 12px rgba(94,234,212,.5)}
.screen .tip{font-size:13px;color:#8b93b8;margin-top:26px;letter-spacing:2px}
.screen .keys{font-size:12px;color:#6a7396;margin-top:10px;font-family:'Courier New',monospace}
.screen .press{font-size:13px;color:#ffd873;margin-top:44px;animation:blink 1.4s infinite;letter-spacing:3px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
#end h1{font-size:40px}
#endstats{font-size:13px;color:#5eead4;margin-top:16px;letter-spacing:2px}
#end .msg{font-size:15px;color:#c9d2f5;margin-top:26px;line-height:2.1;letter-spacing:2px}
#lvname{position:absolute;top:26%;width:100%;text-align:center;font-size:30px;letter-spacing:10px;text-indent:10px;color:#e8ecff;text-shadow:0 0 18px rgba(94,234,212,.4),2px 2px 0 #1a2138;opacity:0;transition:opacity .6s}
#lvname span{display:block;font-size:14px;letter-spacing:6px;color:#5eead4;margin-top:8px}
#lvname.show{opacity:1}
#lvname.fadeout{opacity:0}
#hint{position:absolute;bottom:7%;width:100%;text-align:center;font-size:13px;color:#a8b0d0;background:rgba(10,13,29,.68);padding:8px 0;letter-spacing:2px;opacity:0;transition:opacity .6s;border-top:1px solid rgba(94,234,212,.12);border-bottom:1px solid rgba(94,234,212,.12)}
#hint.show{opacity:1}
#hint.fadeout{opacity:0}
#mute{position:absolute;top:6%;width:100%;text-align:center;font-size:12px;color:#ffd873;opacity:0;transition:opacity .3s;letter-spacing:2px}
#mute:not(:empty){opacity:1}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="ui">
  <div id="title" class="screen">
    <h1>回声小径</h1>
    <p class="sub">E C H O &nbsp; T R A I L</p>
    <p class="tip">与昨日的自己同行</p>
    <p class="keys">←→ / AD 移动 &nbsp;·&nbsp; Z / 空格 跳跃 &nbsp;·&nbsp; R 录制回声 &nbsp;·&nbsp; M 静音</p>
    <p class="press">— 按任意键，走进遗迹 —</p>
  </div>
  <div id="lvname" class="hidden"></div>
  <div id="hint" class="hidden"></div>
  <div id="mute"></div>
  <div id="end" class="screen hidden">
    <h1>抵达今天</h1>
    <p id="endstats"></p>
    <p class="msg">此去西安，山高路远。<br>不管走出多远，别忘了带上昨天的自己。</p>
    <p class="press">— 按 R 再走一遍 —</p>
  </div>
</div>
</div>
