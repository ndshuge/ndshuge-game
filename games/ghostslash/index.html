<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>残光斩 GHOSTSLASH · 阶段一</title>
<style>
  html,body{margin:0;height:100%;background:#08090c;overflow:hidden;touch-action:none}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;height:min(100vh,177.78vw);aspect-ratio:16/9}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0d11;cursor:none}
  #crt{position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 58%, rgba(1,1,8,.42) 100%)}
  #err{position:absolute;top:0;left:0;right:0;background:#a01818;color:#fff;font:12px/1.6 monospace;
    padding:4px 8px;display:none;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="g" width="640" height="360"></canvas>
  <div id="crt"></div>
  <div id="err"></div>
</div>
<script>
'use strict';
/* ============================================================
   残光斩 GHOSTSLASH —— 阶段一 · 核心切片
   核心创意：闪现即攻击。闪现轨迹（墨痕）首尾闭合 → 圈内皆斩。
   一刀两用：闪斩路径切人 + 弹回弹幕。
   手感层独立模块：FX（粒子/震屏/hitstop/切尸）+ SFX（全局低通+混响 master 链）
   ============================================================ */

window.onerror = function (msg, src, line) {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = '错误: ' + String(msg) + ' @行' + line;
  return false;
};

// ---------- 小工具 ----------
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
// 音名→频率
const NOTE_IDX = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
function freq(n) {
  const m = /^([A-G]#?)(-?\d)$/.exec(n);
  if (!m) return 440;
  return 440 * Math.pow(2, (NOTE_IDX[m[1]] + (parseInt(m[2], 10) - 4) * 12 - 9) / 12);
}

// ---------- 世界常量 ----------
const W = 640, H = 360;
const ROOM = { x0: 16, y0: 28, x1: W - 16, y1: H - 40 };  // 房间内墙

// 手感参数（独立模块，调这里）
const TUNE = {
  pSpeed: 235,            // 玩家移速
  dashDur: 0.095,         // 闪斩耗时
  dashLen: 132,           // 闪斩距离
  dashR: 15,              // 闪斩判定半径
  energyMax: 3,           // 闪斩能量格
  energyRegen: 0.9,       // 每格回复秒数
  killRefund: 1,          // 击杀返格
  slowScale: 0.55,        // 闪斩中时间因子（普通闪）
  slowMulti: 0.35,        // 闪斩中时间因子（多杀闪，更慢更帅）
  hitstopKill: 0.05,      // 单杀 hitstop
  hitstopMax: 0.22,
  inkLife: 2.6,           // 墨痕存活秒
  sealMinArea: 3200,      // 闭环最小面积
};

// ---------- 音频引擎 ----------
/* master 链:  [sfx/mus] -> lowpass(时停滤波) -> compressor -> dest
   混响: 合成 IR 卷积, sfx send bus（超越 beat-paddle 的第一张牌） */
const AU = {
  ctx: null, master: null, lp: null, comp: null, verb: null, verbGain: null,
  sfx: null, mus: null, noiseBuf: null,
  droneNodes: null, heartT: 0,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC({ latencyHint: 'interactive' });
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.8;
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -18; this.comp.knee.value = 24;
    this.comp.ratio.value = 5; this.comp.attack.value = 0.004; this.comp.release.value = 0.22;
    this.lp = c.createBiquadFilter();
    this.lp.type = 'lowpass'; this.lp.frequency.value = 18000; this.lp.Q.value = 0.6;
    this.master.connect(this.lp); this.lp.connect(this.comp); this.comp.connect(c.destination);
    // 混响 send（合成洞穴 IR）
    this.verb = c.createConvolver();
    this.verb.buffer = this.makeIR(1.7, 2.6);
    this.verbGain = c.createGain(); this.verbGain.gain.value = 0.3;
    this.verb.connect(this.verbGain); this.verbGain.connect(this.master);
    this.sfx = c.createGain(); this.sfx.gain.value = 0.95;
    this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.gain.value = 0.42;
    this.mus.connect(this.master);
    // 白噪声缓冲
    const len = c.sampleRate * 1.4;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  makeIR(dur, decay) {
    const c = this.ctx, rate = c.sampleRate, len = (rate * dur) | 0;
    const buf = c.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  now() { return this.ctx ? this.ctx.currentTime : 0; },

  // 凝滞声学：slow 0~1（1=完全凝滞）→ 低通 700~18000Hz，混响 send 升
  setSpace(slow) {
    if (!this.ctx) return;
    const t = this.now();
    const f = 700 + (18000 - 700) * (1 - slow);
    this.lp.frequency.setTargetAtTime(f, t, 0.06);
    this.verbGain.gain.setTargetAtTime(0.3 + slow * 0.28, t, 0.1);
  },

  tone(t, o) {
    const c = this.ctx; if (!c) return;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(18, o.f1), t + (o.dur || 0.15));
    const v = o.vol == null ? 0.3 : o.vol;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + (o.dur || 0.15));
    let out = o.dest || this.sfx;
    if (o.verb) { const vg = c.createGain(); vg.gain.value = o.verb; osc.connect(g); g.connect(vg); vg.connect(this.verb); g.connect(out); }
    else { osc.connect(g); g.connect(out); }
    osc.start(t); osc.stop(t + (o.dur || 0.15) + 0.03);
  },
  noise(t, o) {
    const c = this.ctx; if (!c) return;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter();
    f.type = o.ftype || 'lowpass'; f.Q.value = o.q || 0.8;
    f.frequency.setValueAtTime(o.f0 || 1700, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.f1), t + o.dur);
    const g = c.createGain();
    const v = o.vol == null ? 0.3 : o.vol;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);
    let out = o.dest || this.sfx;
    if (o.verb) { const vg = c.createGain(); vg.gain.value = o.verb; src.connect(f); f.connect(g); g.connect(vg); vg.connect(this.verb); g.connect(out); }
    else { src.connect(f); f.connect(g); g.connect(out); }
    src.start(t); src.stop(t + o.dur + 0.03);
  },
  pan(node, p) { // 立体声像 -1~1
    const c = this.ctx;
    const pn = c.createStereoPanner ? c.createStereoPanner() : null;
    if (!pn) return node;
    pn.pan.value = clamp(p, -1, 1);
    node.connect(pn); return pn;
  },

  // ---------- 战斗 SFX ----------
  sSlash(streak) { // 闪斩出刀：whoosh 上扫 + 瞬态，连杀递增音高
    const t = this.now(), b = 1 + Math.min(streak, 6) * 0.06;
    this.noise(t, { ftype: 'bandpass', f0: 800 * b, f1: 4200 * b, q: 1.2, dur: 0.09, vol: 0.34 });
    this.noise(t, { ftype: 'highpass', f0: 6000, dur: 0.01, vol: 0.22 });
    this.tone(t, { type: 'sawtooth', f0: 220 * b, f1: 90, dur: 0.08, vol: 0.1, verb: 0.2 });
  },
  sHit(streak, px, py) { // 命中切杀：四层（click/body/thump/crack）+ 五声音阶叮
    const t = this.now();
    // click 瞬态
    this.noise(t, { ftype: 'highpass', f0: 5600, dur: 0.011, vol: 0.42 });
    // body
    this.noise(t, { f0: 2300, f1: 190, dur: 0.12, vol: 0.5 });
    // thump
    this.tone(t, { type: 'sine', f0: 135, f1: 38, dur: 0.1, vol: 0.6 });
    // crack
    this.tone(t, { type: 'square', f0: 2900, f1: 1150, dur: 0.045, vol: 0.28 });
    // 连杀音阶（宫商角徵羽上行，混响送出）
    const scale = ['C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6', 'E6'];
    const n = scale[Math.min(streak, scale.length - 1)];
    this.tone(t + 0.012, { type: 'sine', f0: freq(n), dur: 0.34, vol: 0.17, verb: 0.45 });
    this.tone(t + 0.012, { type: 'sine', f0: freq(n) * 2, dur: 0.2, vol: 0.07, verb: 0.45 });
  },
  sRicochet(px) { // 弹幕反弹：金铁「叮锵」
    const t = this.now();
    this.tone(t, { type: 'triangle', f0: 2300, f1: 880, dur: 0.09, vol: 0.3 });
    this.noise(t, { ftype: 'highpass', f0: 4800, dur: 0.04, vol: 0.22 });
    this.tone(t, { type: 'square', f0: 3400, f1: 2400, dur: 0.05, vol: 0.12, verb: 0.3 });
  },
  sSeal() { // 墨痕闭环·封印印音：低频 boom + 三泛音铃 + 下扫噪声
    const t = this.now();
    this.tone(t, { type: 'sine', f0: 92, f1: 26, dur: 0.55, vol: 0.85, verb: 0.35 });
    this.tone(t, { type: 'triangle', f0: 660, dur: 0.7, vol: 0.16, verb: 0.6 });
    this.tone(t + 0.03, { type: 'sine', f0: 990, dur: 0.55, vol: 0.12, verb: 0.6 });
    this.tone(t + 0.06, { type: 'sine', f0: 1485, dur: 0.4, vol: 0.08, verb: 0.6 });
    this.noise(t, { ftype: 'bandpass', f0: 3000, f1: 300, q: 1.4, dur: 0.3, vol: 0.3, verb: 0.4 });
  },
  sDeath(px) { // 普通死亡闷响（非玩家刀下）
    const t = this.now();
    this.tone(t, { type: 'sine', f0: 110, f1: 42, dur: 0.14, vol: 0.4 });
    this.noise(t, { f0: 700, f1: 140, dur: 0.11, vol: 0.25 });
  },
  sHurt() { // 玩家受创
    const t = this.now();
    this.tone(t, { type: 'sawtooth', f0: 160, f1: 60, dur: 0.22, vol: 0.4 });
    this.noise(t, { f0: 1200, f1: 200, dur: 0.18, vol: 0.3 });
  },
  sSlowIn() { // 入时停：sub 下潜
    const t = this.now();
    this.tone(t, { type: 'sine', f0: 320, f1: 70, dur: 0.28, vol: 0.2 });
  },
  sSlowOut() { // 出时停：吸气上扫
    const t = this.now();
    this.noise(t, { ftype: 'bandpass', f0: 500, f1: 3600, q: 1, dur: 0.16, vol: 0.18 });
  },
  sUI() { this.tone(this.now(), { type: 'square', f0: 700, dur: 0.05, vol: 0.14 }); },
  sWave() { // 新波次号角
    const t = this.now(), ns = ['A4', 'E5', 'A5'];
    ns.forEach((n, i) => this.tone(t + i * 0.08, { type: 'triangle', f0: freq(n), dur: 0.16, vol: 0.2, verb: 0.4 }));
  },
  sAllClear() { // 通关小调
    const t = this.now(), ns = ['C5', 'E5', 'G5', 'C6'];
    ns.forEach((n, i) => this.tone(t + i * 0.09, { type: 'square', f0: freq(n), dur: 0.2, vol: 0.16, verb: 0.45 }));
  },

  // ---------- 氛围音乐：低音 drone + 心跳（慢动作中被滤波吃掉，只剩心跳感） ----------
  startDrone() {
    if (!this.ctx || this.droneNodes) return;
    const c = this.ctx;
    const g = c.createGain(); g.gain.value = 0.5;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 240; f.Q.value = 1.2;
    const o1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
    const o2 = c.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 55.7;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.mus);
    o1.start(); o2.start();
    this.droneNodes = { g, f, o1, o2 };
  },
  setDrone(v) { // title 时渐隐，战斗时渐入
    if (!this.droneNodes) return;
    this.droneNodes.g.gain.setTargetAtTime(v * 0.5, this.now(), 0.4);
  },
  heartbeat(dt, tScale) { // 心跳鼓：常速 1.1s 一跳，慢动作里放缓加大
    if (!this.ctx || !this.droneNodes) return;
    const period = 1.1 / (0.55 + 0.45 * tScale);
    this.heartT -= dt;
    if (this.heartT <= 0) {
      this.heartT = period;
      const t = this.now();
      const v = 0.28 + (1 - tScale) * 0.3;
      this.tone(t, { type: 'sine', f0: 82, f1: 40, dur: 0.12, vol: v, dest: this.mus });
      this.tone(t + period * 0.28, { type: 'sine', f0: 70, f1: 36, dur: 0.1, vol: v * 0.6, dest: this.mus });
    }
  },
};

// ---------- 手感层 FX ----------
const FX = {
  parts: [], pops: [], slashes: [], debris: [], rings: [],
  shake: 0, flash: 0, hitstop: 0, slowVis: 0,

  burst(x, y, color, n, pow, spread) {
    n = n || 12; pow = pow || 1;
    for (let i = 0; i < n; i++) {
      const a = spread != null ? spread + rand(-0.9, 0.9) : rand(0, TAU);
      const sp = rand(50, 300) * pow;
      this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.18, 0.55), t: 0, color, size: rand(1.5, 4) });
    }
  },
  pop(x, y, text, color, big) { this.pops.push({ x, y, text, color, big: !!big, t: 0, dur: big ? 0.8 : 0.55 }); },
  slash(x1, y1, x2, y2, col) { this.slashes.push({ x1, y1, x2, y2, t: 0, dur: 0.14, col: col || '#ffffff' }); },
  ring(x, y, color, maxR, dur) { this.rings.push({ x, y, color, maxR: maxR || 40, dur: dur || 0.3, t: 0 }); },
  kick(shakeAmt, stopT, flashAmt) {
    this.shake = Math.max(this.shake, shakeAmt);
    if (stopT) this.hitstop = Math.min(this.hitstop + stopT, TUNE.hitstopMax);
    if (flashAmt) this.flash = Math.max(this.flash, flashAmt);
  },
  corpse(x, y, w, h, ang, col) { // 切尸：两半沿斩线法线飞散
    const nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
    for (const s of [-1, 1]) {
      this.debris.push({
        x, y, w: w * rand(0.6, 0.9), h: h * rand(0.35, 0.5),
        vx: nx * s * rand(70, 150) + rand(-20, 20), vy: ny * s * rand(70, 150) - 40,
        rot: ang + rand(-0.4, 0.4), vr: rand(-7, 7), t: 0, life: rand(0.7, 1.1), col,
      });
    }
  },

  update(dt, gdt) { // dt 实时, gdt 游戏时间（hitstop 冻结世界但粒子用部分实时）
    if (this.hitstop > 0) this.hitstop -= dt;
    this.shake *= Math.exp(-dt * 7.5);
    this.flash = Math.max(0, this.flash - dt * 4);
    const fdt = this.hitstop > 0 ? gdt * 0.12 : gdt; // hitstop 中粒子微动
    const upd = (arr, fn) => { for (let i = arr.length - 1; i >= 0; i--) { const p = arr[i]; if (fn(p, fdt)) arr.splice(i, 1); } };
    upd(this.parts, (p, d) => { p.t += d; if (p.t >= p.life) return true; p.x += p.vx * d; p.y += p.vy * d; p.vy += 560 * d; p.vx *= Math.exp(-d * 2); return false; });
    upd(this.pops, (p, d) => { p.t += d; return p.t >= p.dur; });
    upd(this.slashes, (s, d) => { s.t += d; return s.t >= s.dur; });
    upd(this.rings, (r, d) => { r.t += d; return r.t >= r.dur; });
    upd(this.debris, (p, d) => {
      p.t += d; if (p.t >= p.life) return true;
      p.x += p.vx * d; p.y += p.vy * d; p.vy += 640 * d; p.rot += p.vr * d;
      if (p.y > ROOM.y1 - 4 && p.vy > 0) { p.vy *= -0.4; p.vx *= 0.6; p.y = ROOM.y1 - 4; }
      return false;
    });
  },

  draw(ctx) {
    // 尸块
    for (const d of this.debris) {
      const a = 1 - d.t / d.life;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(d.x, d.y); ctx.rotate(d.rot);
      ctx.fillStyle = d.col; ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
      ctx.fillStyle = '#0c0e12'; ctx.fillRect(-d.w / 2, -d.h / 2, d.w, 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // 粒子
    for (const p of this.parts) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = a; ctx.fillStyle = p.color;
      const s = Math.max(1, Math.round(p.size * a));
      ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    }
    ctx.globalAlpha = 1;
    // 斩击白线
    for (const s of this.slashes) {
      const p = s.t / s.dur;
      ctx.globalAlpha = (1 - p);
      ctx.strokeStyle = s.col;
      ctx.lineWidth = 4 * (1 - p) + 1;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      ctx.lineWidth = 1;
    }
    // 冲击环
    for (const r of this.rings) {
      const p = r.t / r.dur;
      ctx.globalAlpha = (1 - p) * 0.9; ctx.strokeStyle = r.color; ctx.lineWidth = 3 - p * 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3 + r.maxR * p, 0, TAU); ctx.stroke(); ctx.lineWidth = 1;
    }
    ctx.globalAlpha = 1;
    // 弹字
    for (const p of this.pops) {
      const k = p.t / p.dur;
      ctx.globalAlpha = 1 - k * k;
      ctx.fillStyle = p.color;
      ctx.font = (p.big ? 'bold 16px' : 'bold 10px') + ' monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y - k * (p.big ? 26 : 16));
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  },
};

// ---------- 输入 ----------
const Input = { keys: {}, idleT: 0, anyDir: false };
// 鼠标（逻辑坐标）
const Mouse = { x: W / 2, y: H / 2, in: false };
const cvEl = document.getElementById('g');
cvEl.addEventListener('mousemove', e => {
  const r = cvEl.getBoundingClientRect();
  Mouse.x = (e.clientX - r.left) / r.width * W;
  Mouse.y = (e.clientY - r.top) / r.height * H;
  Mouse.in = true;
});
cvEl.addEventListener('mouseleave', () => { Mouse.in = false; });
cvEl.addEventListener('mousedown', () => { Game.onKey('KeyJ'); }); // 左键也能闪
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  Input.keys[e.code] = true;
  Game.onKey(e.code);
});
addEventListener('keyup', e => { Input.keys[e.code] = false; });
Input.axis = () => {
  let x = 0, y = 0;
  if (Input.keys['KeyA'] || Input.keys['ArrowLeft']) x -= 1;
  if (Input.keys['KeyD'] || Input.keys['ArrowRight']) x += 1;
  if (Input.keys['KeyW'] || Input.keys['ArrowUp']) y -= 1;
  if (Input.keys['KeyS'] || Input.keys['ArrowDown']) y += 1;
  if (x && y) { x *= 0.7071; y *= 0.7071; }
  return { x, y };
};

// ---------- 墨痕系统（闪现路径 + 闭环检测） ----------
const Ink = {
  path: [],        // [{x,y}] 连续闪现落点链
  segs: [],        // 显示用线段 {x1,y1,x2,y2,t}
  reset() { this.path = []; this.segs = []; },

  addSeg(ax, ay, bx, by) {
    this.segs.push({ x1: ax, y1: ay, x2: bx, y2: by, t: 0 });
    // 维护闪现落点链
    const P = this.path;
    const tail = P[P.length - 1];
    if (!tail || Math.hypot(tail.x - ax, tail.y - ay) > 2) P.push({ x: ax, y: ay });
    P.push({ x: bx, y: by });
    // 闭环检测：新段 vs 旧段（跳过相邻段）
    if (P.length >= 3) {
      const a3 = { x: ax, y: ay }, b3 = { x: bx, y: by };
      for (let i = 1; i < P.length - 2; i++) {
        const hit = segCross(a3, b3, P[i - 1], P[i]);

  trySeal(hit, i) {

    for (let k = i; k < this.path.length; k++) poly.push(this.path[k]);
    const area = polyArea(poly);
    if (Math.abs(area) < TUNE.sealMinArea) { FX.pop(hit.x, hit.y, '圈太小', '#6b7686'); this.path = []; return; }

  update(gdt) {

  draw(ctx) {

function segCross(p1, p2, p3, p4) {
  const d1x = p2.x - p1.x, d1y = p2.y - p1.y, d2x = p4.x - p3.x, d2y = p4.y - p3.y;
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((p3.x - p1.x) * d2y - (p3.y - p1.y) * d2x) / den;
  const u = ((p3.x - p1.x) * d1y - (p3.y - p1.y) * d1x) / den;
  if (t >= 0 && t <= 1 && u >= 0 && u <= 1) return { x: p1.x + t * d1x, y: p1.y + t * d1y };
  return null;
}
function polyArea(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length]; a += p.x * q.y - q.x * p.y; }
  return a / 2;
}
function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

// ---------- 玩家 ----------
const Player = {
  x: W / 2, y: H / 2, fx: 1, fy: 0,      // 面向
  hp: 3, inv: 0, energy: TUNE.energyMax, regenT: 0,
  dash: null, trail: [], slashStreak: 0, streakT: 0,

  reset() {
    this.x = W / 2; this.y = H - 90; this.hp = 3; this.inv = 0;
    this.energy = TUNE.energyMax; this.dash = null; this.trail = [];
    this.slashStreak = 0; this.streakT = 0;
  },
  update(dt, gdt) {
    this.inv = Math.max(0, this.inv - gdt);
    this.streakT -= gdt;
    if (this.streakT <= 0 && this.slashStreak > 0) this.slashStreak = 0;
    // 面向跟随鼠标
    if (Mouse.in && !this.dash) {
      const mdx = Mouse.x - this.x, mdy = Mouse.y - this.y;
      const ml = Math.hypot(mdx, mdy) || 1;
      this.fx = mdx / ml; this.fy = mdy / ml;
    }
    // 能量再生
    if (this.energy < TUNE.energyMax) {
      this.regenT += gdt;
      if (this.regenT >= TUNE.energyRegen) { this.regenT = 0; this.energy++; }
    } else this.regenT = 0;

    if (this.dash) { this.updateDash(gdt); return; }

    const ax = Input.axis();
    if (ax.x || ax.y) {
      this.x += ax.x * TUNE.pSpeed * gdt;
      this.y += ax.y * TUNE.pSpeed * gdt;
      if (ax.x && ax.y) { this.fx = ax.x * 0.7071; this.fy = ax.y * 0.7071; }
      else if (ax.x) { this.fx = ax.x; this.fy = 0; }
      else { this.fx = 0; this.fy = ax.y; }
      this.x = clamp(this.x, ROOM.x0 + 8, ROOM.x1 - 8);
      this.y = clamp(this.y, ROOM.y0 + 10, ROOM.y1 - 6);
      Input.idleT = 0;
    } else {
      Input.idleT += gdt;
    }

    // 残影衰减
    for (let i = this.trail.length - 1; i >= 0; i--) { this.trail[i].t += gdt; if (this.trail[i].t > 0.3) this.trail.splice(i, 1); }
  },

  tryDash() {
    if (this.dash || this.energy <= 0) { if (!this.dash && this.energy <= 0) { FX.pop(this.x, this.y - 18, '气力尽', '#c96a5a'); AU.sUI(); } return; }
    // 方向：鼠标指向（固定距离闪现，非移动到鼠标）
    let dx, dy;
    if (Mouse.in) { dx = Mouse.x - this.x; dy = Mouse.y - this.y; }
    else { dx = this.fx || 1; dy = this.fy; }
    const l = Math.hypot(dx, dy) || 1;
    dx /= l; dy /= l;
    let bx = this.x + dx * TUNE.dashLen, by = this.y + dy * TUNE.dashLen;
    bx = clamp(bx, ROOM.x0 + 8, ROOM.x1 - 8);
    by = clamp(by, ROOM.y0 + 10, ROOM.y1 - 6);
    this.energy--; this.regenT = 0;

    // 路径命中预判（按投影排序，特效随刀推进）
    const kills = [];
    for (const e of Game.enemies) {
      if (e.dead) continue;
      const t = projT(this.x, this.y, bx, by, e.x, e.y);
      if (t != null && Math.hypot(this.x + (bx - this.x) * t - e.x, this.y + (by - this.y) * t - e.y) < TUNE.dashR + 10) {
        kills.push({ e, t });
      }
    }
    kills.sort((a, b) => a.t - b.t);
    const rics = [];
    for (const b of Game.bullets) {
      if (b.dead || b.from !== 'enemy') continue;
      const t = projT(this.x, this.y, bx, by, b.x, b.y);
      if (t != null && Math.hypot(this.x + (bx - this.x) * t - b.x, this.y + (by - this.y) * t - b.y) < TUNE.dashR + 4) {
        rics.push({ b, t });
      }
    }
    this.dash = { t: 0, ax: this.x, ay: this.y, bx, by, kills, rics, kIdx: 0, rIdx: 0 };
    this.trail.length = 0;
    AU.sSlash(this.slashStreak);
    Input.idleT = 0;
  },
  updateDash(gdt) {
    const d = this.dash;
    d.t += gdt;
    const k = Math.min(1, d.t / TUNE.dashDur);
    this.x = lerp(d.ax, d.bx, k);
    this.y = lerp(d.ay, d.by, k);
    this.trail.push({ x: this.x, y: this.y, t: 0 });
    while (d.kIdx < d.kills.length && d.kills[d.kIdx].t <= k) {
      const { e } = d.kills[d.kIdx++];
      const ang = Math.atan2(d.by - d.ay, d.bx - d.ax);
      Game.killEnemy(e, ang, this.slashStreak);
      this.slashStreak++;
      this.streakT = 0.9;
    }
    while (d.rIdx < d.rics.length && d.rics[d.rIdx].t <= k) {
      const { b } = d.rics[d.rIdx++];
      b.vx = -b.vx * 1.45; b.vy = -b.vy * 1.45; b.from = 'player';
      FX.ring(b.x, b.y, '#ffd977', 22, 0.22);
      FX.pop(b.x, b.y - 8, '弹!', '#ffd977');
      AU.sRicochet(b.x);
    }
    if (k >= 1) {
      Ink.addSeg(d.ax, d.ay, d.bx, d.by);
      FX.slash(d.ax, d.ay, d.bx, d.by, '#eaf6ff');
      this.dash = null;
    }
  },
  hurt(fromX, fromY) {
    if (this.inv > 0 || this.dash) return;
    this.hp--; this.inv = 1.2;
    FX.kick(7, 0, 0.5);
    const a = Math.atan2(this.y - fromY, this.x - fromX);
    this.x = clamp(this.x + Math.cos(a) * 26, ROOM.x0 + 8, ROOM.x1 - 8);
    this.y = clamp(this.y + Math.sin(a) * 26, ROOM.y0 + 10, ROOM.y1 - 6);
    FX.burst(this.x, this.y, '#e05545', 14, 1);
    FX.pop(this.x, this.y - 20, '破!', '#e05545', true);
    AU.sHurt();
    if (this.hp <= 0) Game.onPlayerDead();
  },
  draw(ctx) {
    // 残影
    for (const t of this.trail) {
      const a = (1 - t.t / 0.3) * 0.5;
      ctx.globalAlpha = a; ctx.fillStyle = '#8fd8ff';
      ctx.fillRect(Math.round(t.x - 4), Math.round(t.y - 9), 8, 15);
    }
    ctx.globalAlpha = 1;
    // 受创闪白
    const blink = this.inv > 0 && ((this.inv * 14) | 0) % 2 === 0;
    if (blink) ctx.globalAlpha = 0.4;
    const x = Math.round(this.x), y = Math.round(this.y);
    // 身体（像素刀客：白衣+斗笠+朱围巾）
    ctx.fillStyle = '#dfe6ec'; ctx.fillRect(x - 5, y - 8, 10, 13);   // 身
    ctx.fillStyle = '#232830'; ctx.fillRect(x - 5, y + 5, 10, 3);    // 腿
    ctx.fillStyle = '#b8352c'; ctx.fillRect(x - 5, y - 2, 10, 2);    // 围巾
    ctx.fillStyle = '#e8e2d2'; ctx.fillRect(x - 7, y - 12, 14, 4);   // 斗笠
    ctx.fillStyle = '#3a4450'; ctx.fillRect(x - 7, y - 8, 2, 3);
    ctx.fillStyle = '#3a4450'; ctx.fillRect(x + 5, y - 8, 2, 3);
    // 刀（指向鼠标方向）
    ctx.strokeStyle = '#cfd8e2'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + this.fx * 6, y - 6 + this.fy * 6);
    ctx.lineTo(x + this.fx * 15, y - 6 + this.fy * 15);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.globalAlpha = 1;
  },
};
function projT(ax, ay, bx, by, px, py) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  if (l2 < 1e-6) return null;
  let t = ((px - ax) * dx + (py - ay) * dy) / l2;
  return clamp(t, 0, 1);
}

// ---------- 敌人 ----------
let EID = 0;
function mkRonin(x, y) {
  return { id: EID++, type: 'ronin', x, y, w: 14, h: 18, hp: 1, dead: false,
    state: 'walk', st: 0, face: 1, flash: 0 };
}
function mkArcher(x, y) {
  return { id: EID++, type: 'archer', x, y, w: 13, h: 17, hp: 1, dead: false,
    state: 'aim', st: rand(0.4, 1.2), face: -1, flash: 0, aimA: 0 };
}
const Enemies = {
  update(e, dt, gdt) {
    e.flash = Math.max(0, e.flash - gdt);
    if (e.type === 'ronin') {
      if (e.state === 'walk') {
        const dx = Player.x - e.x, dy = Player.y - e.y, l = Math.hypot(dx, dy) || 1;
        e.face = Math.sign(dx) || 1;
        if (l > 30) { e.x += dx / l * 66 * gdt; e.y += dy / l * 66 * gdt; }
        e.x = clamp(e.x, ROOM.x0 + 10, ROOM.x1 - 10);
        e.y = clamp(e.y, ROOM.y0 + 12, ROOM.y1 - 8);
        if (l < 34) { e.state = 'wind'; e.st = 0; }
      } else if (e.state === 'wind') {
        e.st += gdt;
        if (e.st > 0.38) { e.state = 'slash'; e.st = 0; }
      } else if (e.state === 'slash') {
        e.st += gdt;
        if (e.st < 0.14) {
          // 挥砍判定
          const dx = Player.x - e.x, dy = Player.y - e.y;
          if (Math.hypot(dx, dy) < 40) Player.hurt(e.x, e.y);
        }
        if (e.st > 0.5) { e.state = 'walk'; }
      }
    } else { // archer
      if (e.state === 'aim') {
        e.st += gdt;
        const dx = Player.x - e.x, dy = Player.y - e.y;
        e.face = Math.sign(dx) || 1;
        e.aimA = Math.atan2(dy, dx);
        if (e.st > 1.6) { e.state = 'fire'; e.st = 0; }
      } else if (e.state === 'fire') {
        e.st += gdt;
        if (!e.fired) {
          e.fired = true;
          Game.spawnBullet(e.x, e.y, Math.cos(e.aimA) * 175, Math.sin(e.aimA) * 175);
          AU.tone(AU.now(), { type: 'square', f0: 900, f1: 500, dur: 0.08, vol: 0.16 });
        }
        if (e.st > 0.5) { e.state = 'aim'; e.st = rand(-0.3, 0.4); e.fired = false; }
      }
    }
  },
  draw(ctx, e) {
    const x = Math.round(e.x), y = Math.round(e.y);
    const body = e.type === 'ronin' ? '#8a3a34' : '#4a3d5c';
    const dark = e.type === 'ronin' ? '#5c2620' : '#322a44';
    // 预警红闪
    const warn = (e.type === 'ronin' && e.state === 'wind') || (e.type === 'archer' && e.state === 'aim' && e.st > 1.1);
    ctx.fillStyle = warn ? (((e.st * 18) | 0) % 2 ? '#ff5040' : body) : body;
    ctx.fillRect(x - e.w / 2, y - e.h / 2, e.w, e.h);
    ctx.fillStyle = dark; ctx.fillRect(x - e.w / 2, y + e.h / 2 - 4, e.w, 4);
    // 头
    ctx.fillStyle = warn ? '#ffb0a0' : '#c8bfae';
    ctx.fillRect(x - 4, y - e.h / 2 - 4, 8, 6);
    // 眼
    ctx.fillStyle = '#ffd050';
    ctx.fillRect(x - 3 + e.face * 2, y - e.h / 2 - 2, 2, 2);
    // 武器
    if (e.type === 'ronin') {
      ctx.fillStyle = '#6a707a';
      ctx.fillRect(x + e.face * 7, y - 4, e.face * 10, 2);
      if (e.state === 'wind') { // 抬刀
        ctx.fillStyle = '#c8cfd8';
        ctx.fillRect(x + e.face * 5, y - 14, e.face * 4, 12);
      }
    } else {
      ctx.fillStyle = '#6a5a80';
      ctx.save(); ctx.translate(x, y); ctx.rotate(e.aimA || 0);
      ctx.fillRect(4, -1, 10, 2); ctx.restore();
      // 瞄准线
      if (e.state === 'aim' && e.st > 0.9) {
        ctx.globalAlpha = 0.35 + 0.3 * Math.sin(e.st * 20);
        ctx.strokeStyle = '#ff6a50';
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(e.aimA) * 300, y + Math.sin(e.aimA) * 300); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  },
};

// ---------- 弹幕 ----------
function spawnB(x, y, vx, vy) { return { x, y, vx, vy, from: 'enemy', dead: false }; }

// ---------- 训练间（波次） ----------
const WAVES = [
  { tip: '方向键移动 · J 闪斩 —— 一刀穿多人',
    spawn: () => [mkRonin(W / 2 - 90, 120), mkRonin(W / 2, 110), mkRonin(W / 2 + 90, 120)] },
  { tip: '闪斩路径能斩反弹幕 —— 弹回去',
    spawn: () => [mkArcher(80, 80), mkArcher(W - 80, 80), mkRonin(W / 2 - 60, 90), mkRonin(W / 2 + 60, 90)] },
  { tip: '连续闪现让墨痕闭合 —— 圈内皆斩',
    spawn: () => {
      const arr = [], cx = W / 2, cy = 170, r = 95;
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU - Math.PI / 2;
        arr.push(mkRonin(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.72));
      }
      return arr;
    } },
  { tip: '自由练习 —— 感受它',
    spawn: () => [mkArcher(70, 70), mkRonin(W - 100, 100), mkRonin(W / 2, 70), mkArcher(W - 70, H - 110)] },
];

// ---------- 游戏主体 ----------
const Game = {
  state: 'title',   // title / play / dead / clear
  enemies: [], bullets: [],
  wave: 0, waveClearT: 0, tip: '', tipT: 0,
  slow: 0,         // 0=常速 1=慢动作（视觉渐变）
  timeScale: 1,
  kills: 0, bestStreak: 0, seals: 0,
  deadT: 0, clearT: 0,

  start() {
    this.state = 'play';
    this.enemies = []; this.bullets = [];
    this.wave = 0; this.kills = 0; this.bestStreak = 0; this.seals = 0;
    Player.reset(); Ink.reset();
    this.loadWave(0);
    AU.startDrone();
  },
  loadWave(i) {
    this.wave = i;
    this.enemies = WAVES[i].spawn();
    this.tip = WAVES[i].tip; this.tipT = 3.2;
    AU.sWave();
  },
  nearestEnemy(x, y, maxD) {
    let best = null, bd = maxD * maxD;
    for (const e of this.enemies) {
      if (e.dead) continue;
      const d = (e.x - x) ** 2 + (e.y - y) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  },
  spawnBullet(x, y, vx, vy) { this.bullets.push(spawnB(x, y, vx, vy)); },

  killEnemy(e, ang, streak) {
    if (e.dead) return;
    e.dead = true;
    this.kills++;
    this.bestStreak = Math.max(this.bestStreak, streak + 1);
    const col = e.type === 'ronin' ? '#8a3a34' : '#4a3d5c';
    FX.corpse(e.x, e.y, e.w + 4, e.h, ang, col);
    FX.burst(e.x, e.y, '#c8402f', 10, 1, ang + Math.PI / 2);
    FX.burst(e.x, e.y, '#e8e2d2', 4, 0.7);
    FX.ring(e.x, e.y, '#eaf6ff', 26, 0.25);
    FX.pop(e.x, e.y - 14, streak >= 2 ? (streak + 1) + ' 连!' : '斩', streak >= 2 ? '#ffd977' : '#eaf6ff');
    FX.kick(2 + Math.min(streak, 4), TUNE.hitstopKill + Math.min(streak, 4) * 0.02, streak >= 2 ? 0.3 : 0.12);
    AU.sHit(streak);
    Player.energy = Math.min(TUNE.energyMax, Player.energy + TUNE.killRefund);
    // 弹掉附近敌弹（刀风）
    for (const b of this.bullets) {
      if (!b.dead && b.from === 'enemy' && Math.hypot(b.x - e.x, b.y - e.y) < 30) { b.dead = true; FX.burst(b.x, b.y, '#ffb050', 5, 0.6); }
    }
  },

  onSeal(poly) {
    // 圈内皆斩
    let n = 0;
    for (const e of this.enemies) {
      if (!e.dead && pointInPoly(e.x, e.y, poly)) { this.killEnemy(e, rand(0, TAU), 1); n++; }
    }
    this.seals++;
    // 金线封印特效
    this.sealFx = { poly: poly.map(p => ({ x: p.x, y: p.y })), t: 0, dur: 0.5 };
    FX.kick(9, 0.15, 0.75);
    FX.pop(W / 2, 150, '封', '#ffd977', true);
    AU.sSeal();
    Player.energy = TUNE.energyMax;
    Ink.segs.length = 0;
  },

  onPlayerDead() {
    this.state = 'dead'; this.deadT = 0;
    FX.burst(Player.x, Player.y, '#e05545', 26, 1.4);
    FX.kick(10, 0.3, 1);
  },

  onKey(code) {
    if (this.state === 'title') {
      if (code === 'KeyJ' || code === 'Space' || code === 'Enter') { AU.init(); AU.resume(); AU.sUI(); this.start(); }
      return;
    }
    if (this.state === 'play') {
      if (code === 'KeyJ' || code === 'Space') Player.tryDash();
    } else if (this.state === 'dead' && this.deadT > 0.9) {
      AU.sUI(); this.start();
    } else if (this.state === 'clear' && this.clearT > 0.8) {
      AU.sUI(); this.state = 'title';
    }
  },

  update(dtReal) {
    // 慢动作：只绑闪斩本体。闪入唰地变慢，收刀余韵自然恢复
    const wantSlow = this.state === 'play' && !!Player.dash;
    const deep = wantSlow && Player.dash.kills.length >= 2;
    const wasSlow = this.slow > 0.5;
    this.slow = lerp(this.slow, wantSlow ? 1 : 0, 1 - Math.exp(-dtReal * (wantSlow ? 22 : 11)));
    const isSlow = this.slow > 0.5;
    if (isSlow !== wasSlow) { isSlow ? AU.sSlowIn() : AU.sSlowOut(); }
    AU.setSpace(this.slow);
    // hitstop
    const base = deep ? TUNE.slowMulti : TUNE.slowScale;
    let ts = lerp(1, base, this.slow);
    if (FX.hitstop > 0) ts = 0.02;
    this.timeScale = ts;
    const gdt = dtReal * ts;

    FX.update(dtReal, gdt);
    if (this.sealFx) { this.sealFx.t += dtReal; if (this.sealFx.t > this.sealFx.dur) this.sealFx = null; }

    if (this.state === 'title') { AU.setDrone(0); return; }

    if (this.state === 'dead') {
      this.deadT += dtReal;
      if (this.deadT > 1.4) this.start();
      return;
    }
    if (this.state === 'clear') {
      this.clearT += dtReal;
      return;
    }

    Player.update(dtReal, gdt);
    Ink.update(gdt);
    for (const e of this.enemies) if (!e.dead) Enemies.update(e, dtReal, gdt);
    // 弹
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.x += b.vx * gdt; b.y += b.vy * gdt;
      if (b.x < ROOM.x0 || b.x > ROOM.x1 || b.y < ROOM.y0 || b.y > ROOM.y1) {
        b.dead = true; FX.burst(b.x, b.y, '#ffb050', 4, 0.5);
      }
      if (!b.dead && b.from === 'player') {
        for (const e of this.enemies) {
          if (!e.dead && Math.abs(b.x - e.x) < e.w / 2 + 3 && Math.abs(b.y - e.y) < e.h / 2 + 3) {
            b.dead = true;
            this.killEnemy(e, Math.atan2(b.vy, b.vx), 0);
            break;
          }
        }
      }
      if (!b.dead && b.from === 'enemy' && Player.inv <= 0 && !Player.dash) {
        if (Math.abs(b.x - Player.x) < 7 && Math.abs(b.y - Player.y) < 9) { b.dead = true; Player.hurt(b.x, b.y); }
      }
      if (b.dead) this.bullets.splice(i, 1);
    }
    // 波次推进
    if (this.enemies.every(e => e.dead)) {
      this.waveClearT += gdt;
      if (this.waveClearT > 0.7) {
        this.waveClearT = 0;
        if (this.wave + 1 < WAVES.length) { this.loadWave(this.wave + 1); AU.sAllClear(); }
        else { this.state = 'clear'; this.clearT = 0; AU.sAllClear(); }
      }
    } else this.waveClearT = 0;

    this.tipT -= gdt;
    AU.heartbeat(dtReal, this.slow);
  },

  draw(ctx) {
    ctx.save();
    // 震屏
    if (FX.shake > 0.2) ctx.translate(Math.round(rand(-FX.shake, FX.shake)), Math.round(rand(-FX.shake, FX.shake)));

    // 背景
    ctx.fillStyle = '#0b0d11'; ctx.fillRect(-20, -20, W + 40, H + 40);
    // 地砖
    ctx.fillStyle = '#12151b';
    for (let gy = ROOM.y0; gy < ROOM.y1; gy += 24) {
      for (let gx = ROOM.x0; gx < ROOM.x1; gx += 32) {
        if (((gx / 32 | 0) + (gy / 24 | 0)) % 2 === 0) ctx.fillRect(gx, gy, 32, 24);
      }
    }
    // 内墙
    ctx.strokeStyle = '#2a3140'; ctx.lineWidth = 2;
    ctx.strokeRect(ROOM.x0, ROOM.y0, ROOM.x1 - ROOM.x0, ROOM.y1 - ROOM.y0);
    ctx.lineWidth = 1;

    Ink.draw(ctx);
    // 封印金圈
    if (this.sealFx) {
      const s = this.sealFx, p = s.t / s.dur;
      ctx.globalAlpha = (1 - p);
      ctx.strokeStyle = '#ffd977'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(s.poly[0].x, s.poly[0].y);
      for (let i = 1; i < s.poly.length; i++) ctx.lineTo(s.poly[i].x, s.poly[i].y);
      ctx.closePath(); ctx.stroke();
      ctx.lineWidth = 1;
      for (const pt of s.poly) { ctx.fillStyle = '#fff2c8'; ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4); }
      ctx.globalAlpha = 1;
    }

    for (const e of this.enemies) if (!e.dead) Enemies.draw(ctx, e);
    // 弹
    for (const b of this.bullets) {
      ctx.fillStyle = b.from === 'player' ? '#ffd977' : '#ff9040';
      ctx.fillRect(Math.round(b.x) - 2, Math.round(b.y) - 2, 4, 4);
      ctx.fillStyle = b.from === 'player' ? 'rgba(255,217,119,.4)' : 'rgba(255,144,64,.35)';
      ctx.fillRect(Math.round(b.x - b.vx * 0.03) - 1, Math.round(b.y - b.vy * 0.03) - 1, 3, 3);
    }
    if (this.state !== 'dead') Player.draw(ctx);
    FX.draw(ctx);

    // 闪斩凝滞视觉（轻暗角，不抢画面）
    if (this.slow > 0.02 && this.state === 'play') {
      const s = this.slow;
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.8);
      vg.addColorStop(0, 'rgba(10,20,40,0)');
      vg.addColorStop(1, `rgba(20,40,80,${0.4 * s})`);
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }
    // 受击红闪
    if (FX.flash > 0.01) {
      ctx.fillStyle = `rgba(220,50,40,${FX.flash * 0.3})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();

    // HUD
    this.drawHUD(ctx);
    this.drawAim(ctx);
  },
  // 瞄准指示：闪斩落点 + 虚线 + 鼠标准星
  drawAim(ctx) {
    if (!Mouse.in) return;
    const inGame = this.state === 'play';
    const p = Player;
    if (inGame && !Player.dash) {
      const dx = Mouse.x - p.x, dy = Mouse.y - p.y;
      const l = Math.hypot(dx, dy) || 1;
      let bx = p.x + dx / l * TUNE.dashLen, by = p.y + dy / l * TUNE.dashLen;
      bx = clamp(bx, ROOM.x0 + 8, ROOM.x1 - 8);
      by = clamp(by, ROOM.y0 + 10, ROOM.y1 - 6);
      const plan = this.slow > 0.5; // 时之隙中：规划模式，指示变金变亮
      const col = plan ? '#ffd977' : '#9fd8e8';
      // 淡虚线
      ctx.globalAlpha = plan ? 0.4 : 0.24;
      ctx.strokeStyle = col; ctx.setLineDash([3, 5]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(bx, by); ctx.stroke();
      ctx.setLineDash([]);
      // 落点菱形
      ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.PI / 4);
      ctx.globalAlpha = plan ? 0.85 : 0.5;
      ctx.strokeRect(-4, -4, 8, 8);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    // 鼠标准星：四角括号 + 中心点（全状态显示，防光标隐身）
    const mx = Math.round(Mouse.x), my = Math.round(Mouse.y), g = 6, c = 3;
    const plan2 = this.state === 'play' && this.slow > 0.5;
    ctx.strokeStyle = plan2 ? '#ffd977' : '#eaf6ff';
    ctx.globalAlpha = plan2 ? 1 : 0.85; ctx.lineWidth = 1;
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      ctx.beginPath();
      ctx.moveTo(mx + sx * g, my + sy * g - sy * c);
      ctx.lineTo(mx + sx * g, my + sy * g);
      ctx.lineTo(mx + sx * g - sx * c, my + sy * g);
      ctx.stroke();
    }
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fillRect(mx, my - 1, 2, 2);
    ctx.globalAlpha = 1;
  },

  drawHUD(ctx) {
    if (this.state === 'title') {
      ctx.fillStyle = '#0b0d11'; ctx.fillRect(0, 0, W, H);
      // 标题
      ctx.textAlign = 'center';
      ctx.fillStyle = '#eaf6ff';
      ctx.font = 'bold 44px monospace';
      ctx.fillText('残 光 斩', W / 2, 120);
      ctx.fillStyle = '#5f6b7c';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('G H O S T S L A S H', W / 2, 145);
      ctx.fillStyle = '#9fd8e8';
      ctx.font = '12px monospace';
      ctx.fillText('闪现即刀 · 墨痕成圈 · 圈内皆斩', W / 2, 185);
      ctx.fillStyle = '#4a5568';
      ctx.font = '11px monospace';
      ctx.fillText('WASD / 方向键 移动 · 鼠标瞄准', W / 2, 235);
      ctx.fillText('J / 空格 / 左键 朝鼠标方向闪斩', W / 2, 255);
      ctx.fillText('闪斩瞬间时间凝滞 · 连斩越多越慢', W / 2, 275);
      ctx.fillText('闪现轨迹闭合 → 圈内皆斩', W / 2, 295);
      // 闪烁提示
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
      ctx.fillStyle = '#eaf6ff';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('按 J 开始', W / 2, 330);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
      return;
    }
    // 血
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < Player.hp ? '#e05545' : '#2a2f38';
      const x = ROOM.x0 + 4 + i * 14;
      ctx.fillRect(x, ROOM.y0 - 16, 10, 8);
      ctx.fillStyle = '#1a1e26';
      ctx.fillRect(x + 2, ROOM.y0 - 14, 2, 2);
    }
    // 能量菱形
    for (let i = 0; i < TUNE.energyMax; i++) {
      const x = ROOM.x0 + 4 + i * 16, y = H - 26;
      ctx.fillStyle = i < Player.energy ? '#8fd8ff' : '#232a35';
      ctx.save(); ctx.translate(x + 5, y + 5); ctx.rotate(Math.PI / 4);
      ctx.fillRect(-4, -4, 8, 8); ctx.restore();
      if (i === Player.energy && Player.energy < TUNE.energyMax) {
        ctx.strokeStyle = '#3a4a5c';
        ctx.beginPath(); ctx.arc(x + 5, y + 5, 6, -Math.PI / 2, -Math.PI / 2 + TAU * Player.regenT / TUNE.energyRegen);
        ctx.stroke();
      }
    }
    // 敌数 + 统计
    const alive = this.enemies.filter(e => !e.dead).length;
    ctx.fillStyle = '#5f6b7c'; ctx.font = '10px monospace'; ctx.textAlign = 'right';
    ctx.fillText('敌 ' + alive, W - 24, ROOM.y0 - 16);
    ctx.fillText('斩 ' + this.kills + ' · 封 ' + this.seals, W - 24, ROOM.y0 - 5);
    ctx.textAlign = 'left';
    // 提示条
    if (this.tipT > 0 && this.tip) {
      ctx.globalAlpha = Math.min(1, this.tipT / 0.5);
      ctx.fillStyle = '#0e1116'; ctx.fillRect(W / 2 - 170, 38, 340, 20);
      ctx.strokeStyle = '#2a3140'; ctx.strokeRect(W / 2 - 170, 38, 340, 20);
      ctx.fillStyle = '#9fd8e8'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
      ctx.fillText(this.tip, W / 2, 52);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }
    if (this.state === 'clear') {
      ctx.fillStyle = 'rgba(8,10,14,0.75)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd977'; ctx.font = 'bold 30px monospace';
      ctx.fillText('训练完毕', W / 2, 160);
      ctx.fillStyle = '#9fd8e8'; ctx.font = '12px monospace';
      ctx.fillText('斩 ' + this.kills + ' · 最高连 ' + (this.bestStreak) + ' · 封印 ' + this.seals, W / 2, 195);
      ctx.fillStyle = '#5f6b7c';
      ctx.fillText('阶段一完成 —— 按 J 返回标题', W / 2, 225);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }
  },
};

// ---------- 主循环 ----------
const cv = document.getElementById('g');
const ctx = cv.getContext('2d');
let lastT = performance.now();
function loop(t) {
  let dt = (t - lastT) / 1000;
  lastT = t;
  dt = Math.min(dt, 0.05);
  Game.update(dt);
  ctx.imageSmoothingEnabled = false;
  Game.draw(ctx);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
