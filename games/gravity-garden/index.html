<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重力花园 · Gravity Garden</title>
<link rel="icon" href="data:,">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#10131c; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; z-index:10; pointer-events:none; user-select:none;
         font-family:"Noto Serif SC","Songti SC","STSong",serif; color:rgba(238,232,220,.92); }
  #title { top:22px; left:26px; }
  #title h1 { font-size:20px; font-weight:600; letter-spacing:.38em; text-shadow:0 2px 18px rgba(0,0,0,.55); }
  #title p  { font-size:11px; letter-spacing:.3em; opacity:.6; margin-top:7px; text-shadow:0 1px 8px rgba(0,0,0,.5); }
  #grav { top:24px; right:28px; text-align:right; font-size:13px; letter-spacing:.22em; opacity:.9;
          text-shadow:0 2px 14px rgba(0,0,0,.6); }
  #grav .arrow { display:inline-block; font-size:19px; margin-left:8px; transition:transform .35s; color:#ffc98a; }
  #tips { bottom:24px; left:50%; transform:translateX(-50%); font-size:11.5px; letter-spacing:.12em;
          opacity:.68; white-space:nowrap; text-shadow:0 1px 10px rgba(0,0,0,.55); }
  #tips span { margin:0 11px; }
  #tips b { color:#ffc98a; font-weight:600; }
  #mode { top:82px; left:26px; font-size:12px; letter-spacing:.2em; opacity:.85; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  #mode b { color:#7fc4ff; font-weight:600; }
  #count { bottom:26px; right:28px; font-size:12px; letter-spacing:.14em; opacity:.5; }
  #toast { position:fixed; top:34%; left:50%; transform:translate(-50%,-50%); z-index:11; pointer-events:none;
           font-family:"Noto Serif SC","Songti SC","STSong",serif; font-size:30px; letter-spacing:.42em;
           color:rgba(255,242,225,.95); text-shadow:0 2px 30px rgba(255,170,80,.5); opacity:0;
           transition:opacity .45s ease; white-space:nowrap; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:9; }
  #fatal { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
           background:#10131c; color:#cfc8b8; font-family:"Noto Serif SC","Songti SC",serif; font-size:15px;
           letter-spacing:.12em; text-align:center; line-height:2; }
</style>
</head>
<body>
<div id="app"></div>
<div id="flash"></div>
<div id="toast"></div>
<div class="hud" id="title"><h1>重力花园</h1><p>GRAVITY&nbsp;GARDEN</p></div>
<div class="hud" id="mode">左键 · <b id="modeName">撒下</b></div>
<div class="hud" id="grav">重力<span class="arrow" id="gravArrow">↓</span></div>
<div class="hud" id="tips">
  <span><b>方向键/WASD</b> 移动</span>
  <span><b>Shift/Ctrl</b> 升降</span>
  <span><b>1-9</b> 批量生成</span>
  <span><b>R</b> 左键功能</span>
  <span><b>右键</b> 引爆</span>
  <span><b>空格</b> 重力</span>
  <span><b>C</b> 清空</span>
</div>
<div class="hud" id="count">0 件</div>
<div id="fatal">本游戏需要 WebGL 支持<br>请换用 Chrome / Edge 等现代浏览器</div>

<script src="./lib/three.min.js"></script>
<script src="./lib/cannon.min.js"></script>
<script src="./lib/addons/environments/RoomEnvironment.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
