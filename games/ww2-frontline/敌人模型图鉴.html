      chips: ['血量 ' + (id === 'elite' ? 180 : 100), '武器 ' + GUN_LABEL[id], '配枪 MP40/Kar98k/StG44 按变体'],
      build: function () { return buildBlocky(pal); }
    };
  }
  var MODELS = [
    {
      id: 'voxel', cam: { dist: 4.2, lookY: 0.85 },
      name: '体素士兵 · Shock Trooper', tag: '正式模型 · 全部变体共用',
      desc: 'CC0 体素模型（MagicaVoxel @ ephtracy），调色板贴图 + 像素脸补丁，归一化 1.7 米。游戏中野战灰 / 迷彩 / 精英三变体共用此身体，变体区别在配枪、血量与护甲色。',
      chips: ['模型 ShockTrooper.obj', '贴图 调色板 PNG', '高度 1.7m', '命中判定 头/胸/腹 三球'],
      build: function () {
        var g = new THREE.Group();
        var mesh = buildVoxel();
        g.add(mesh);
        var gun = gunPose(makeGun('t'));
        g.add(gun);
        g.__setWeapon = function (v) { g.remove(gun); gun = gunPose(makeGun(v)); g.add(gun); };
        return g;
      }
    },
    soldierTab('t'),
    soldierTab('ct'),
    soldierTab('elite'),
    {
      id: 'gun_mp40', cam: { dist: 2.4, lookY: 0 },
      name: 'MP40 冲锋枪', tag: '野战灰兵 · t 变体配枪',
      desc: '敌人武器库三件套之一，几何体拼装（枪身 / 枪管 / 弹匣 / 枪托）。持枪时整体放大 ×1.55，枪口朝前。3 连发，0.11s 间隔。',
      chips: ['连发 3', '射速 0.11s/发', '配给 野战灰兵'],
      build: function () { var g = new THREE.Group(); var gun = makeGunMP40(); gun.scale.setScalar(2.4); g.add(gun); return g; }
    },
    {
      id: 'gun_kar', cam: { dist: 3.0, lookY: 0 },
      name: 'Kar98k 步枪', tag: '迷彩兵 · ct 变体配枪',
      desc: '敌人武器库三件套之二。长枪管 + 木托 + 准星，单发高伤节奏（0.85s 间隔）。',
      chips: ['单发 1', '间隔 0.85s/发', '配给 迷彩褐绿兵'],
      build: function () { var g = new THREE.Group(); var gun = makeGunKar98k(); gun.scale.setScalar(2.4); g.add(gun); return g; }
    },
    {
      id: 'gun_stg', cam: { dist: 2.6, lookY: 0 },
      name: 'StG44 突击步枪', tag: '精英军官 · elite 变体配枪',
      desc: '敌人武器库三件套之三。现代突击步枪雏形，木托 + 长枪管。3 连发，0.13s 间隔。',
      chips: ['连发 3', '射速 0.13s/发', '配给 精英军官'],
      build: function () { var g = new THREE.Group(); var gun = makeGunStG44(); gun.scale.setScalar(2.4); g.add(gun); return g; }
    },
    {
      id: 'tracer', cam: { dist: 1.1, lookY: 0 },
      name: '敌人曳光弹', tag: '敌人开火的弹体',
      desc: '敌人射击的可视曳光弹体：细长发光长方体（0.035×0.035×0.28），自发光暖橙。飞行可躲，速度 15~22，最长存活 3.2 秒。',
      chips: ['弹体 0.035×0.035×0.28', '材质 自发光', '速度 15~22', '寿命 3.2s'],
      build: buildTracer
    },
    {
      id: 'rocket', cam: { dist: 1.9, lookY: 0 },
      name: '火箭弹', tag: '玩家火箭筒 · 对敌爆炸',
      desc: '玩家 5 号位火箭筒的弹体（锥柱 0.06→0.09 × 0.55 + 尾部火焰），命中敌人或地形爆炸，范围 6 米递减伤害，中心 400 伤害必杀。',
      chips: ['弹体 锥柱 ×0.55', '爆炸 400 中心伤害', '半径 6m', '寿命 4s'],
      build: buildRocket
    }
  ];

  /* ================= 标签页 ================= */
  var tabsEl = document.getElementById('tabs');
  var wbtnEl = document.getElementById('wbtn');
  var pName = document.getElementById('p-name');
  var pTag = document.getElementById('p-tag');
  var pDesc = document.getElementById('p-desc');
  var pChips = document.getElementById('p-chips');

  var current = null, currentName = null;
  var yaw = 0.7, pitch = 0.28, dist = 4;

  function show(name) {
    if (current) { scene.remove(current); current = null; }
    var def = MODELS.filter(function (m) { return m.id === name; })[0];
    if (!def) return;
    current = def.build();
    scene.add(current);
    currentName = name;
    pName.textContent = def.name;
    pTag.textContent = def.tag;
    pDesc.textContent = def.desc;
    pChips.innerHTML = def.chips.map(function (c) { return '<span class="p-chip">' + c + '</span>'; }).join('');
    dist = def.cam.dist;
    targetY = def.cam.lookY;
    // 换枪按钮：仅体素士兵
    wbtnEl.style.display = name === 'voxel' ? 'flex' : 'none';
    var btns = wbtnEl.querySelectorAll('button');
    btns.forEach(function (b) { b.classList.remove('on'); });
    if (name === 'voxel' && btns.length) btns[0].classList.add('on');
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-id') === name);
    });
  }
  var targetY = 0.85;
  MODELS.forEach(function (def) {
    var b = document.createElement('button');
    b.textContent = def.name;
    b.setAttribute('data-id', def.id);
    b.addEventListener('click', function () { show(def.id); });
    tabsEl.appendChild(b);
  });
  // 换枪按钮组
  [['t', 'MP40'], ['ct', 'Kar98k'], ['elite', 'StG44']].forEach(function (pair) {
    var b = document.createElement('button');
    b.textContent = pair[1];
    b.addEventListener('click', function () {
      if (currentName === 'voxel' && current && current.__setWeapon) current.__setWeapon(pair[0]);
      wbtnEl.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    });
    wbtnEl.appendChild(b);
  });

  /* ================= 轨道交互 ================= */
  var dragging = false, lx = 0, ly = 0, autoRotate = true;
  renderer.domElement.addEventListener('pointerdown', function (e) { dragging = true; lx = e.clientX; ly = e.clientY; autoRotate = false; });
  window.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    yaw -= (e.clientX - lx) * 0.01;
    pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY - ly) * 0.01));
    lx = e.clientX; ly = e.clientY;
  });
  renderer.domElement.addEventListener('wheel', function (e) {
    e.preventDefault();
    dist = Math.max(1.0, Math.min(12, dist + e.deltaY * 0.005));
  }, { passive: false });

  function animate() {
    requestAnimationFrame(animate);
    if (autoRotate) yaw += 0.005;
    camera.position.set(
      dist * Math.cos(pitch) * Math.sin(yaw),
      dist * Math.sin(pitch) + targetY,
      dist * Math.cos(pitch) * Math.cos(yaw)
    );
    camera.lookAt(0, targetY, 0);
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', function () {
    var w = window.innerWidth || VW, h = window.innerHeight || VH;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  var initId = (location.hash || '').replace('#', '');
  show(MODELS.some(function (m) { return m.id === initId; }) ? initId : 'voxel');
  animate();
})();
</script>
</body>
</html>
