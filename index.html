<style>
:root{--bg:#050514;--cyan:#00e5ff;--yellow:#ffd54f;--ink:#eafcff;--dim:rgba(150,215,255,.55)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace;
     color:#bfefff;user-select:none;-webkit-user-select:none;
     background:linear-gradient(#070a1e,#03040e)}
#space{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
       image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}
#crt{position:fixed;inset:0;z-index:6;pointer-events:none;
     background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
#brand{position:fixed;top:12px;left:16px;z-index:5;font-size:12px;letter-spacing:1px;color:var(--dim);pointer-events:none}
#brand b{color:var(--yellow);font-weight:normal}
#sysbar{position:fixed;top:12px;right:16px;z-index:5;display:flex;gap:10px;align-items:center}
.gh{font-size:12px;letter-spacing:1px;color:var(--cyan);text-decoration:none;
  border:1px solid rgba(0,229,255,.4);padding:5px 10px;background:rgba(4,8,24,.7)}
.gh:active{background:rgba(0,229,255,.16)}
/* 选中游戏的编号 / 标题 / 描述 / 进入按钮 / 点赞全部画进 canvas，
   底部不再叠任何 DOM 面板；DOM 只剩品牌条、GITHUB 和提示行。 */
#hint{position:fixed;top:44px;left:0;right:0;z-index:5;
  font-size:12px;letter-spacing:1px;color:rgba(120,190,230,.4);text-align:center;pointer-events:none}
body.warping #brand,body.warping #sysbar,body.warping #hint{opacity:0}
#brand,#sysbar,#hint{transition:opacity .3s}
#rotate{display:none;position:fixed;left:0;right:0;
  bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;text-align:center;
  font-size:12px;letter-spacing:1px;color:rgba(120,190,230,.5);pointer-events:none}
@media (orientation:portrait) and (max-width:820px){
  body{background:linear-gradient(#070a1e,#03040e)}
  #space{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);
         mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent)}
  #rotate{display:block}
}
#boot{position:fixed;inset:0;z-index:50;background:#02030c;pointer-events:none;
  animation:bootin 1.2s ease-in .45s forwards}
@keyframes bootin{to{opacity:0}}
</style>

<script>
'use strict';
window.addEventListener('error',function(ev){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:70px;left:8px;right:8px;z-index:99;background:#4a0d16;color:#ffd7d7;font:12px monospace;padding:8px;white-space:pre-wrap;border:1px solid #a33';

/* 游戏星系：中心恒星=鼠哥游戏厅，游戏=绕轨道行星（常显名字）。
   点任意行星直接跃迁进入该游戏；←→/滑动切换选中浏览。 */
var GAMES=[
  {no:'No.01',t:'西线前线',tag:'FPS · 战役',d:'沉浸式二战射击。COD 风格 HUD，指挥官无线电实时喊话，突击东进，德语嘶吼就在耳边。',href:'./games/ww2-frontline/',key:'ww2-frontline',c:'#8a5a34',g:'#e0b070'},
  {no:'No.02',t:'凝时 STILL',tag:'弹幕 · 时停',d:'时间只在你移动时流动。牵引光点穿过凝滞的弹幕海，逃向出口。',href:'./games/still/',key:'still',c:'#4a6a6e',g:'#a8e3ff',ring:true},
  {no:'No.03',t:'重力花园',tag:'物理 · 解压',d:'暮色花园里撒下刚体，看它们真实坠落碰撞堆叠。右键引爆，空格翻转重力。',href:'./games/gravity-garden/',key:'gravity-garden',c:'#6a8a3a',g:'#d9e08a'},
  {no:'No.04',t:'墨途',tag:'水墨 · 平台',d:'走过的路留下墨迹，墨迹即桥。墨会蒸发、被啃食、被风吹散，通关时你的轨迹装裱成笔意。',href:'./games/motu/',key:'motu',c:'#3a3f4a',g:'#c9d2e8'},
  {no:'No.05',t:'回声小径',tag:'像素 · 回声',d:'「与昨日的自己同行」。像素风平台跳跃，按下 R 录下你的回声，在遗迹间穿行。',href:'./games/echo-trail/',key:'echo-trail',c:'#2a7c6e',g:'#8fe8d0'},
  {no:'No.06',t:'鼓点乒乓',tag:'音游 · 街机',d:'球的往返时间就是节拍，卡拍回击即在演奏鼓机。打得越好，这首曲子越完整。',href:'./games/beat-paddle/',key:'beat-paddle',c:'#6a3d8c',g:'#d9b0ff'},
  {no:'No.07',t:'慢光 LIGHTLAG',tag:'太空 · 防御',dev:true,d:'光速有限，你看到的敌人是它几秒前的幻影。靠火控预测环解算提前量，守好深空信标。',href:'./games/lightlag/',key:'lightlag',c:'#46506b',g:'#9fb4d6',ring:true},
  {no:'No.08',t:'VOCALON! 节拍革命',tag:'音游 · 原曲',dev:true,d:'术力口原曲音游。音符从核心飞向四环，DFJK 径向打击，空格开启子弹时间，OVERDRIVE 时缓爆发。',href:'./games/vocalon-chaos/',key:'vocalon-chaos',c:'#6e4a5c',g:'#d0a8b8'},
  {no:'No.09',t:'像素乒乓 CAT vs RAT',tag:'街机 · 对决',dev:true,d:'猫鼠乒乓对决。鼠标移拍、按住蓄力、W/S 加旋转，老鼠的球带重力弧线，七分定胜负。',href:'./games/pixel-pong/',key:'pixel-pong',c:'#465a78',g:'#a4b8d6'},
  {no:'No.10',t:'回带 REWINDER',tag:'像素 · 时间',dev:true,d:'按住 R 让世界倒退。你用倒带抢救自己，它用倒带改写关卡——它记得你退过多少次。',href:'./games/rewinder/',key:'rewinder',c:'#3a4158',g:'#ccab8a',ring:true},
  {no:'No.11',t:'拾色 HUEBOUND',tag:'射击 · 涂色',d:'世界被灰烬褪色，你泼墨夺回颜色。红穿透反弹、黄电弧跳三、蓝冰冻碎冰，三色切换打回一整片色谱。',href:'./games/shise/',key:'shise',c:'#5a2a6a',g:'#e0a0ff'},
  {no:'No.12',t:'一闪 · 像素居合斩',tag:'动作 · 居合',d:'敌人踏进白线的一瞬拔刀。完美判定慢镜头一刀两断，挥空就是 0.38 秒硬直破绽。',href:'./games/issen/',key:'issen',c:'#7a2430',g:'#ff9aa8'},
  {no:'No.13',t:'残光斩 GHOSTSLASH',tag:'动作 · 闪斩',d:'朝鼠标方向闪斩，刀出鞘的一瞬世界凝滞。连斩越多，慢镜头越深。',href:'./games/ghostslash/',key:'ghostslash',c:'#203c46',g:'#7fe0e8',ring:true},
  {no:'No.14',t:'光核围城 LUMEN SIEGE',tag:'像素 · 生存',d:'俯视角像素生存。一盏灯对抗十种蚀影，每次升级三选一，每条枪线都能滚成自己的打法。撑得越久，它们越强。',href:'./games/lumen-siege/',key:'lumen-siege',c:'#1e4a58',g:'#9fe8ff',ring:true}
];
var MAIN=6;
/* 系统「减少动态效果」默认跳过转场（无障碍惯例），但允许显式覆盖：
   想要动画的人不该被系统的默认值默默挡住。
   ?anim=on 强制播放，?anim=off 强制跳过，选择记进 localStorage。 */
var animPref=null;
var animParam=/[?&]anim=(on|off)/.exec(location.search);
if(animParam){animPref=animParam[1];try{localStorage.setItem('ng-anim',animPref);}catch(e){}}
else{try{animPref=localStorage.getItem('ng-anim');}catch(e){}}
var REDUCED=animPref?animPref==='off':matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 跳过转场时给一句明确的话。之前是默默省略，看起来就像「动画时有时无」。 */
(function(){
  if(!REDUCED||animPref==='off')return;
  var n=document.createElement('div');
  n.textContent='系统开启了「减少动态效果」，转场已省略 · 点这里开启';
  n.style.cssText='position:fixed;left:50%;transform:translateX(-50%);'
    +'bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:7;'
    +'font-size:12px;letter-spacing:1px;color:#9fd4ef;background:rgba(4,8,24,.92);'
    +'border:1px solid rgba(0,229,255,.45);padding:8px 14px;cursor:pointer';
  n.addEventListener('click',function(){
    try{localStorage.setItem('ng-anim','on');}catch(e){}
    location.reload();
  });
  document.body.appendChild(n);
})();
var IS_TOUCH=matchMedia('(pointer:coarse)').matches;
var W=480,H=270,CX=W/2,SY=104,TAU=Math.PI*2;
var cv=document.getElementById('space'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,k){return a+(b-a)*k;}
function shade(hex,f){var n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  if(f>=0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}else{r*=1+f;g*=1+f;b*=1+f}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function hexA(hex,a){var n=parseInt(hex.slice(1),16);
  return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function fit(){
  /* 信息条现在画在画布底部，不能再裁：统一用 contain，保证 480x270 整幅可见 */
  var s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=Math.ceil(W*s)+'px';cv.style.height=Math.ceil(H*s)+'px';}
addEventListener('resize',fit);fit();

/* 行星轨道分配：三圈椭圆，内快外慢。
   相位 = 圈内序号 × (TAU / 圈内数量)，同轨相邻行星的角距恒为 360°/n
   （内圈/中圈各 5 颗 → 72°，外圈 4 颗 → 90°），这是“最小角距”的硬保证；
   每圈再叠一个固定偏移，避免三圈在同一条视线上排成一串。 */
var ORBR=[66,108,150],ORBP=[.11,.075,.05],SQUASH=.46,SPOTY=SY-2;
/* Smaller discs on the same orbits: the gap between neighbours grows, so labels stop
   colliding and stop needing to be pushed away from their planet. */
var planets=GAMES.map(function(g,i){return{g:g,i:i,orbit:i%3,a:0,sp:0,x:CX,y:SPOTY,r:[8,7.5,9][i%3],pulse:0,ov:1,ly:undefined};});
(function(){
  for(var o=0;o<3;o++){
    var m=planets.filter(function(p){return p.orbit===o;});
    var step=TAU/m.length;
    m.forEach(function(p,j){p.a=j*step+o*.8;});
  }
  planets.forEach(function(p){p.sp=ORBP[p.orbit]*(p.i%2?1:-1)*(REDUCED?.35:1);});
})();
var devMode=false;
try{devMode=localStorage.getItem('ng-dev-open')==='1';}catch(e){}
function visible(p){return devMode||!p.g.dev;}
var cur=0;
try{cur=clamp(parseInt(localStorage.getItem('armory_index')||'0',10)||0,0,GAMES.length-1);}catch(e){}
if(!visible(planets[cur]))cur=0;

var rocket={a:Math.PI*.25,x:CX,y:SPOTY,salute:0,clicks:0,last:0,hop:0,_x:CX,_y:SPOTY};
var flash={active:false,t:0,dur:.34};
var parts=[];
var gdt=1/60,mouseX=CX,mouseY=SY,mox=0,moy=0,shakeT=0,whitePop=0,flameAcc=0;
var worldLW=1,infoFade=1;

var bgGrad=ctx.createLinearGradient(0,0,0,H);
bgGrad.addColorStop(0,'#070a1e');bgGrad.addColorStop(1,'#03040e');
var nebula=[[110,85,150,'rgba(0,110,150,.10)'],[360,180,130,'rgba(96,44,150,.10)'],[300,55,90,'rgba(130,100,30,.06)']]
  .map(function(q){var g=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],q[2]);
    g.addColorStop(0,q[3]);g.addColorStop(1,'rgba(0,0,0,0)');return g;});
var vign=ctx.createRadialGradient(CX,SY,90,CX,SY,310);
vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(0,0,14,.5)');
var stars=[];
for(var si=0;si<110;si++)stars.push({a:rnd(0,TAU),d:rnd(2,300),tw:rnd(.8,2.6),ph:rnd(0,TAU),
  par:rnd(.3,1),s:Math.random()<.85?1:2,
  c:Math.random()<.68?'#ffffff':(Math.random()<.5?'#00e5ff':'#ffd54f')});
var band=[];
for(var bi=0;bi<70;bi++){
  var u=rnd(-20,W+20),v=SY+Math.sin(-.28)*(u-CX)+rnd(-34,34);
  band.push({x:u,y:v,a:rnd(.12,.4)});}
var brights=[];
for(var ti=0;ti<6;ti++)brights.push({x:rnd(20,W-20),y:rnd(24,60),ph:rnd(0,TAU)});

/* 音效 */
var actx=null,master=null;
function audio(){if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=1;master.connect(actx.destination);}catch(e){}}
function tone(type,f0,f1,dur,peak,delay){if(!actx)return;
  var t=actx.currentTime+(delay||0);
  var o=actx.createOscillator(),g=actx.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function tick(){tone('square',700,980,.06,.08);}
function whoosh(){tone('sawtooth',180,520,.4,.1);tone('square',90,260,.4,.06);}

/* 点赞 / 选中项缓存
   #card 与 #devslot 的 DOM 已删：信息与入口改画进 canvas，点赞也是 canvas 按钮。
   这里只负责取数、写 localStorage、维护内存缓存，不碰任何 DOM。 */
function $(id){return document.getElementById(id);}
var NS='ndshuge-game',API='https://abacus.jasoncameron.dev';
var FB='12px "Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace';
var FB16='16px "Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace';
/* Planet labels use a smaller face than everything else: at 12px the names of 14
   orbiting planets ran into each other constantly, and a label pushed away from its
   planet stops reading as belonging to it. */
var FBL='10px "Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace';
var FS_LABEL=10;
var likeCache={},likeOn={},likePop={};
function likedKey(k){return 'ng-like-'+k;}
function isLiked(k){try{return localStorage.getItem(likedKey(k))==='1';}catch(e){return false;}}
function countText(v){if(typeof v!=='number')return '\u00b7';
  return v>=1000?(v/1000).toFixed(1).replace(/\.0$/,'')+'k':String(v);}
function fetchLike(key){
  try{fetch(API+'/get/'+NS+'/'+key).then(function(r){return r.json();}).then(function(j){
    if(j&&typeof j.value==='number')likeCache[key]=j.value;}).catch(function(){});}catch(e){}
}
function addLike(key){
  if(isLiked(key))return;
  try{localStorage.setItem(likedKey(key),'1');}catch(e){}
  likeOn[key]=true;likePop[key]=1;
  likeCache[key]=(typeof likeCache[key]==='number'?likeCache[key]:0)+1;
  tone('square',880,1320,.09,.09);tone('square',1320,1760,.07,.05,.06);
  try{fetch(API+'/hit/'+NS+'/'+key).then(function(r){return r.json();}).then(function(j){
    if(j&&typeof j.value==='number')likeCache[key]=j.value;}).catch(function(){});}catch(e){}
}
function renderInfo(){
  /* 编号/标题/描述已画进 canvas，这里只刷新点赞缓存 */
  var k=GAMES[cur].key;likeOn[k]=isLiked(k);fetchLike(k);
}
/* 逐字测量换行；最多 maxLines 行，溢出补省略号 */
function wrapText(str,maxW,maxLines){
  var all=[],cur='';
  for(var i=0;i<str.length;i++){
    var ch=str.charAt(i);
    if(cur&&ctx.measureText(cur+ch).width>maxW){all.push(cur);cur='';}
    cur+=ch;}
  if(cur)all.push(cur);
  if(all.length>maxLines){
    all=all.slice(0,maxLines);
    var last=all[maxLines-1];
    while(last.length&&ctx.measureText(last+'\u2026').width>maxW)last=last.slice(0,-1);
    all[maxLines-1]=last+'\u2026';}
  return all;
}
function drawHeart(x,y,c){
  ctx.fillStyle=c;
  ctx.fillRect(x+1,y,2,2);ctx.fillRect(x+5,y,2,2);
  ctx.fillRect(x,y+2,8,2);ctx.fillRect(x+1,y+4,6,1);
  ctx.fillRect(x+2,y+5,4,1);ctx.fillRect(x+3,y+6,2,1);
}

/* ---------------- 点行星：追上降落 → 出舱相遇 → 投影面板 ----------------
   chase   1.0s  相机俯冲进目标行星，火箭离开巡航轨道悬停到行星上空
   descent 0.7s  火箭缓缓落到行星表面
   touch   0.3s  触地扬尘
   meet    1.7s  老鼠出舱 / 兔子出基地，相向走到中间握手
   panel   0.5s  投影仪亮起，面板淡入
   全程约 4.2s；任意时刻点击 = 跳过转场直接进入。 */
var LY=176;                        /* 地平线（着陆点）屏幕 y */
var PX=16,PY=8,PW=W-32,PH=120;     /* 投影面板矩形 */
var ROCKET_X=CX-58,BASE_X=CX+64;
function ease(k){return k*k*(3-2*k);}
function hitRect(r,x,y){return !!r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
var INTRO={chase:1.0,descent:.7,touch:.3,meet:1.7,panel:.5,
  leave:.5,walkback:.9,board:.5,ascend:.9,recall:1.0};
var RETURNING={leave:1,walkback:1,board:1,ascend:1,recall:1};
var intro={active:false,i:-1,phase:'chase',t:0,
  W:{x:0,y:0},camAX:0,camAY:0,camZ:1,Z:50,arcR:600,orbitA:0,
  sx:0,sy:0,rx:0,ry:0,scale:1,flameK:1,
  doorOpen:0,mx:0,my:0,bx:0,by:0,marm:0,barm:0,walkPh:0,clasp:false,
  mdir:1,bdir:-1,malpha:1,balpha:1,
  panel:0,starK:1,enterR:null,likeR:null,panelR:null,backR:null};
function groundY(x){var d=x-CX,R=intro.arcR,t=R*R-d*d;return LY+(t>0?R-Math.sqrt(t):0);}
/* 转场相机：世界点 intro.W 落到屏幕 (camAX,camAY)、按 camZ 缩放；非转场时为单位阵+抖动 */
function camApply(shX,shY){
  var z=intro.active?intro.camZ:1;
  var ax=intro.active?intro.camAX:0,ay=intro.active?intro.camAY:0;
  var wx=intro.active?intro.W.x:0,wy=intro.active?intro.W.y:0;
  ctx.setTransform(z,0,0,z,ax-wx*z+shX,ay-wy*z+shY);
}
function launchWarp(i){
  if(intro.active||flash.active)return;

  var p=planets[i];
  audio();
  intro.active=true;intro.i=i;intro.phase='chase';intro.t=0;
  intro.W={x:p.x,y:p.y-p.r};          /* 目标行星顶端 = 着陆点 */
  intro.Z=600/p.r;intro.arcR=600;
  intro.camZ=1;intro.camAX=intro.W.x;intro.camAY=intro.W.y;
  intro.sx=rocket.x;intro.sy=rocket.y+9;   /* 巡航火箭底缘 */
  intro.scale=1;intro.doorOpen=0;intro.marm=0;intro.barm=0;
  intro.panel=0;intro.clasp=false;intro.walkPh=0;intro.starK=1;
  intro.flameK=1;intro.orbitA=rocket.a;      /* 冻结轨道点：回来时从这里接上，不跳 */
  intro.mdir=1;intro.bdir=-1;intro.malpha=1;intro.balpha=1;
  intro.mx=CX-52;intro.my=LY;intro.bx=BASE_X;intro.by=LY;
  intro.enterR=null;intro.likeR=null;intro.panelR=null;intro.backR=null;
  document.body.classList.add('warping');

}
function go(){                        /* 渐黑后跳转 */

/* 返回：告别 → 各自回舱 → 起飞 → 相机拉回星系，全程约 3.8s，点击可快进 */
function launchReturn(){
  if(!intro.active||RETURNING[intro.phase])return;
  if(intro.phase!=='panel'&&intro.phase!=='meet')return;
  audio();
  intro.phase='leave';intro.t=0;intro.clasp=false;
  intro.mdir=-1;intro.bdir=1;          /* 两人转身 */
  intro.malpha=1;intro.balpha=1;
  /* 从当前状态收，不假设一定是从完整面板/到位后返回（Esc 可在 meet 中途触发） */
  intro.panelFrom=intro.panel;intro.armFrom=intro.marm;
  intro.mxFrom=intro.mx;intro.bxFrom=intro.bx;intro.doorFrom=intro.doorOpen;
  intro.enterR=intro.likeR=intro.backR=intro.panelR=null;
  document.body.classList.remove('warping');
  tone('square',520,300,.14,.09);tone('square',300,180,.18,.05,.06);
}
function liftoff(){
  shakeT=REDUCED?0:.22;whoosh();tone('sawtooth',110,520,.55,.12);tone('square',60,240,.5,.07);
  for(var i=0;i<30;i++){
    parts.push({x:intro.rx+rnd(-8,8),y:LY-1,vx:rnd(-70,70),vy:rnd(-46,-6),
      age:0,life:rnd(.4,.95),s:Math.random()<.45?2:1,
      c:Math.random()<.5?'#ffd54f':(Math.random()<.5?'#93a4bd':'#cfd8dc')});}
}
function endReturn(fast){
  if(!intro.active)return;
  intro.active=false;intro.i=-1;intro.phase='chase';intro.t=0;intro.panel=0;
  /* 火箭接回被冻结的那一刻的轨道点：位置连续，不会跳 */
  rocket.a=intro.orbitA;
  rocket.x=CX+Math.cos(rocket.a)*172;
  rocket.y=SPOTY+Math.sin(rocket.a)*172*SQUASH;
  document.body.classList.remove('warping');
  if(fast)whitePop=REDUCED?0:.10;
  infoFade=1;
  intro.enterR=intro.likeR=intro.backR=intro.panelR=null;
  tone('square',700,520,.10,.06);
}
function touchdown(){
  shakeT=REDUCED?0:.22;whoosh();tone('sine',130,45,.42,.26);
  for(var i=0;i<26;i++){
    parts.push({x:intro.rx+rnd(-9,9),y:LY-2,vx:rnd(-62,62),vy:rnd(-36,-8),

      c:Math.random()<.5?'#93a4bd':'#cfd8dc'});}
}
function introUpdate(dt){
  var ph=intro.phase,dur=INTRO[ph]||1,k=clamp(intro.t/dur,0,1);
  intro.t+=dt;
  if(ph==='chase'){
    var e=ease(k);
    intro.camZ=lerp(1,intro.Z,e);
    intro.camAX=lerp(intro.W.x,CX,e);intro.camAY=lerp(intro.W.y,LY,e);
    intro.rx=lerp(intro.sx,ROCKET_X,e);
    intro.ry=lerp(intro.sy,LY-46,e);
    intro.scale=lerp(1,2,e);
    if(k>=1){intro.phase='descent';intro.t=0;}
  }else if(ph==='descent'){
    intro.camZ=intro.Z;intro.camAX=CX;intro.camAY=LY;
    intro.rx=ROCKET_X;intro.scale=2;
    intro.ry=lerp(LY-46,LY,ease(k));
    if(k>=1){intro.phase='touch';intro.t=0;touchdown();}
  }else if(ph==='touch'){
    if(k>=1){intro.phase='meet';intro.t=0;}
  }else if(ph==='meet'){
    /* 0-.18 开门出舱 / .18-.62 相向走 / .62-.80 伸手 / .80-1 握手 */
    intro.doorOpen=clamp(k/.18,0,1);
    var w=clamp((k-.18)/.44,0,1),we=ease(w);
    intro.walkPh=w*3.2;
    intro.mx=lerp(CX-52,CX-8,we);intro.bx=lerp(BASE_X,CX+8,we);
    intro.my=groundY(intro.mx);intro.by=groundY(intro.bx);
    var a=w>=1?clamp((k-.62)/.18,0,1):0;
    intro.marm=a;intro.barm=a;
    if(k>.80&&!intro.clasp){
      intro.clasp=true;
      tone('square',980,1480,.10,.10);tone('square',1320,1760,.10,.05,.05);
      for(var si=0;si<14;si++){var sa=rnd(0,TAU);
        parts.push({x:CX,y:LY-13,vx:Math.cos(sa)*rnd(16,52),vy:Math.sin(sa)*rnd(16,42)-10,
          age:0,life:rnd(.25,.5),s:1,c:Math.random()<.5?'#ffd54f':'#5fe0c8'});}
    }
    if(k>=1){intro.phase='panel';intro.t=0;}
  }else if(ph==='panel'){
    intro.panel=clamp(intro.t/INTRO.panel,0,1);
  }else if(ph==='leave'){
    /* 收投影 + 松手：面板/投影仪按进入时的状态淡出 */
    intro.panel=intro.panelFrom*(1-k);
    intro.marm=intro.armFrom*(1-k);intro.barm=intro.armFrom*(1-k);
    if(k>=1){intro.panel=0;intro.marm=0;intro.barm=0;intro.phase='walkback';intro.t=0;}
  }else if(ph==='walkback'){
    var wk=ease(k);
    intro.walkPh+=dt*2.8;                 /* 行走循环连续，不跳帧 */
    intro.mx=lerp(intro.mxFrom,CX-52,wk);intro.bx=lerp(intro.bxFrom,BASE_X,wk);
    intro.my=groundY(intro.mx);intro.by=groundY(intro.bx);
    if(k>=1){intro.phase='board';intro.t=0;}
  }else if(ph==='board'){
    /* 进舱 / 进门：门从当前开度关上，角色随之消失 */
    intro.doorOpen=intro.doorFrom*(1-k);
    intro.malpha=Math.max(0,1-k*1.4);intro.balpha=Math.max(0,1-k*1.4);
    if(k>=1){intro.malpha=0;intro.balpha=0;intro.phase='ascend';intro.t=0;liftoff();}
  }else if(ph==='ascend'){
    intro.flameK=ease(k);
    intro.ry=lerp(LY,LY-46,ease(k));
    if(k>=1){intro.phase='recall';intro.t=0;}
  }else if(ph==='recall'){
    var rk=ease(k);
    intro.camZ=lerp(intro.Z,1,rk);
    intro.camAX=lerp(CX,intro.W.x,rk);intro.camAY=lerp(LY,intro.W.y,rk);
    /* 火箭飞回被冻结的轨道点 */
    var ox=CX+Math.cos(intro.orbitA)*172,oy=SPOTY+Math.sin(intro.orbitA)*172*SQUASH;
    intro.rx=lerp(ROCKET_X,ox,rk);intro.ry=lerp(LY-46,oy+9,rk);
    intro.flameK=Math.max(0,1-rk);
    if(k>=1){intro.flameK=0;endReturn(false);}
  }
  intro.starK=lerp(intro.starK,intro.phase==='chase'?1.7:1,Math.min(1,dt*2.2));
}

/* ---------- 转场里的像素道具与角色（全部程序化绘制，无外部资源） ---------- */
var SUIT='#e6eef2',SUIT2='#bfced6',SUITD='#7d97a6';
function drawLander(cx,by,s,open,flame,t){
  var x=Math.round(cx),y=Math.round(by);
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  /* 发动机喷口 + 尾焰（flame 0..1，落地时收小） */
  ctx.fillStyle='#2a3548';ctx.fillRect(-2,-2,4,2);
  if(flame>.05){
    var fl=Math.round((5+Math.sin(t*26)*2)*flame);
    ctx.fillStyle='rgba(255,213,79,.5)';ctx.fillRect(-1,0,2,fl+3);
    ctx.fillStyle='#ffd54f';ctx.fillRect(-2,0,4,Math.max(1,fl-2));

  ctx.fillStyle='#7d8a96';
  ctx.fillRect(-6,-4,1,4);ctx.fillRect(5,-4,1,4);
  ctx.fillRect(-8,0,3,1);ctx.fillRect(5,0,3,1);

  ctx.fillStyle='#ff4757';
  ctx.fillRect(-7,-9,3,7);ctx.fillRect(4,-9,3,7);
  ctx.fillRect(-6,-10,2,1);ctx.fillRect(4,-10,2,1);
  /* 船体：8 宽 18 高（比巡航火箭高瘦，读得出是火箭） */
  ctx.fillStyle='#cfd8dc';ctx.fillRect(-4,-21,8,18);
  ctx.fillStyle='#ffffff';ctx.fillRect(1,-21,1,18);
  ctx.fillStyle='rgba(10,25,60,.28)';ctx.fillRect(-4,-21,1,18);
  /* 头锥 */
  ctx.fillStyle='#ff4757';
  ctx.fillRect(-3,-24,6,3);ctx.fillRect(-2,-26,4,2);
  ctx.fillStyle='#ffffff';ctx.fillRect(-1,-28,2,2);

  ctx.fillStyle='#0a1420';ctx.fillRect(-3,-17,6,6);
  ctx.fillStyle='#b9b7b4';ctx.fillRect(-2,-15,4,4);

}

function drawMouse(x,y,ph,dir,arm,t){

function drawRabbit(x,y,ph,dir,arm,t){

function drawProjector(x,y,t){

function drawIntroScene(t){
  var G=GAMES[intro.i],ph=intro.phase;
  /* 行星地表随相机接近才压上来：俯冲一开始不会凭空出现一条悬空地平线 */
  var ga=clamp((intro.camZ/intro.Z-.30)/.45,0,1);
  if(ga>.01){
    var hg=ctx.createLinearGradient(0,LY-56,0,LY+30);
    hg.addColorStop(0,'rgba(0,0,0,0)');
    hg.addColorStop(.55,hexA(G.g,.20));
    hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=ga;
    ctx.fillStyle=hg;ctx.fillRect(0,LY-56,W,88);
    ctx.fillStyle='rgba(3,4,14,.42)';ctx.fillRect(0,LY+2,W,H-LY-2);
    ctx.fillStyle=G.g;ctx.fillRect(0,LY,W,1);
    ctx.globalAlpha=1;
  }
  if(ph!=='chase')drawBase(BASE_X,LY,intro.doorOpen,t);
  /* 尾焰由状态机维护：降落收、起飞拉满 */
  drawLander(intro.rx,intro.ry,intro.scale,intro.doorOpen,intro.flameK,t);
  if(!RETURNING[ph]){
    if(ph==='meet'||ph==='panel'){
      drawRabbit(intro.bx,intro.by,intro.walkPh,intro.bdir,intro.barm,t);
      drawMouse(intro.mx,intro.my,intro.walkPh,intro.mdir,intro.marm,t);
      if(intro.clasp){
        var jy=(Math.sin(t*22)>0)?0:-1;      /* 握手抖动 */
        ctx.fillStyle='#ffd54f';ctx.fillRect(CX-3,LY-12+jy,6,3);
        ctx.fillStyle='#ffffff';ctx.fillRect(CX-1,LY-12+jy,2,1);
      }
      if(ph==='panel')drawProjector(CX+34,LY,t);
    }
  }else{
    /* 返回流程：角色按各自 alpha 淡出，投影仪跟着面板淡出 */
    if(ph!=='recall'){
      if(intro.balpha>.01){ctx.globalAlpha=intro.balpha;
        drawRabbit(intro.bx,intro.by,intro.walkPh,intro.bdir,intro.barm,t);}
      if(intro.malpha>.01){ctx.globalAlpha=intro.malpha;
        drawMouse(intro.mx,intro.my,intro.walkPh,intro.mdir,intro.marm,t);}
      ctx.globalAlpha=1;
      if(intro.panel>.02)drawProjector(CX+34,LY,t);
    }
  }
}
function drawIntroPanel(t){
  if(intro.panel<=.02){intro.enterR=intro.likeR=intro.panelR=null;return;}
  var G=GAMES[intro.i],a=ease(intro.panel);
  /* 投影仪光束（打在面板下沿） */
  var lx=CX+40,lyy=LY-20;
  ctx.globalAlpha=.10*a;ctx.fillStyle=G.g;
  ctx.beginPath();ctx.moveTo(lx,lyy);ctx.lineTo(PX+8,PY+PH);ctx.lineTo(PX+PW-8,PY+PH);ctx.closePath();ctx.fill();
  ctx.globalAlpha=.16*a;
  ctx.beginPath();ctx.moveTo(lx,lyy);ctx.lineTo(PX+56,PY+PH);ctx.lineTo(PX+PW-56,PY+PH);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;

/* ←→ / 滑动：切换选中浏览 */
function cycle(dir){
  var list=planets.filter(visible);
  if(list.length<2)return;
  var pos=list.indexOf(planets[cur]);
  if(pos<0)pos=0;
  var next=list[(pos+dir+list.length)%list.length];
  cur=next.i;
  next.pulse=1;
  try{localStorage.setItem('armory_index',String(cur));}catch(e){}
  tick();renderInfo();
}
function applyDev(){
  if(!visible(planets[cur]))cur=0;

/* 输入 */
function toGame(e){var r=cv.getBoundingClientRect();
  return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
cv.addEventListener('pointermove',function(e){var p=toGame(e);mouseX=p[0];mouseY=p[1];});
var sx0=null,sy0=null;
cv.addEventListener('pointerdown',function(e){
  audio();
  var m=toGame(e),mx=m[0],my=m[1];mouseX=mx;mouseY=my;sx0=mx;sy0=my;
  if(flash.active)return;
  if(intro.active){
    /* 面板阶段：进入 / 点赞 / 返回 / 面板内空白；面板外任意处 = 跳过进入 */
    if(intro.phase==='panel'&&intro.panel>=1){
      if(hitRect(intro.enterR,mx,my)){go();return;}
      if(hitRect(intro.likeR,mx,my)){addLike(GAMES[intro.i].key);return;}
      if(hitRect(intro.backR,mx,my)){launchReturn();return;}
      if(hitRect(intro.panelR,mx,my))return;
    }
    if(RETURNING[intro.phase]){endReturn(true);return;}   /* 返回途中点击 = 快进回家 */
    go();return;
  }
  if(Math.abs(mx-rocket._x)<16&&my>rocket._y-24&&my<rocket._y+12){
    var now=performance.now();
    if(now-rocket.last>1600)rocket.clicks=0;
    rocket.last=now;rocket.hop=1;
    if(++rocket.clicks>=5){rocket.clicks=0;boom();}
    return;}
  var best=-1,bd=1e9;
  for(var i=0;i<planets.length;i++){
    if(!visible(planets[i]))continue;
    var d2=(mx-planets[i].x)*(mx-planets[i].x)+(my-planets[i].y)*(my-planets[i].y);
    if(d2<bd){bd=d2;best=i;}}
  var hitR=IS_TOUCH?34:26;
  if(best>=0&&bd<=hitR*hitR)launchWarp(best);
});
cv.addEventListener('pointerup',function(e){
  if(sx0===null)return;
  var m=toGame(e),dx=m[0]-sx0,dy=m[1]-sy0;sx0=null;sy0=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)&&!intro.active&&!flash.active)cycle(dx<0?1:-1);
});
addEventListener('keydown',function(e){
  audio();
  if(intro.active){
    if(e.key==='Enter'||e.key===' ')go();                 /* 面板=进入，其他=跳过 */
    else if(e.key==='Escape'||e.key==='Backspace'){
      if(RETURNING[intro.phase])endReturn(true);
      else launchReturn();
    }
    return;}
  if(e.key==='ArrowLeft')cycle(-1);
  else if(e.key==='ArrowRight')cycle(1);
  else if(e.key==='Enter')launchWarp(cur);
  else if(e.key==='r'||e.key==='R'||e.key==='d'||e.key==='D'){devMode=!devMode;applyDev();}
});
function boom(){rocket.salute=2.4;shakeT=REDUCED?0:.6;whitePop=REDUCED?0:.12;tone('sine',180,40,.45,.35);
  for(var i=0;i<80;i++){var a=rnd(0,TAU),sp=rnd(18,90);
    parts.push({x:rocket._x,y:rocket._y-8,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-12,
      age:0,life:rnd(.5,1.2),s:Math.random()<.5?1:2,
      c:['#ffffff','#00e5ff','#ffd54f','#ff5c8a','#69f0ae'][Math.random()*5|0]});}}

function update(dt,t){
  gdt=dt;
  if(intro.active||REDUCED){mox=0;moy=0;}
  else{
    mox+=(clamp((mouseX-CX)*.05,-9,9)-mox)*Math.min(1,dt*6);
    moy+=(clamp((mouseY-SY)*.04,-7,7)-moy)*Math.min(1,dt*6);
  }
  rocket.hop=Math.max(0,rocket.hop-dt*2.4);
  if(!intro.active){
    /* 行星公转（转场时冻结，保证着陆点稳定） */
    for(var i=0;i<planets.length;i++){var p=planets[i];
      p.a+=p.sp*gdt;
      p.x=CX+Math.cos(p.a)*ORBR[p.orbit];
      p.y=SPOTY+Math.sin(p.a)*ORBR[p.orbit]*SQUASH;
      p.pulse=Math.max(0,p.pulse-dt*2.5);}
    /* 行星重叠检测：与任意其他可见行星相交 → 前景改半透明，不再硬盖 */
    for(var oi=0;oi<planets.length;oi++){var po=planets[oi];
      var ov=false;
      if(visible(po)){
        for(var oj=0;oj<planets.length;oj++){
          if(oi===oj)continue;
          var pq=planets[oj];
          if(!visible(pq))continue;
          var ddx=po.x-pq.x,ddy=po.y-pq.y,rr=(po.r+pq.r)*.94;
          if(ddx*ddx+ddy*ddy<rr*rr){ov=true;break;}}
      }
      po.ov=ov?.72:1;}
    relaxLabels(dt);
    /* 火箭：外圈轨道巡航，永远在飞 */
    rocket.a+=.2*gdt*(REDUCED?.3:1);
    rocket.x=CX+Math.cos(rocket.a)*172;
    rocket.y=SPOTY+Math.sin(rocket.a)*172*SQUASH;
  }else{
    introUpdate(dt);
  }
  if(flash.active){flash.t-=dt;
    if(flash.t<=0){flash.active=false;
      if(intro.i>=0){location.href=GAMES[intro.i].href;return;}}}
  infoFade=lerp(infoFade,intro.active?0:1,Math.min(1,dt*9));
  for(var lk in likePop)if(likePop[lk]>0)likePop[lk]=Math.max(0,likePop[lk]-dt*2);
  /* 尾焰（转场里由降落器自己画） */
  if(!intro.active){
    flameAcc+=dt*26*1.6;
    while(flameAcc>=1){flameAcc--;
      if(parts.length<420)parts.push({x:rocket.x+rnd(-2,2),y:rocket.y+9,
        vx:rnd(-6,6),vy:rnd(26,46),age:0,life:rnd(.2,.45),
        s:Math.random()<.35?2:1,
        c:Math.random()<.45?'#ffd54f':(Math.random()<.6?'#ffffff':'#ff4757')});}
  }
  for(var pi=parts.length-1;pi>=0;pi--){var q=parts[pi];
    q.age+=dt;if(q.age>=q.life){parts.splice(pi,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-1.4*dt;q.vy*=1-1.4*dt;}
  rocket.salute=Math.max(0,rocket.salute-dt);
  shakeT=Math.max(0,shakeT-dt);whitePop=Math.max(0,whitePop-dt);
}

/* ---------- 名字避让：标签沿 y 互相推开 + 避开别的行星盘，缓动跟随 ----------
   行星本体叠有 ghostOverlap 兑底，真正会互相压住的是常显名字：
   每帧把重叠的标签对沿 y 推开，推完限幅（不撞信息条 / 不远离子行星），再缓动落地。 */
var LBH=11;
function labelW(s,fs){var w=0;for(var i=0;i<s.length;i++)w+=(s.charCodeAt(i)>255?fs:fs*.55);return w;}
function relaxLabels(dt){
  var vis=[],i,j,it;
  for(i=0;i<planets.length;i++){var p=planets[i];
    if(!visible(p))continue;
    var base=p.y+p.r+11;
    if(p.lx===undefined){p.lx=p.x;p.ly=base;}
    vis.push({p:p,w:labelW(p.g.t,FS_LABEL),x:p.lx,y:p.ly,bx:p.x,by:base,tx:p.lx,ty:p.ly});}
  var n=vis.length;
  if(n>1){
    /* 双轴松弛，目标空间内迭代：哪根轴重叠量小就沿哪根推，推完立即生效 */
    for(it=0;it<4;it++){
      for(i=0;i<n;i++)for(j=i+1;j<n;j++){
        var A=vis[i],B=vis[j];
        var ox=(A.w+B.w)/2+4-Math.abs(A.x-B.x);   /* x 重叠量 */
        var oy=LBH-Math.abs(A.y-B.y);             /* y 重叠量 */
        if(ox<=0||oy<=0)continue;
        var sx=0,sy=0;
        if(ox<=oy){sx=(ox+1)/2;}else{sy=(oy+1)/2;}
        if(A.x<=B.x){A.tx-=sx;B.tx+=sx;A.x-=sx;B.x+=sx;}
        else{A.tx+=sx;B.tx-=sx;A.x+=sx;B.x-=sx;}
        if(sy){
          if(A.y<=B.y){A.ty-=sy;B.ty+=sy;A.y-=sy;B.y+=sy;}
          else{A.ty+=sy;B.ty-=sy;A.y+=sy;B.y-=sy;}}
      }
      /* 名字别压在别的行星盘上：沿远离圆心的方向径向推（加强反而连锁撞别的约束，9 是实测最优） */
      for(i=0;i<n;i++){var L=vis[i];
        for(j=0;j<planets.length;j++){var q=planets[j];
          if(q===L.p||!visible(q))continue;
          var dx=L.x-q.x,dy=L.y-q.y,rr=q.r+9;
          if(dx*dx+dy*dy>=rr*rr)continue;
          var d=Math.sqrt(dx*dx+dy*dy)||1,need=rr-d;
          L.tx+=dx/d*need;L.x+=dx/d*need;
          L.ty+=dy/d*need;L.y+=dy/d*need;
        }
      }
    }
  }
  for(i=0;i<n;i++){var L2=vis[i];
    var tx=clamp(L2.tx,L2.bx-40,L2.bx+40);   /* 不离自己的行星太远 */
    var ty=clamp(L2.ty,28,198);              /* 不出画布、不压底部信息条 */
    ty=clamp(ty,L2.by-30,L2.by+22);
    L2.p.lx=lerp(L2.p.lx,tx,Math.min(1,dt*7));
    L2.p.ly=lerp(L2.p.ly,ty,Math.min(1,dt*7));
  }
}
function drawPlanet(p,t){
  var G=p.g;
  var sel=p.i===cur;
  var z=intro.active?intro.camZ:1;
  var isT=intro.active&&intro.i===p.i;
  /* 转场时非目标行星快速淡出（否则放大后会变成大白块） */
  var fade=intro.active?(isT?1:clamp((2.6-z)/1.5,0,1)):1;
  if(fade<=.01)return;
  /* 重叠不再整颗降透明，交给 ghostOverlap 做局部幽灵重绘 */
  var ov=1;
  var r=p.r*(1+.1*p.pulse);
  var x=p.x|0,y=p.y|0;
  var breath=.5+.5*Math.sin(t*2.2+p.i);
  var glow=intro.active?clamp((3.2-z)/2.2,0,1):1;
  /* 大气辉光 */
  if(glow>.02){
    var L=[[2,.13],[5,.07],[9,.04]];
    for(var li=0;li<L.length;li++){
      ctx.globalAlpha=L[li][1]*(.75+.45*breath)*(sel?1.5:1)*fade*ov*glow;
      ctx.strokeStyle=G.g;ctx.lineWidth=2*worldLW;
      ctx.beginPath();ctx.arc(x,y,r+L[li][0],0,TAU);ctx.stroke();}
  }
  /* 球体 */
  ctx.globalAlpha=fade*ov;
  var g=ctx.createRadialGradient(x-r*.38,y-r*.42,r*.1,x,y,r*1.02);
  g.addColorStop(0,shade(G.c,.5));
  g.addColorStop(.52,G.c);
  g.addColorStop(1,shade(G.c,-.55));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.38)';
  ctx.beginPath();ctx.ellipse(x-r*.42,y-r*.45,r*.16,r*.1,-.6,0,TAU);ctx.fill();
  var shA=.55*(intro.active?clamp((4-z)/3,0,1):1);
  if(shA>.02){
    var sh2=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.3,x,y,r*1.25);
    sh2.addColorStop(0,'rgba(0,0,12,0)');sh2.addColorStop(1,'rgba(0,0,12,'+shA+')');
    ctx.fillStyle=sh2;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  }
  if(G.ring&&!intro.active){
    var rx=r*1.5,ry=r*.42,tl=-.22;
    ctx.lineWidth=2*worldLW;
    ctx.strokeStyle=hexA(G.g,.5*fade*ov);
    ctx.beginPath();ctx.ellipse(x,y,rx,ry,tl,Math.PI,TAU);ctx.stroke();
    ctx.beginPath();ctx.ellipse(x,y,rx,ry,tl,0,Math.PI);ctx.stroke();}
  /* 常显名字（转场放大时不画；位置经双轴避让，挪远时补一条引线） */
  if(r>6&&!intro.active){
    var lx=(p.lx!==undefined)?p.lx:x;
    var lyy=(p.ly!==undefined)?p.ly:(y+p.r+8);
    var ddx=lx-x,ddy=lyy-y;
    if(ddx*ddx+ddy*ddy>100){
      var dl=Math.sqrt(ddx*ddx+ddy*ddy),ux=ddx/dl,uy=ddy/dl;
      ctx.globalAlpha=.30*fade*ov;
      ctx.strokeStyle='#9fd4ef';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x+ux*(r+2),y+uy*(r+2));ctx.lineTo(lx,lyy-3);ctx.stroke();
    }
    ctx.globalAlpha=.9*fade*ov;
    ctx.font=FBL;
    ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,10,.8)';ctx.fillText(G.t,lx+1,lyy+1);
    ctx.fillStyle=sel?'#ffffff':'#cfeaff';ctx.fillText(G.t,lx,lyy);
    ctx.textAlign='left';}
  ctx.globalAlpha=1;
}
/* 行星重叠：把被前景盖住的那颗，在前景圆内以半透明重绘一遍
   （比“整颗降透明度”精准：只有被遮挡的那一片变半透明） */
function ghostOverlap(back,front){
  var dx=back.x-front.x,dy=back.y-front.y,rr=(back.r+front.r)*.94;
  if(dx*dx+dy*dy>=rr*rr)return;
  var G=back.g;
  ctx.save();
  ctx.beginPath();ctx.arc(front.x,front.y,front.r,0,TAU);ctx.clip();
  ctx.globalAlpha=.34;
  var g=ctx.createRadialGradient(back.x-back.r*.38,back.y-back.r*.42,back.r*.1,back.x,back.y,back.r*1.02);
  g.addColorStop(0,shade(G.c,.5));
  g.addColorStop(.52,G.c);
  g.addColorStop(1,shade(G.c,-.55));
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(back.x,back.y,back.r,0,TAU);ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
}
function drawRocket(t){
  var bob=REDUCED?0:Math.sin(t*2.1)*1.6;
  var hopY=rocket.hop>0?-Math.sin((1-rocket.hop)*Math.PI)*3.2:0;
  var x=rocket.x|0,y=(rocket.y+bob+hopY)|0;
  rocket._x=x;rocket._y=y;
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(207,216,220,.85)';ctx.lineWidth=1;
  var tw=Math.sin(t*3.2)*2;
  ctx.beginPath();ctx.moveTo(x+6,y-1);ctx.quadraticCurveTo(x+13+tw,y+3,x+11+tw*.6,y+9);ctx.stroke();
  var fl=6+Math.sin(t*31)*1.5;
  ctx.fillStyle='#ffd54f';ctx.fillRect(x-2,y+6,4,3);
  ctx.fillStyle='rgba(255,213,79,.55)';ctx.fillRect(x-1,y+9,2,fl|0);
  ctx.fillStyle='#ffffff';ctx.fillRect(x-1,y+6,2,2);
  ctx.fillStyle='#ff4757';ctx.fillRect(x-8,y-3,3,9);ctx.fillRect(x+5,y-3,3,9);
  ctx.fillStyle='#cfd8dc';ctx.fillRect(x-5,y-14,10,18);
  ctx.fillStyle='#ffffff';ctx.fillRect(x+1,y-14,2,18);
  ctx.fillStyle='rgba(10,25,60,.25)';ctx.fillRect(x-5,y-14,2,18);
  ctx.fillStyle='#ff4757';
  ctx.fillRect(x-1,y-18,2,2);ctx.fillRect(x-3,y-16,6,2);ctx.fillRect(x-5,y-14,10,2);
  ctx.fillRect(x-5,y+1,10,2);
  ctx.fillStyle='rgba(10,25,60,.55)';ctx.fillRect(x-3,y+4,6,3);
  var look=Math.sin(t*.55)*.9;
  var blink=(t%3.4)<.14;
  var wx=x+look,wy=y-7;
  ctx.fillStyle='#08122e';ctx.beginPath();ctx.arc(wx,wy,4.5,0,TAU);ctx.fill();
  ctx.fillStyle='#cfd8dc';ctx.beginPath();ctx.arc(wx,wy+1.2,2.6,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(wx-1.7,wy-1,1.2,0,TAU);ctx.arc(wx+1.7,wy-1,1.2,0,TAU);ctx.fill();
  ctx.fillStyle='#ff9ec4';
  ctx.beginPath();ctx.arc(wx-1.7,wy-1,.6,0,TAU);ctx.arc(wx+1.7,wy-1,.6,0,TAU);ctx.fill();
  ctx.fillStyle='#08122e';
  if(blink)ctx.fillRect((wx-1.5)|0,(wy+.7)|0,3,1);
  else{ctx.fillRect((wx-1.5)|0,(wy+.6)|0,1,1);ctx.fillRect((wx+.6)|0,(wy+.6)|0,1,1);}
  ctx.strokeStyle='#00e5ff';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(wx,wy,4.5,0,TAU);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(wx-3,wy-3,1,1);
  if(rocket.salute>0){ctx.fillStyle='#cfd8dc';ctx.fillRect(x+5,y-16,2,7);
    ctx.fillStyle='#ffffff';ctx.fillRect(x+5,y-18,2,2);
    var tw2=Math.sin(t*12)*.5+.5;
    ctx.globalAlpha=.35+.65*tw2;ctx.fillStyle='#ffd54f';
    ctx.fillRect(x-5,y-26,1,1);ctx.fillRect(x+5,y-24,1,1);}
  ctx.globalAlpha=1;
}
function drawParts(){
  for(var i=0;i<parts.length;i++){var q=parts[i];var a=1-q.age/q.life;
    ctx.globalAlpha=a;ctx.fillStyle=q.c;
    var s=Math.max(1,(q.s*(0.6+a*0.4))|0);
    ctx.fillRect(q.x|0,q.y|0,s,s);}
  ctx.globalAlpha=1;
}
function render(t){
  ctx.setTransform(1,0,0,1,0,0);
  var shX=0,shY=0;
  if(shakeT>0){shX=rnd(-3,3)*shakeT*2;shY=rnd(-3,3)*shakeT*2;}
  worldLW=intro.active?1/intro.camZ:1;   /* 世界层的线宽换算成屏幕 1px */
  ctx.setTransform(1,0,0,1,shX,shY);
  ctx.fillStyle=bgGrad;ctx.fillRect(-8,-8,W+16,H+16);
  for(var i=0;i<nebula.length;i++){ctx.fillStyle=nebula[i];ctx.fillRect(0,0,W,H);}
  ctx.save();ctx.translate(CX,SY);ctx.rotate(-.28);
  var mg=ctx.createRadialGradient(0,0,10,0,0,240);
  mg.addColorStop(0,'rgba(140,170,255,.05)');mg.addColorStop(1,'rgba(140,170,255,0)');
  ctx.fillStyle=mg;ctx.fillRect(-260,-52,520,104);ctx.restore();
  drawStars(t);
  for(var b2=0;b2<band.length;b2++){var bn=band[b2];
    ctx.globalAlpha=bn.a*(REDUCED?.8:(.7+.3*Math.sin(t*.8+b2)));
    ctx.fillStyle='#cfd8ff';ctx.fillRect((bn.x+mox*.15)|0,(bn.y+moy*.1)|0,1,1);}
  ctx.globalAlpha=1;
  for(var b3=0;b3<brights.length;b3++){var br=brights[b3];
    var tw3=REDUCED?.6:(.5+.5*Math.sin(t*1.6+br.ph));
    var bx=(br.x+mox*.2)|0,by=(br.y+moy*.15)|0;
    ctx.globalAlpha=.5+.4*tw3;ctx.fillStyle='#ffffff';
    ctx.fillRect(bx-1,by-1,2,2);
    ctx.globalAlpha=.3*tw3;
    ctx.fillRect(bx-4,by,3,1);ctx.fillRect(bx+2,by,3,1);
    ctx.fillRect(bx,by-4,1,3);ctx.fillRect(bx,by+2,1,3);}
  ctx.globalAlpha=1;
  /* ---- 世界层（转场时相机俯冲进目标行星） ---- */
  ctx.save();
  camApply(shX,shY);
  drawOrbits();
  /* 伪 3D 排序：远（y 小）先画，恒星夹在中间层 */
  var order=planets.filter(visible).slice().sort(function(a,b){return a.y-b.y;});
  if(intro.active){var ti=order.indexOf(planets[intro.i]);
    if(ti>=0){order.splice(ti,1);order.push(planets[intro.i]);}}
  var starDrawn=false,drawn=[];
  for(var oi=0;oi<order.length;oi++){
    if(!starDrawn&&order[oi].y>=SY){drawStarCore(t);starDrawn=true;}
    var pp=order[oi];
    drawPlanet(pp,t);
    /* 被这颗盖住的前几颗，在交叠区里半透明重绘回来 */
    if(!intro.active&&pp.ov<1){
      for(var dj=0;dj<drawn.length;dj++)ghostOverlap(drawn[dj],pp);
    }
    drawn.push(pp);
  }
  if(!starDrawn)drawStarCore(t);
  ctx.restore();
  ctx.setTransform(1,0,0,1,shX,shY);
  /* ---- 前景 ---- */
  if(intro.active){
    drawIntroScene(t);
    drawParts();
    drawIntroPanel(t);
  }else{
    drawRocket(t);
    drawParts();
  }
  /* 选中项信息条（画进 canvas，底部不再有 DOM 面板） */
  drawInfoBlock();
  /* ---- 后处理 ---- */
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
  if(whitePop>0){ctx.fillStyle='rgba(255,255,255,'+(whitePop/.12*.5)+')';ctx.fillRect(0,0,W,H);}
  if(flash.active){var fa=1-clamp(flash.t/flash.dur,0,1);   /* 渐黑收场 */
    ctx.fillStyle='rgba(2,3,10,'+fa.toFixed(3)+')';ctx.fillRect(0,0,W,H);}
}
renderInfo();
applyDev();
$('hint').textContent=IS_TOUCH?'点行星降落 → 兔子介绍 · 面板内可返回 · 左右滑动浏览 · NDSHUGE © 2026'
  :'点行星降落 → 兔子介绍 · 面板内可返回 · ← → 浏览 · R/D 开发者模式 · NDSHUGE © 2026';

var last=performance.now();
function frame(now){
  var dt=clamp((now-last)/1000,0,.05);last=now;
  update(dt,now/1000);render(now/1000);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
