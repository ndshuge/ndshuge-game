<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050514">
<title>鼠哥军械库 · NDSHUGE ARMORY</title>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/570/main/result.css" />
<style>
:root{--bg:#050514;--cyan:#00e5ff;--yellow:#ffd54f;--ink:#eafcff;--dim:rgba(150,215,255,.55)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace;
     color:#bfefff;user-select:none;-webkit-user-select:none}
#space{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
       image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}
#crt{position:fixed;inset:0;z-index:6;pointer-events:none;
     background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
#brand{position:fixed;top:12px;left:16px;z-index:5;font-size:12px;letter-spacing:1px;color:var(--dim);pointer-events:none}
#brand b{color:var(--yellow);font-weight:normal}
#sysbar{position:fixed;top:12px;right:16px;z-index:5;display:flex;gap:10px;align-items:center}
.gh{font-size:12px;letter-spacing:1px;color:var(--cyan);text-decoration:none;
  border:1px solid rgba(0,229,255,.4);padding:5px 10px;background:rgba(4,8,24,.7)}
.gh:active{background:rgba(0,229,255,.16)}
/* 像素信息卡 */
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:5;width:min(400px,90vw);pointer-events:none;
  background:rgba(4,8,24,.9);border:1px solid rgba(0,229,255,.4);
  box-shadow:inset 0 0 0 1px rgba(0,229,255,.1),0 0 24px rgba(0,229,255,.16);
  padding:10px 14px 12px;text-align:center}
#card::before,#card::after{content:'';position:absolute;width:6px;height:6px;background:var(--cyan)}
#card::before{left:-3px;top:-3px}
#card::after{right:-3px;top:-3px}
#card .no{font-size:12px;letter-spacing:2px;color:var(--dim)}
#card .no b{color:var(--yellow);font-weight:normal}
#card .devtag{display:inline-block;font-size:12px;color:#9fb4d6;border:1px solid rgba(159,180,214,.5);padding:0 5px;margin-left:6px}
#card h1{font-size:24px;letter-spacing:3px;color:var(--ink);font-weight:normal;margin-top:6px;
  text-shadow:0 0 8px rgba(0,229,255,.8),0 0 24px rgba(0,229,255,.35)}
#card .tag{font-size:12px;letter-spacing:2px;color:var(--cyan);margin-top:4px}
#card .desc{font-size:12px;line-height:1.8;color:#9fd4ef;margin-top:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btnrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;pointer-events:auto}
.enter{display:inline-block;font-family:inherit;font-size:14px;letter-spacing:4px;
  color:#03121e;background:var(--cyan);border:none;padding:12px 26px;cursor:pointer;
  text-decoration:none;box-shadow:0 4px 0 #008ba3;min-height:44px;line-height:1.2}
.enter:active{transform:translateY(4px);box-shadow:0 0 0 #008ba3}
.like{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12px;letter-spacing:1px;
  color:#ff8ba0;background:rgba(255,110,140,.06);border:1px solid rgba(255,110,140,.4);
  padding:11px 13px;cursor:pointer;min-height:44px;box-sizing:border-box;
  box-shadow:0 4px 0 rgba(120,30,50,.55)}
.like:active{transform:translateY(4px);box-shadow:0 0 0 rgba(120,30,50,.55)}
.like.on{color:#ff5c7a;border-color:#ff5c7a;background:rgba(255,92,122,.12)}
.like.pop{animation:likepop .45s ease-out}
@keyframes likepop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
#devslot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4px + env(safe-area-inset-bottom,0px));
  z-index:5;width:min(400px,90vw)}
#devToggle{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;font-size:12px;letter-spacing:1px;color:rgba(120,190,230,.5);
  background:transparent;border:1px dashed rgba(0,229,255,.25);
  padding:6px 8px;cursor:pointer;min-height:30px}
#devToggle.open{color:var(--cyan);border-style:solid;background:rgba(0,229,255,.07)}
#hint{position:fixed;top:44px;left:0;right:0;z-index:5;
  font-size:12px;letter-spacing:1px;color:rgba(120,190,230,.4);text-align:center;pointer-events:none}
.swap{animation:swap .28s ease-out}
@keyframes swap{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
body.warping #info,body.warping #brand,body.warping #sysbar,body.warping #devslot,body.warping #hint{opacity:0}
#info,#brand,#sysbar,#devslot,#hint{transition:opacity .3s}
@media (max-width:640px){
  #card h1{font-size:20px}
}
@media (orientation:portrait){
  body{background:linear-gradient(#070a1e,#03040e)}
  #space{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);
         mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent)}
}
@media (prefers-reduced-motion:reduce){.swap{animation:none}}
</style>
</head>
<body>
<canvas id="space" width="480" height="270"></canvas>
<div id="crt"></div>
<div id="brand">◆ NDSHUGE <b>鼠哥游戏厅</b> · ARMORY</div>
<div id="sysbar"><a class="gh" href="https://github.com/ndshuge/ndshuge-game" target="_blank" rel="noopener">GITHUB</a></div>
<div id="hint">点行星直接跃迁进入游戏 · ← → 或滑动浏览 · NDSHUGE © 2026</div>
<div id="card">
  <div class="no"><b id="gNo">No.01</b><span class="devtag" id="gDev" style="display:none">待开发</span></div>
  <h1 id="gTitle">西线前线</h1>
  <div class="tag" id="gTag">FPS · 战役</div>
  <div class="desc" id="gDesc"></div>
  <div class="btnrow">
    <button class="like" id="likeBtn" aria-label="点赞">&#9829;<span id="likeN">&middot;</span></button>
    <a class="enter" id="gEnter" href="./games/ww2-frontline/">进入游戏</a>
  </div>
</div>
<div id="devslot">
  <button id="devToggle">&middot; 不成熟待开发区 &middot; 4 件 &middot; 接受拍砖 &middot;</button>
</div>
<script>
'use strict';
/* 游戏星系：中心恒星=鼠哥游戏厅，游戏=绕轨道行星（常显名字）。
   点任意行星直接跃迁进入该游戏；←→/滑动切换选中浏览。 */
var GAMES=[
  {no:'No.01',t:'西线前线',tag:'FPS · 战役',d:'沉浸式二战射击。COD 风格 HUD，指挥官无线电实时喊话，突击东进，德语嘶吼就在耳边。',href:'./games/ww2-frontline/',key:'ww2-frontline',c:'#8a5a34',g:'#e0b070'},
  {no:'No.02',t:'凝时 STILL',tag:'弹幕 · 时停',d:'时间只在你移动时流动。牵引光点穿过凝滞的弹幕海，逃向出口。',href:'./games/still/',key:'still',c:'#4a6a6e',g:'#a8e3ff',ring:true},
  {no:'No.03',t:'重力花园',tag:'物理 · 解压',d:'暮色花园里撒下刚体，看它们真实坠落碰撞堆叠。右键引爆，空格翻转重力。',href:'./games/gravity-garden/',key:'gravity-garden',c:'#6a8a3a',g:'#d9e08a'},
  {no:'No.04',t:'墨途',tag:'水墨 · 平台',d:'走过的路留下墨迹，墨迹即桥。墨会蒸发、被啃食、被风吹散，通关时你的轨迹装裱成笔意。',href:'./games/motu/',key:'motu',c:'#3a3f4a',g:'#c9d2e8'},
  {no:'No.05',t:'回声小径',tag:'像素 · 回声',d:'「与昨日的自己同行」。像素风平台跳跃，按下 R 录下你的回声，在遗迹间穿行。',href:'./games/echo-trail/',key:'echo-trail',c:'#2a7c6e',g:'#8fe8d0'},
  {no:'No.06',t:'鼓点乒乓',tag:'音游 · 街机',d:'球的往返时间就是节拍，卡拍回击即在演奏鼓机。打得越好，这首曲子越完整。',href:'./games/beat-paddle/',key:'beat-paddle',c:'#6a3d8c',g:'#d9b0ff'},
  {no:'No.07',t:'慢光 LIGHTLAG',tag:'太空 · 防御',dev:true,d:'光速有限，你看到的敌人是它几秒前的幻影。靠火控预测环解算提前量，守好深空信标。',href:'./games/lightlag/',key:'lightlag',c:'#46506b',g:'#9fb4d6',ring:true},
  {no:'No.08',t:'VOCALON! 节拍革命',tag:'音游 · 原曲',dev:true,d:'术力口原曲音游。音符从核心飞向四环，DFJK 径向打击，空格开启子弹时间，OVERDRIVE 时缓爆发。',href:'./games/vocalon-chaos/',key:'vocalon-chaos',c:'#6e4a5c',g:'#d0a8b8'},
  {no:'No.09',t:'像素乒乓 CAT vs RAT',tag:'街机 · 对决',dev:true,d:'猫鼠乒乓对决。鼠标移拍、按住蓄力、W/S 加旋转，老鼠的球带重力弧线，七分定胜负。',href:'./games/pixel-pong/',key:'pixel-pong',c:'#465a78',g:'#a4b8d6'},
  {no:'No.10',t:'回带 REWINDER',tag:'像素 · 时间',dev:true,d:'按住 R 让世界倒退。你用倒带抢救自己，它用倒带改写关卡——它记得你退过多少次。',href:'./games/rewinder/',key:'rewinder',c:'#3a4158',g:'#ccab8a',ring:true}
];
var MAIN=6;
var REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
var IS_TOUCH=matchMedia('(pointer:coarse)').matches;
var W=480,H=270,CX=W/2,SY=104,TAU=Math.PI*2;
var cv=document.getElementById('space'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,k){return a+(b-a)*k;}
function shade(hex,f){var n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  if(f>=0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}else{r*=1+f;g*=1+f;b*=1+f}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function hexA(hex,a){var n=parseInt(hex.slice(1),16);
  return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function fit(){
  var portrait=innerHeight>innerWidth;
  var s=portrait?Math.min(innerWidth/W,innerHeight/H):Math.max(innerWidth/W,innerHeight/H);
  cv.style.width=Math.ceil(W*s)+'px';cv.style.height=Math.ceil(H*s)+'px';}
addEventListener('resize',fit);fit();

/* 行星轨道分配：三圈椭圆，内快外慢，初始相位按圈内序号均匀铺开 */
var ORBR=[64,98,132],ORBP=[.11,.075,.05],SPOTY=SY-2;
var planets=GAMES.map(function(g,i){return{g:g,i:i,orbit:i%3,a:0,sp:0,x:CX,y:SPOTY,r:12,pulse:0};});
(function(){
  for(var o=0;o<3;o++){
    var m=planets.filter(function(p){return p.orbit===o;});
    m.forEach(function(p,j){p.a=j/m.length*TAU+o*.9;});
  }
  planets.forEach(function(p){p.sp=ORBP[p.orbit]*(p.i%2?1:-1)*(REDUCED?.35:1);});
})();
var devMode=false;
try{devMode=localStorage.getItem('ng-dev-open')==='1';}catch(e){}
function visible(p){return devMode||!p.g.dev;}
var cur=0;
try{cur=clamp(parseInt(localStorage.getItem('armory_index')||'0',10)||0,0,GAMES.length-1);}catch(e){}
if(!visible(planets[cur]))cur=0;

var rocket={a:Math.PI*.25,x:CX,y:SPOTY,salute:0,clicks:0,last:0,hop:0,_x:CX,_y:SPOTY};
var warp={active:false,i:-1,t:0,k:0};
var flash={active:false,t:0};
var parts=[],wstars=[];
for(var wi=0;wi<42;wi++)wstars.push({a:rnd(0,TAU),d:rnd(4,300),sp:rnd(260,620),px:-999,py:-999});
var gdt=1/60,mouseX=CX,mouseY=CY,mox=0,moy=0,shakeT=0,whitePop=0,flameAcc=0;

var bgGrad=ctx.createLinearGradient(0,0,0,H);
bgGrad.addColorStop(0,'#070a1e');bgGrad.addColorStop(1,'#03040e');
var nebula=[[110,85,150,'rgba(0,110,150,.10)'],[360,180,130,'rgba(96,44,150,.10)'],[300,55,90,'rgba(130,100,30,.06)']]
  .map(function(q){var g=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],q[2]);
    g.addColorStop(0,q[3]);g.addColorStop(1,'rgba(0,0,0,0)');return g;});
var vign=ctx.createRadialGradient(CX,SY,90,CX,SY,310);
vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(0,0,14,.5)');
var stars=[];
for(var si=0;si<110;si++)stars.push({a:rnd(0,TAU),d:rnd(2,300),tw:rnd(.8,2.6),ph:rnd(0,TAU),
  par:rnd(.3,1),s:Math.random()<.85?1:2,
  c:Math.random()<.68?'#ffffff':(Math.random()<.5?'#00e5ff':'#ffd54f')});
var band=[];
for(var bi=0;bi<70;bi++){
  var u=rnd(-20,W+20),v=SY+Math.sin(-.28)*(u-CX)+rnd(-34,34);
  band.push({x:u,y:v,a:rnd(.12,.4)});}
var brights=[];
for(var ti=0;ti<6;ti++)brights.push({x:rnd(20,W-20),y:rnd(24,60),ph:rnd(0,TAU)});

/* 音效 */
var actx=null,master=null;
function audio(){if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=1;master.connect(actx.destination);}catch(e){}}
function tone(type,f0,f1,dur,peak,delay){if(!actx)return;
  var t=actx.currentTime+(delay||0);
  var o=actx.createOscillator(),g=actx.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function tick(){tone('square',700,980,.06,.08);}
function whoosh(){tone('sawtooth',180,520,.4,.1);tone('square',90,260,.4,.06);}

/* 信息卡 / 点赞 */
function $(id){return document.getElementById(id);}
var infoEl=$('card');
var NS='ndshuge-game',API='https://abacus.jasoncameron.dev';
function likedKey(k){return 'ng-like-'+k;}
function renderCount(el,v){el.textContent=v>=1000?(v/1000).toFixed(1).replace(/\.0$/,'')+'k':String(v);}
function bindLike(key){
  var n=$('likeN'),on=false;
  try{on=localStorage.getItem(likedKey(key))==='1';}catch(e){}
  $('likeBtn').classList.toggle('on',on);
  n.textContent='\u00b7';
  try{fetch(API+'/get/'+NS+'/'+key).then(function(r){return r.json();}).then(function(j){
    if(j&&typeof j.value==='number')renderCount(n,j.value);}).catch(function(){});}catch(e){}
}
$('likeBtn').addEventListener('click',function(){
  var key=GAMES[cur].key,was=false;
  try{was=localStorage.getItem(likedKey(key))==='1';}catch(e){}
  if(was)return;
  try{localStorage.setItem(likedKey(key),'1');}catch(e){}
  var btn=$('likeBtn');btn.classList.add('on','pop');
  setTimeout(function(){btn.classList.remove('pop');},500);
  var n=$('likeN'),c2=parseInt(n.textContent,10);if(isNaN(c2))c2=0;
  renderCount(n,c2+1);
  try{fetch(API+'/hit/'+NS+'/'+key).then(function(r){return r.json();}).then(function(j){
    if(j&&typeof j.value==='number')renderCount(n,j.value);}).catch(function(){});}catch(e){}
});
function renderInfo(){
  var G=GAMES[cur];
  $('gNo').textContent=G.no;
  $('gDev').style.display=G.dev?'inline-block':'none';
  $('gTitle').textContent=G.t;
  $('gTag').textContent=G.tag;
  $('gDesc').textContent=G.d;
  $('gEnter').href=G.href;
  bindLike(G.key);
  infoEl.classList.remove('swap');void infoEl.offsetWidth;infoEl.classList.add('swap');
}
/* 点行星：直接跃迁进入游戏 */
function launchWarp(i){
  if(warp.active)return;
  cur=i;
  try{localStorage.setItem('armory_index',String(i));}catch(e){}
  renderInfo();
  if(REDUCED){location.href=GAMES[i].href;return;}
  warp.active=true;warp.i=i;warp.t=0;warp.k=0;
  document.body.classList.add('warping');
  tone('sawtooth',110,880,1.0,.14);tone('square',55,440,1.0,.08);
}
/* ←→ / 滑动：切换选中浏览 */
function cycle(dir){
  var list=planets.filter(visible);
  if(list.length<2)return;
  var pos=list.indexOf(planets[cur]);
  if(pos<0)pos=0;
  var next=list[(pos+dir+list.length)%list.length];
  cur=next.i;
  next.pulse=1;
  try{localStorage.setItem('armory_index',String(cur));}catch(e){}
  tick();renderInfo();
}
function applyDev(){
  $('devToggle').classList.toggle('open',devMode);
  if(!visible(planets[cur]))cur=0;
  renderInfo();
  try{localStorage.setItem('ng-dev-open',devMode?'1':'0');}catch(e){}
}
$('devToggle').addEventListener('click',function(){audio();devMode=!devMode;applyDev();});

/* 输入 */
function toGame(e){var r=cv.getBoundingClientRect();
  return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
cv.addEventListener('pointermove',function(e){var p=toGame(e);mouseX=p[0];mouseY=p[1];});
var sx0=null,sy0=null;
cv.addEventListener('pointerdown',function(e){
  audio();
  var m=toGame(e),mx=m[0],my=m[1];mouseX=mx;mouseY=my;sx0=mx;sy0=my;
  if(warp.active)return;
  if(Math.abs(mx-rocket._x)<16&&my>rocket._y-24&&my<rocket._y+12){
    var now=performance.now();
    if(now-rocket.last>1600)rocket.clicks=0;
    rocket.last=now;rocket.hop=1;
    if(++rocket.clicks>=5){rocket.clicks=0;boom();}
    return;}
  var best=-1,bd=1e9;
  for(var i=0;i<planets.length;i++){
    if(!visible(planets[i]))continue;
    var d2=(mx-planets[i].x)*(mx-planets[i].x)+(my-planets[i].y)*(my-planets[i].y);
    if(d2<bd){bd=d2;best=i;}}
  var hitR=IS_TOUCH?34:26;
  if(best>=0&&bd<=hitR*hitR)launchWarp(best);
});
cv.addEventListener('pointerup',function(e){
  if(sx0===null)return;
  var m=toGame(e),dx=m[0]-sx0,dy=m[1]-sy0;sx0=null;sy0=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)&&!warp.active)cycle(dx<0?1:-1);
});
addEventListener('keydown',function(e){
  audio();
  if(e.key==='ArrowLeft')cycle(-1);
  else if(e.key==='ArrowRight')cycle(1);
  else if(e.key==='Enter')launchWarp(cur);});
$('gEnter').addEventListener('click',function(e){
  if(warp.active)return;
  if(REDUCED)return;
  e.preventDefault();launchWarp(cur);});
function boom(){rocket.salute=2.4;shakeT=REDUCED?0:.6;whitePop=REDUCED?0:.12;tone('sine',180,40,.45,.35);
  for(var i=0;i<80;i++){var a=rnd(0,TAU),sp=rnd(18,90);
    parts.push({x:rocket._x,y:rocket._y-8,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-12,
      age:0,life:rnd(.5,1.2),s:Math.random()<.5?1:2,
      c:['#ffffff','#00e5ff','#ffd54f','#ff5c8a','#69f0ae'][Math.random()*5|0]});}}

function update(dt,t){
  gdt=dt;
  mox+=(clamp((mouseX-CX)*.05,-9,9)-mox)*Math.min(1,dt*6);
  moy+=(clamp((mouseY-SY)*.04,-7,7)-moy)*Math.min(1,dt*6);
  if(REDUCED){mox=0;moy=0;}
  rocket.hop=Math.max(0,rocket.hop-dt*2.4);
  /* 行星公转 */
  for(var i=0;i<planets.length;i++){var p=planets[i];
    p.a+=p.sp*gdt;
    var bx=CX+Math.cos(p.a)*ORBR[p.orbit],by=SPOTY+Math.sin(p.a)*ORBR[p.orbit]*.42;
    if(warp.active&&warp.i===p.i){
      bx+=(CX-bx)*warp.k;by+=(SY-by)*warp.k;}
    p.x=bx;p.y=by;
    p.pulse=Math.max(0,p.pulse-dt*2.5);}
  /* 火箭：外圈轨道巡航，永远在飞 */
  rocket.a+=.2*gdt*(REDUCED?.3:1)*(warp.active?2.5:1);
  rocket.x=CX+Math.cos(rocket.a)*168;
  rocket.y=SPOTY+Math.sin(rocket.a)*72;
  /* 跃迁 */
  if(warp.active){warp.t=Math.min(1,warp.t+dt/0.95);
    warp.k=warp.t*warp.t;
    var tp=planets[warp.i];
    var rr=tp.r*(1+warp.k*26);
    if(!flash.active&&rr>=330){flash.active=true;flash.t=.15;}}
  if(flash.active){flash.t-=dt;
    if(flash.t<=0){flash.active=false;location.href=GAMES[warp.i].href;return;}}
  if(warp.active&&!REDUCED){for(var w2=0;w2<wstars.length;w2++){var ws=wstars[w2];
    ws.d+=ws.sp*gdt*(1+warp.k*2.5);
    if(ws.d>320){ws.d=rnd(2,14);ws.a=rnd(0,TAU);ws.px=-999;ws.py=-999;}}}
  /* 尾焰 */
  var fb=warp.active?8:1.6;
  flameAcc+=dt*26*fb;
  while(flameAcc>=1){flameAcc--;
    if(parts.length<420)parts.push({x:rocket.x+rnd(-2,2),y:rocket.y+9,
      vx:rnd(-6,6),vy:rnd(26,46)+(warp.active?18:0),age:0,life:rnd(.2,.45),
      s:Math.random()<.35?2:1,
      c:Math.random()<.45?'#ffd54f':(Math.random()<.6?'#ffffff':'#ff4757')});}
  for(var pi=parts.length-1;pi>=0;pi--){var q=parts[pi];
    q.age+=dt;if(q.age>=q.life){parts.splice(pi,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-1.4*dt;q.vy*=1-1.4*dt;}
  rocket.salute=Math.max(0,rocket.salute-dt);
  shakeT=Math.max(0,shakeT-dt);whitePop=Math.max(0,whitePop-dt);
}

function drawStars(t){
  for(var i=0;i<stars.length;i++){var s=stars[i];
    var x=CX+Math.cos(s.a)*s.d+mox*s.par,y=SY+Math.sin(s.a)*s.d*.78+moy*s.par;
    var a=REDUCED?.6:(.3+.7*Math.pow(Math.sin(t*s.tw+s.ph)*.5+.5,2));
    x=((x%W)+W)%W;y=((y%H)+H)%H;
    ctx.globalAlpha=a;ctx.fillStyle=s.c;
    ctx.fillRect(x|0,y|0,s.s,s.s);}
  ctx.globalAlpha=1;
}
function drawOrbits(){
  for(var o=0;o<3;o++){
    ctx.globalAlpha=.15;ctx.strokeStyle='#4fc3ff';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(CX,SPOTY,ORBR[o],ORBR[o]*.42,0,0,TAU);ctx.stroke();}
  ctx.globalAlpha=.2;ctx.strokeStyle='#ffd54f';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(CX,SPOTY,168,72,0,0,TAU);ctx.stroke();
  ctx.globalAlpha=1;
}
function drawStarCore(t){
  var breath=.5+.5*Math.sin(t*1.8);
  var r=13*(1+.06*breath);
  var g=ctx.createRadialGradient(CX,SY,0,CX,SY,r*2.6);
  g.addColorStop(0,'#ffffff');
  g.addColorStop(.3,'#ffd54f');
  g.addColorStop(1,'rgba(255,213,79,0)');
  ctx.globalAlpha=.9;ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(CX,SY,r*2.6,0,TAU);ctx.fill();
  ctx.globalAlpha=1;
  ctx.font='12px "Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace';
  ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,10,.8)';ctx.fillText('鼠哥游戏厅',CX+1,SY+27);
  ctx.fillStyle='#ffd54f';ctx.fillText('鼠哥游戏厅',CX,SY+26);
  ctx.textAlign='left';
}
function drawPlanet(p,t){
  var G=p.g;
  var sel=p.i===cur;
  var warpK=(warp.active&&warp.i===p.i)?warp.k:0;
  var r=p.r*(1+.1*p.pulse)*(1+warpK*26);
  var x=p.x|0,y=p.y|0;
  var breath=.5+.5*Math.sin(t*2.2+p.i);
  var fade=warp.active&&warp.i!==p.i?1-warp.k:1;
  /* 大气辉光 */
  var L=[[2,.13],[5,.07],[9,.04]];
  for(var li=0;li<L.length;li++){
    ctx.globalAlpha=L[li][1]*(.75+.45*breath)*(sel?1.5:1)*fade;
    ctx.strokeStyle=G.g;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,r+L[li][0],0,TAU);ctx.stroke();}
  /* 球体 */
  ctx.globalAlpha=fade;
  var g=ctx.createRadialGradient(x-r*.38,y-r*.42,r*.1,x,y,r*1.02);
  g.addColorStop(0,shade(G.c,.5));
  g.addColorStop(.52,G.c);
  g.addColorStop(1,shade(G.c,-.55));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,'+(.38*(1-warpK*.5))+')';
  ctx.beginPath();ctx.ellipse(x-r*.42,y-r*.45,r*.16,r*.1,-.6,0,TAU);ctx.fill();
  var sh2=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.3,x,y,r*1.25);
  sh2.addColorStop(0,'rgba(0,0,12,0)');sh2.addColorStop(1,'rgba(0,0,12,.55)');
  ctx.fillStyle=sh2;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  if(G.ring&&warpK<.6){
    var rx=r*1.5,ry=r*.42,tl=-.22;
    ctx.lineWidth=2;
    ctx.strokeStyle=hexA(G.g,.5*fade);
    ctx.beginPath();ctx.ellipse(x,y,rx,ry,tl,Math.PI,TAU);ctx.stroke();
    ctx.beginPath();ctx.ellipse(x,y,rx,ry,tl,0,Math.PI);ctx.stroke();}
  /* 常显名字 */
  if(r>6&&warpK<.5){
    ctx.globalAlpha=.9*fade;
    ctx.font='12px "Fusion Pixel 12px Mono latin","Fusion Pixel 12px Mono",monospace';
    ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,10,.8)';ctx.fillText(G.t,x+1,y+r+12);
    ctx.fillStyle=sel?'#ffffff':'#cfeaff';ctx.fillText(G.t,x,y+r+11);
    ctx.textAlign='left';}
  ctx.globalAlpha=1;
}
function drawRocket(t){
  var bob=REDUCED?0:Math.sin(t*2.1)*1.6;
  var jit=warp.active?rnd(-.8,.8):0;
  var hopY=rocket.hop>0?-Math.sin((1-rocket.hop)*Math.PI)*3.2:0;
  var fade=warp.active?1-warp.k*.8:1;
  var x=(rocket.x+jit)|0,y=(rocket.y+bob+hopY+jit*.5)|0;
  rocket._x=x;rocket._y=y;
  ctx.globalAlpha=fade;
  ctx.strokeStyle='rgba(207,216,220,.85)';ctx.lineWidth=1;
  var tw=Math.sin(t*3.2)*2;
  ctx.beginPath();ctx.moveTo(x+6,y-1);ctx.quadraticCurveTo(x+13+tw,y+3,x+11+tw*.6,y+9);ctx.stroke();
  var fl=6+Math.sin(t*31)*1.5+(warp.active?7:0);
  ctx.fillStyle='#ffd54f';ctx.fillRect(x-2,y+6,4,3);
  ctx.fillStyle='rgba(255,213,79,.55)';ctx.fillRect(x-1,y+9,2,fl|0);
  ctx.fillStyle='#ffffff';ctx.fillRect(x-1,y+6,2,2);
  ctx.fillStyle='#ff4757';ctx.fillRect(x-8,y-3,3,9);ctx.fillRect(x+5,y-3,3,9);
  ctx.fillStyle='#cfd8dc';ctx.fillRect(x-5,y-14,10,18);
  ctx.fillStyle='#ffffff';ctx.fillRect(x+1,y-14,2,18);
  ctx.fillStyle='rgba(10,25,60,.25)';ctx.fillRect(x-5,y-14,2,18);
  ctx.fillStyle='#ff4757';
  ctx.fillRect(x-1,y-18,2,2);ctx.fillRect(x-3,y-16,6,2);ctx.fillRect(x-5,y-14,10,2);
  ctx.fillRect(x-5,y+1,10,2);
  ctx.fillStyle='rgba(10,25,60,.55)';ctx.fillRect(x-3,y+4,6,3);
  var look=Math.sin(t*.55)*.9;
  var blink=(t%3.4)<.14;
  var wx=x+look,wy=y-7;
  ctx.fillStyle='#08122e';ctx.beginPath();ctx.arc(wx,wy,4.5,0,TAU);ctx.fill();
  ctx.fillStyle='#cfd8dc';ctx.beginPath();ctx.arc(wx,wy+1.2,2.6,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(wx-1.7,wy-1,1.2,0,TAU);ctx.arc(wx+1.7,wy-1,1.2,0,TAU);ctx.fill();
  ctx.fillStyle='#ff9ec4';
  ctx.beginPath();ctx.arc(wx-1.7,wy-1,.6,0,TAU);ctx.arc(wx+1.7,wy-1,.6,0,TAU);ctx.fill();
  ctx.fillStyle='#08122e';
  if(blink)ctx.fillRect((wx-1.5)|0,(wy+.7)|0,3,1);
  else{ctx.fillRect((wx-1.5)|0,(wy+.6)|0,1,1);ctx.fillRect((wx+.6)|0,(wy+.6)|0,1,1);}
  ctx.strokeStyle='#00e5ff';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(wx,wy,4.5,0,TAU);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(wx-3,wy-3,1,1);
  if(rocket.salute>0){ctx.fillStyle='#cfd8dc';ctx.fillRect(x+5,y-16,2,7);
    ctx.fillStyle='#ffffff';ctx.fillRect(x+5,y-18,2,2);
    var tw2=Math.sin(t*12)*.5+.5;
    ctx.globalAlpha=.35+.65*tw2;ctx.fillStyle='#ffd54f';
    ctx.fillRect(x-5,y-26,1,1);ctx.fillRect(x+5,y-24,1,1);}
  ctx.globalAlpha=1;
}
function drawParts(){
  for(var i=0;i<parts.length;i++){var q=parts[i];var a=1-q.age/q.life;
    ctx.globalAlpha=a;ctx.fillStyle=q.c;
    var s=Math.max(1,(q.s*(0.6+a*0.4))|0);
    ctx.fillRect(q.x|0,q.y|0,s,s);}
  ctx.globalAlpha=1;
}
function drawTunnel(){
  for(var i=0;i<wstars.length;i++){var ws=wstars[i];
    var x=CX+Math.cos(ws.a)*ws.d,y=SY+Math.sin(ws.a)*ws.d*.78;
    var dx=x-ws.px,dy=y-ws.py;
    ctx.globalAlpha=.7;ctx.strokeStyle=i%3?'#ffffff':'#00e5ff';ctx.lineWidth=1;
    if(dx*dx+dy*dy>4){ctx.beginPath();ctx.moveTo(ws.px,ws.py);ctx.lineTo(x,y);ctx.stroke();}
    else ctx.fillRect(x|0,y|0,1,1);
    ws.px=x;ws.py=y;}
  ctx.globalAlpha=1;
}
function render(t){
  ctx.setTransform(1,0,0,1,0,0);
  if(shakeT>0)ctx.translate(rnd(-3,3)*shakeT*2,rnd(-3,3)*shakeT*2);
  ctx.fillStyle=bgGrad;ctx.fillRect(-8,-8,W+16,H+16);
  for(var i=0;i<nebula.length;i++){ctx.fillStyle=nebula[i];ctx.fillRect(0,0,W,H);}
  ctx.save();ctx.translate(CX,SY);ctx.rotate(-.28);
  var mg=ctx.createRadialGradient(0,0,10,0,0,240);
  mg.addColorStop(0,'rgba(140,170,255,.05)');mg.addColorStop(1,'rgba(140,170,255,0)');
  ctx.fillStyle=mg;ctx.fillRect(-260,-52,520,104);ctx.restore();
  drawStars(t);
  for(var b2=0;b2<band.length;b2++){var bn=band[b2];
    ctx.globalAlpha=bn.a*(REDUCED?.8:(.7+.3*Math.sin(t*.8+b2)));
    ctx.fillStyle='#cfd8ff';ctx.fillRect((bn.x+mox*.15)|0,(bn.y+moy*.1)|0,1,1);}
  ctx.globalAlpha=1;
  for(var b3=0;b3<brights.length;b3++){var br=brights[b3];
    var tw3=REDUCED?.6:(.5+.5*Math.sin(t*1.6+br.ph));
    var bx=(br.x+mox*.2)|0,by=(br.y+moy*.15)|0;
    ctx.globalAlpha=.5+.4*tw3;ctx.fillStyle='#ffffff';
    ctx.fillRect(bx-1,by-1,2,2);
    ctx.globalAlpha=.3*tw3;
    ctx.fillRect(bx-4,by,3,1);ctx.fillRect(bx+2,by,3,1);
    ctx.fillRect(bx,by-4,1,3);ctx.fillRect(bx,by+2,1,3);}
  ctx.globalAlpha=1;
  if(warp.active)drawTunnel();
  drawOrbits();
  /* 伪 3D 排序：远（y 小）先画，恒星夹在中间层 */
  var order=planets.filter(visible).slice().sort(function(a,b){return a.y-b.y;});
  if(warp.active){var wi=order.indexOf(planets[warp.i]);
    if(wi>=0){order.splice(wi,1);order.push(planets[warp.i]);}}
  var starDrawn=false;
  for(var oi=0;oi<order.length;oi++){
    if(!starDrawn&&order[oi].y>=SY){drawStarCore(t);starDrawn=true;}
    drawPlanet(order[oi],t);}
  if(!starDrawn)drawStarCore(t);
  drawRocket(t);
  drawParts();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
  if(whitePop>0){ctx.fillStyle='rgba(255,255,255,'+(whitePop/.12*.5)+')';ctx.fillRect(0,0,W,H);}
  if(warp.active){
    var cg=ctx.createRadialGradient(CX,SY,0,CX,SY,90+warp.k*70);
    cg.addColorStop(0,'rgba(200,245,255,'+(.12+.45*warp.k)+')');
    cg.addColorStop(1,'rgba(200,245,255,0)');
    ctx.fillStyle=cg;ctx.fillRect(0,0,W,H);}
  if(flash.active){var fa=clamp(flash.t/.15,0,1);
    ctx.fillStyle='rgba(250,252,255,'+(.96*fa)+')';ctx.fillRect(0,0,W,H);}
}
renderInfo();
applyDev();
if(IS_TOUCH)$('hint').textContent='点行星直接跃迁进入游戏 · 左右滑动浏览 · NDSHUGE © 2026';

var last=performance.now();
function frame(now){
  var dt=clamp((now-last)/1000,0,.05);last=now;
  update(dt,now/1000);render(now/1000);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
